<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<link rel="manifest" href="manifest.json">
<title>نظام الإسعاف الذكي — البوابة الموحدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
:root { --gold:#c9a227; --gold-light:#e5c158; --green:#0d4a42; --bg:#041814; --red:#e53935; }
body { background:var(--bg); color:#fff; min-height:100vh; display:flex; flex-direction:column; }
.hidden { display:none !important; }

/* شاشة الدخول */
#loginScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.logo { width:120px; height:120px; border-radius:24px; border:3px solid var(--gold); margin-bottom:20px; object-fit:contain; background:var(--green); padding:5px; }
h1 { color:var(--gold-light); font-size:24px; margin-bottom:30px; text-align:center; }
.input-group { width:100%; max-width:400px; }
input { width:100%; padding:20px; background:rgba(255,255,255,0.05); border:2px solid rgba(201,162,39,0.3); border-radius:16px; color:var(--gold-light); font-size:22px; text-align:center; font-weight:900; outline:none; margin-bottom:16px; }
input:focus { border-color:var(--gold); box-shadow:0 0 15px rgba(201,162,39,0.3); }
button { width:100%; padding:18px; border-radius:16px; border:none; font-size:18px; font-weight:900; cursor:pointer; transition:0.2s; }
button:active { transform:scale(0.98); }
.btn-gold { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--bg); }
.btn-ops { background:linear-gradient(135deg, #29b6f6, #64b5f6); color:#fff; margin-top:10px; }
.btn-admin { background:linear-gradient(135deg, #ab47bc, #ce93d8); color:#fff; margin-top:10px; }
.msg { text-align:center; margin-top:15px; font-weight:bold; font-size:14px; min-height:20px; }

/* لوحة التحكم */
#dashboard { display:flex; flex-direction:column; min-height:100vh; }
.header { background:linear-gradient(135deg, var(--green), var(--bg)); padding:20px; border-bottom:2px solid var(--gold); display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:18px; color:var(--gold-light); }
.btn-logout { width:auto; padding:8px 16px; background:var(--red); color:#fff; font-size:14px; border-radius:10px; }
.content { padding:20px; flex:1; }
.card { background:rgba(255,255,255,0.05); border:1px solid rgba(201,162,39,0.2); border-radius:16px; padding:20px; margin-bottom:15px; }
.card h3 { color:var(--gold-light); margin-bottom:10px; font-size:16px; }
.card p { font-size:13px; color:rgba(255,255,255,0.7); line-height:1.6; }
</style>
</head>
<body>

<!-- 1. شاشة الدخول -->
<div id="loginScreen">
  <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgZmlsbD0iIzBkNGE0MiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LXNpemU9IjQwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+8J+akTwvdGV4dD48L3N2Zz4='">
  <h1>البوابة الموحدة<br>للإسعاف الذكي</h1>
  
  <div class="input-group">
    <input type="text" id="codeInput" placeholder="أدخل الكود (SUP-XXXX)">
    <button class="btn-gold" onclick="loginWithCode()">دخول بالكود</button>
    <div id="msgBox" class="msg"></div>
    
    <hr style="border-color:rgba(255,255,255,0.1); margin:25px 0;">
    
    <button class="btn-ops" onclick="loginSpecial('ops')">📡 غرفة العمليات</button>
    <button class="btn-admin" onclick="loginSpecial('admin')">🏛️ الإدارة العامة</button>
  </div>
</div>

<!-- 2. لوحة التحكم (تظهر بعد الدخول) -->
<div id="dashboard" class="hidden">
  <div class="header">
    <h2 id="userGreeting">مرحباً...</h2>
    <button class="btn-logout" onclick="logout()">خروج</button>
  </div>
  <div class="content">
    <div class="card">
      <h3>✅ تم تسجيل الدخول بنجاح</h3>
      <p id="userInfoText"></p>
    </div>
    
    <!-- محتوى لوحة المشرف -->
    <div id="supervisorPanel" class="hidden">
      <div class="card">
        <h3>👨‍💼 لوحة المشرف الميداني</h3>
        <p>مرحباً بك. هنا يمكنك تسجيل الإشكاليات ومتابعة مراكزك.</p>
      </div>
    </div>

    <!-- محتوى لوحة الإدارة -->
    <div id="adminPanel" class="hidden">
      <div class="card">
        <h3>🏛️ لوحة الإدارة العامة</h3>
        <p>مرحباً بك. هنا يمكنك إدارة المستخدمين والأكواد.</p>
      </div>
    </div>
  </div>
</div>

<script>
const FIREBASE_PROJECT = "ambulance-supervisor";
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;

// دالة قراءة البيانات من Firebase
function fromFS(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return parseInt(v.integerValue);
  if ("booleanValue" in v) return v.booleanValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromFS);
  if ("mapValue" in v) { const o = {}; for (const k in v.mapValue.fields || {}) o[k] = fromFS(v.mapValue.fields[k]); return o; }
  return null;
}
function docToObj(doc) { const obj = {}; if (!doc.fields) return obj; for (const k in doc.fields) obj[k] = fromFS(doc.fields[k]); return obj; }

// دالة عرض الرسائل
function showMsg(text, color = "#ff5252") {
  document.getElementById("msgBox").innerHTML = `<span style="color:${color}">${text}</span>`;
}

// 1. الدخول بالكود (للمشرفين والضباط والمراكز)
async function loginWithCode() {
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  if (!code) return showMsg("أدخل الكود أولاً");
  
  showMsg("جاري التحقق...", "#e5c158");
  
  try {
    const filterStr = JSON.stringify({"fieldFilter":{"field":{"fieldPath":"code"},"op":"EQUAL","value":{"stringValue":code}}});
    const res = await fetch(`${FIRESTORE_URL}/access_codes?pageSize=1&where=${encodeURIComponent(filterStr)}`, { cache: "no-store" });
    
    const data = await res.json();
    if (!data.documents || data.documents.length === 0) {
      return showMsg("الكود غير صحيح أو غير موجود");
    }
    
    const user = docToObj(data.documents[0]);
    if (user.active === false) return showMsg("هذا الكود معطل");
    
    // حفظ الجلسة
    localStorage.setItem("amb_user", JSON.stringify(user));
    sessionStorage.setItem("amb_user", JSON.stringify(user));
    
    // عرض اللوحة
    showDashboard(user);
    
  } catch (e) {
    showMsg("خطأ في الاتصال بالشبكة");
  }
}

// 2. الدخول الخاص (لإدارة والعمليات)
async function loginSpecial(type) {
  const pwd = prompt(type === 'admin' ? 'أدخل كلمة مرور الإدارة:' : 'أدخل كلمة مرور العمليات:');
  if (!pwd) return;
  
  if (type === 'admin' && (pwd === 'supervisor2025' || pwd === 'admin2025' || pwd === '123456')) {
    const user = { name: "الإدارة العامة", role: "admin", type: "admin" };
    localStorage.setItem("amb_user", JSON.stringify(user));
    sessionStorage.setItem("amb_user", JSON.stringify(user));
    showDashboard(user);
  } 
  else if (type === 'ops' && pwd === 'ops2025') {
    const user = { name: "غرفة العمليات", role: "ops", type: "ops" };
    localStorage.setItem("amb_user", JSON.stringify(user));
    sessionStorage.setItem("amb_user", JSON.stringify(user));
    showDashboard(user);
  } 
  else {
    alert("كلمة المرور خاطئة!");
  }
}

// 3. عرض اللوحة
function showDashboard(user) {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  
  document.getElementById("userGreeting").innerText = "مرحباً، " + (user.name || user.supervisor || "مستخدم");
  document.getElementById("userInfoText").innerText = "نوع الحساب: " + (user.type || user.role) + " | الكود: " + (user.code || "—");
  
  // إظهار اللوحة المناسبة
  if (user.type === "admin" || user.role === "admin") {
    document.getElementById("adminPanel").classList.remove("hidden");
  } else {
    document.getElementById("supervisorPanel").classList.remove("hidden");
  }
}

// 4. الخروج
function logout() {
  localStorage.removeItem("amb_user");
  sessionStorage.removeItem("amb_user");
  location.reload();
}
</script>
</body>
</html>
