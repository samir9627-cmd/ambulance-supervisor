<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#041814">
<meta name="apple-mobile-web-app-title" content="نظام الإسعاف">
<link rel="apple-touch-icon" href="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg">
<title>نظام الإسعاف الذكي — هيئة الدفاع المدني والإسعاف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Segoe UI',Tahoma,sans-serif; }
  :root {
    --gold:#c9a227; --gold-light:#e5c158; --gold-bright:#ffd966;
    --green:#0d4a42; --green-dark:#082b26; --green-deep:#041814;
    --emerald:#0a5a3a; --emerald-light:#69f0ae;
    --red:#e53935; --red-light:#ff5252;
    --amber:#fb8c00;
    --blue:#29b6f6;
    --surface:rgba(13,74,66,0.55);
    --border:rgba(201,162,39,0.35);
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  html, body {
    background:var(--green-deep); color:#fff; font-weight:600;
    min-height:100vh; overflow-x:hidden;
  }
  body {
    display:flex; flex-direction:column; align-items:center;
    padding:calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
    position:relative;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,162,39,0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(10,90,58,0.6) 0%, transparent 50%),
      linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%);
  }
  body::after {
    content:''; position:fixed; inset:0; z-index:-1;
    background-image:
      linear-gradient(rgba(201,162,39,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,39,0.04) 1px, transparent 1px);
    background-size:50px 50px;
    animation:gridMove 30s linear infinite;
    pointer-events:none;
  }
  @keyframes gridMove { from{background-position:0 0;} to{background-position:50px 50px;} }

  /* ═══════════ الحاوية الرئيسية ═══════════ */
  .wrap {
    width:100%; max-width:520px;
    display:flex; flex-direction:column; gap:20px;
    animation:fadeUp 0.6s cubic-bezier(.4,0,.2,1);
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* ═══════════ الهيدر / الشعار ═══════════ */
  .header {
    text-align:center;
    padding:22px 20px;
    background:linear-gradient(145deg, rgba(13,74,66,0.65), rgba(4,24,20,0.95));
    border:2px solid var(--border);
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(201,162,39,0.12);
    position:relative; overflow:hidden;
  }
  .header::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), var(--gold-bright), var(--gold), transparent);
    background-size:200% 100%;
    animation:shineLine 3s linear infinite;
  }
  @keyframes shineLine {
    0% { background-position:-200% 0; }
    100% { background-position:200% 0; }
  }

  .logo-wrap {
    position:relative; display:inline-block; margin-bottom:14px;
  }
  .logo-wrap::before {
    content:''; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:180px; height:180px;
    background:radial-gradient(circle, rgba(201,162,39,0.35) 0%, transparent 70%);
    border-radius:50%;
    animation:logoGlow 3s infinite;
    z-index:-1;
  }
  @keyframes logoGlow {
    0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.5; }
    50%     { transform:translate(-50%,-50%) scale(1.2); opacity:1; }
  }

  .logo {
    width:120px; height:120px;
    object-fit:contain;
    border-radius:22px;
    background:linear-gradient(145deg, #0a5a3a, #064a2e);
    padding:10px;
    border:3px solid rgba(201,162,39,0.6);
    filter:drop-shadow(0 0 25px rgba(201,162,39,0.8)) drop-shadow(0 0 50px rgba(201,162,39,0.35));
    animation:logoFloat 3s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-6px); }
  }

  .title {
    font-size:22px;
    color:var(--gold-light);
    font-weight:900;
    margin-bottom:6px;
    letter-spacing:0.5px;
    text-shadow:0 0 20px rgba(201,162,39,0.5);
  }
  .subtitle {
    font-size:13px;
    color:rgba(255,255,255,0.85);
    font-weight:700;
    margin-bottom:4px;
    letter-spacing:1px;
  }
  .brand {
    font-size:11px;
    color:rgba(255,255,255,0.6);
    letter-spacing:2px;
    margin-top:6px;
  }
  .flag-strip {
    display:inline-flex; gap:3px; margin-top:10px;
  }
  .flag-strip span {
    width:22px; height:4px; border-radius:2px;
  }

  /* ═══════════ عنوان القسم ═══════════ */
  .section-title {
    text-align:center;
    font-size:14px;
    color:var(--gold-light);
    font-weight:900;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .section-title::before,
  .section-title::after {
    content:'';
    flex:1;
    max-width:60px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--border));
  }
  .section-title::after {
    background:linear-gradient(90deg, var(--border), transparent);
  }

  /* ═══════════ بطاقة الأزرار ═══════════ */
  .card {
    background:linear-gradient(145deg, rgba(13,74,66,0.55), rgba(4,24,20,0.9));
    border:1px solid var(--border);
    border-radius:22px;
    padding:20px 16px;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
  }

  .roles-grid {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }

  .role-btn {
    background:linear-gradient(145deg, rgba(4,24,20,0.9), rgba(13,74,66,0.6));
    border:2px solid rgba(201,162,39,0.25);
    border-radius:16px;
    padding:16px 8px;
    cursor:pointer;
    transition:all 0.25s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-family:inherit;
    color:#fff;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .role-btn::before {
    content:''; position:absolute; top:0; left:0; right:0; height:100%;
    background:linear-gradient(135deg, transparent, rgba(201,162,39,0.1), transparent);
    transform:translateX(-100%);
    transition:transform 0.6s;
  }
  .role-btn:hover::before { transform:translateX(100%); }
  .role-btn:active { transform:scale(0.95); }
  .role-btn:hover {
    border-color:var(--gold);
    box-shadow:0 8px 25px rgba(201,162,39,0.3);
    transform:translateY(-3px);
  }

  .role-icon {
    font-size:32px;
    line-height:1;
    filter:drop-shadow(0 0 10px rgba(201,162,39,0.5));
    transition:transform 0.3s;
  }
  .role-btn:hover .role-icon { transform:scale(1.15) rotate(-5deg); }
  .role-name {
    font-size:12px;
    font-weight:900;
    color:var(--gold-light);
    letter-spacing:0.3px;
  }
  .role-desc {
    font-size:9px;
    color:rgba(255,255,255,0.55);
    font-weight:600;
    line-height:1.3;
  }

  /* ألوان خاصة */
  .role-btn.admin   .role-icon { filter:drop-shadow(0 0 10px rgba(255,215,0,0.8)); }
  .role-btn.ops     .role-icon { filter:drop-shadow(0 0 10px rgba(41,182,246,0.8)); }
  .role-btn.center  .role-icon { filter:drop-shadow(0 0 10px rgba(76,175,80,0.8)); }
  .role-btn.officer .role-icon { filter:drop-shadow(0 0 10px rgba(255,138,128,0.8)); }
  .role-btn.sup     .role-icon { filter:drop-shadow(0 0 10px rgba(201,162,39,0.9)); }
  .role-btn.stats   .role-icon { filter:drop-shadow(0 0 10px rgba(171,71,188,0.8)); }

  /* ═══════════ بطاقة كود الدخول ═══════════ */
  .code-card {
    background:linear-gradient(145deg, rgba(13,74,66,0.7), rgba(4,24,20,0.95));
    border:2px solid rgba(201,162,39,0.4);
    border-radius:22px;
    padding:22px 20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.5), 0 0 40px rgba(201,162,39,0.1);
  }
  .code-label {
    display:block;
    font-size:13px;
    color:var(--gold-light);
    font-weight:900;
    margin-bottom:12px;
    text-align:center;
  }
  .code-input-wrap {
    position:relative;
    margin-bottom:14px;
  }
  .code-input {
    width:100%;
    padding:18px 50px 18px 16px;
    background:rgba(4,24,20,0.85);
    border:2px solid rgba(201,162,39,0.35);
    border-radius:14px;
    color:var(--gold-light);
    font-size:20px;
    font-weight:900;
    text-align:center;
    letter-spacing:3px;
    font-family:'Courier New', monospace;
    outline:none;
    transition:all 0.3s;
    text-transform:uppercase;
  }
  .code-input:focus {
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(201,162,39,0.2), 0 0 30px rgba(201,162,39,0.3);
    background:rgba(4,24,20,0.95);
  }
  .code-input::placeholder {
    letter-spacing:2px;
    font-size:14px;
    opacity:0.4;
    text-transform:none;
  }
  .code-icon {
    position:absolute;
    top:50%; right:16px;
    transform:translateY(-50%);
    font-size:22px;
    pointer-events:none;
    opacity:0.7;
    transition:0.3s;
  }
  .code-input:focus ~ .code-icon { opacity:1; transform:translateY(-50%) scale(1.1); }

  .btn-enter {
    width:100%;
    padding:16px;
    background:linear-gradient(135deg, var(--gold), var(--gold-light));
    color:var(--green-deep);
    border:none;
    border-radius:14px;
    font-family:inherit;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:all 0.25s;
    box-shadow:0 10px 30px rgba(201,162,39,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    letter-spacing:0.5px;
  }
  .btn-enter:hover:not(:disabled) {
    transform:translateY(-2px);
    box-shadow:0 14px 40px rgba(201,162,39,0.55);
  }
  .btn-enter:active:not(:disabled) {
    transform:translateY(0) scale(0.98);
  }
  .btn-enter:disabled {
    opacity:0.6;
    cursor:not-allowed;
  }

  .code-hint {
    text-align:center;
    font-size:10px;
    color:rgba(255,255,255,0.5);
    margin-top:12px;
    line-height:1.6;
  }

  /* ═══════════ رسالة الخطأ ═══════════ */
  .msg-box {
    margin-top:12px;
    padding:12px 16px;
    border-radius:12px;
    font-size:12px;
    font-weight:700;
    display:none;
    align-items:center;
    gap:8px;
    animation:shake 0.4s;
  }
  .msg-box.show { display:flex; }
  .msg-box.error {
    background:rgba(229,57,53,0.15);
    border:1px solid rgba(229,57,53,0.5);
    color:#ff8a80;
  }
  .msg-box.success {
    background:rgba(67,160,71,0.15);
    border:1px solid rgba(67,160,71,0.5);
    color:#69f0ae;
  }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25%     { transform:translateX(-6px); }
    75%     { transform:translateX(6px); }
  }

  /* ═══════════ حالة الاتصال ═══════════ */
  .status {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:11px;
    color:rgba(255,255,255,0.6);
    padding:10px;
  }
  .status-dot {
    width:8px; height:8px; border-radius:50%;
    background:#69f0ae;
    box-shadow:0 0 10px #69f0ae;
    animation:dotPulse 2s infinite;
  }
  .status-dot.offline { background:#ff5252; box-shadow:0 0 10px #ff5252; }
  .status-dot.checking {
    background:#ffa726;
    box-shadow:0 0 10px #ffa726;
    animation:dotPulse 0.8s infinite;
  }
  @keyframes dotPulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%     { opacity:0.5; transform:scale(0.85); }
  }

  /* ═══════════ التذييل ═══════════ */
  .footer {
    text-align:center;
    font-size:10px;
    color:rgba(255,255,255,0.4);
    line-height:1.8;
    padding:10px 0;
    letter-spacing:0.5px;
  }
  .footer strong {
    color:var(--gold-light);
    font-weight:900;
  }

  /* ═══════════ زر الوضع الليلي ═══════════ */
  .theme-toggle {
    position:fixed;
    top:calc(14px + var(--safe-top));
    left:14px;
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid rgba(201,162,39,0.35);
    background:rgba(4,24,20,0.7);
    backdrop-filter:blur(10px);
    color:var(--gold-light);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    transition:all 0.3s;
    z-index:100;
  }
  .theme-toggle:hover {
    background:rgba(201,162,39,0.25);
    transform:rotate(20deg) scale(1.05);
  }

  /* ═══════════ Loading ═══════════ */
  .loading-overlay {
    position:fixed; inset:0;
    background:linear-gradient(135deg, #041814, #0a5a3a, #082b26);
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
  }
  .loading-overlay.show { display:flex; }
  .spinner {
    width:60px; height:60px;
    border:4px solid rgba(201,162,39,0.2);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text {
    color:var(--gold-light);
    font-size:14px;
    font-weight:900;
    letter-spacing:2px;
  }

  /* ═══════════ Responsive ═══════════ */
  @media (max-width:400px) {
    .logo { width:100px; height:100px; }
    .title { font-size:19px; }
    .role-icon { font-size:28px; }
    .role-name { font-size:11px; }
    .code-input { font-size:17px; letter-spacing:2px; }
  }
</style>
</head>
<body>

<!-- زر الوضع الليلي -->
<button class="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع" id="themeBtn">
  🌙
</button>

<!-- شاشة تحميل -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">جاري التحقق...</div>
</div>

<div class="wrap">

  <!-- ═══════════ الهيدر / الشعار ═══════════ -->
  <div class="header">
    <div class="logo-wrap">
      <img id="mainLogo"
           src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg"
           alt="شعار هيئة الدفاع المدني والإسعاف"
           class="logo">
    </div>

    <h1 class="title">نظام الإسعاف الذكي</h1>
    <div class="subtitle">هيئة الدفاع المدني والإسعاف</div>
    <div class="brand">الإدارة العامة للإسعاف</div>

    <div class="flag-strip">
      <span style="background:#c9a227;"></span>
      <span style="background:#ffffff;"></span>
      <span style="background:#0a5a3a;"></span>
    </div>
  </div>

  <!-- ═══════════ بطاقة الأزرار ═══════════ -->
  <div class="card">
    <div class="section-title">اختر دورك للدخول</div>

    <div class="roles-grid">

      <button class="role-btn sup" onclick="gotoLogin('supervisor')" title="المشرف الميداني">
        <span class="role-icon">👨‍💼</span>
        <span class="role-name">المشرف</span>
        <span class="role-desc">تسجيل إشكاليات</span>
      </button>

      <button class="role-btn officer" onclick="gotoLogin('officer')" title="ضابط المركز">
        <span class="role-icon">🎖️</span>
        <span class="role-name">الضابط</span>
        <span class="role-desc">إدارة مركزك</span>
      </button>

      <button class="role-btn center" onclick="gotoLogin('center')" title="لوحة المركز">
        <span class="role-icon">🏥</span>
        <span class="role-name">المركز</span>
        <span class="role-desc">بلاغات ومخزن</span>
      </button>

      <button class="role-btn ops" onclick="gotoLogin('ops')" title="غرفة العمليات">
        <span class="role-icon">📡</span>
        <span class="role-name">العمليات</span>
        <span class="role-desc">شاشة مباشرة</span>
      </button>

      <button class="role-btn stats" onclick="gotoLogin('infographic')" title="الإحصائيات">
        <span class="role-icon">📊</span>
        <span class="role-name">الإحصاءات</span>
        <span class="role-desc">تقارير شاملة</span>
      </button>

      <button class="role-btn admin" onclick="gotoLogin('admin')" title="الإدارة العامة">
        <span class="role-icon">🏛️</span>
        <span class="role-name">الإدارة</span>
        <span class="role-desc">مركز التحكم</span>
      </button>

    </div>
  </div>

  <!-- ═══════════ بطاقة كود الدخول ═══════════ -->
  <div class="code-card">
    <label class="code-label">🔐 أو أدخل كود الدخول</label>

    <div class="code-input-wrap">
      <input type="text"
             id="codeInput"
             class="code-input"
             placeholder="مثال: ABC123"
             autocomplete="off"
             autocapitalize="characters"
             spellcheck="false"
             maxlength="20">
      <span class="code-icon">🔑</span>
    </div>

    <button class="btn-enter" id="loginBtn" onclick="loginWithCode()">
      <span>✅</span>
      <span>دخول النظام</span>
    </button>

    <div class="msg-box" id="msgBox"></div>

    <div class="code-hint">
      الكود يُمنح من الإدارة • للاستفسار تواصل مع المشرف العام
    </div>
  </div>

  <!-- ═══════════ حالة الاتصال ═══════════ -->
  <div class="status">
    <span class="status-dot checking" id="statusDot"></span>
    <span id="statusText">جارٍ الفحص...</span>
  </div>

  <!-- ═══════════ التذييل ═══════════ -->
  <div class="footer">
    <div><strong>هيئة الدفاع المدني والإسعاف</strong></div>
    <div>الإدارة العامة للإسعاف</div>
    <div style="margin-top:6px; opacity:0.6;">© 2026 — جميع الحقوق محفوظة</div>
    <div style="margin-top:4px; opacity:0.4; font-size:9px;">نظام الإسعاف الذكي v10.0</div>
  </div>

</div>

<script>
/* ============================================================
   الإعدادات
   ============================================================ */
const FIREBASE_PROJECT = "ambulance-supervisor";
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;
const VERSION = "10.0.0";

/* ═══════════ الوضع الليلي ═══════════ */
function toggleTheme() {
  const html = document.documentElement;
  const cur = html.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
}
(function initTheme() {
  const saved = localStorage.getItem("theme");
  const hour = new Date().getHours();
  const auto = (hour >= 19 || hour < 6) ? "dark" : "light";
  const theme = saved || auto;
  if (theme === "dark") {
    document.getElementById("themeBtn").textContent = "☀️";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();

/* ═══════════ Firestore REST ═══════════ */
function fromFSValue(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return parseInt(v.integerValue);
  if ("doubleValue" in v) return parseFloat(v.doubleValue);
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromFSValue);
  if ("mapValue" in v) {
    const o = {};
    for (const k in v.mapValue.fields || {}) o[k] = fromFSValue(v.mapValue.fields[k]);
    return o;
  }
  return null;
}

function docToObj(doc) {
  const obj = {};
  if (!doc.fields) return obj;
  for (const k in doc.fields) obj[k] = fromFSValue(doc.fields[k]);
  obj._id = doc.name.split("/").pop();
  return obj;
}

async function fsFetch(url) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(url, { signal: controller.signal, cache: "no-store" });
    clearTimeout(tid);
    return res;
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

async function fsList(col) {
  const res = await fsFetch(`${FIRESTORE_URL}/${col}?pageSize=500`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const d = await res.json();
  return (d.documents || []).map(docToObj);
}

/* ═══════════ رسائل ═══════════ */
function showMsg(text, type = "error") {
  const box = document.getElementById("msgBox");
  box.className = "msg-box show " + type;
  const icon = type === "error" ? "⚠️" : "✅";
  box.innerHTML = `<span>${icon}</span><span>${text}</span>`;
}

function clearMsg() {
  const box = document.getElementById("msgBox");
  box.className = "msg-box";
  box.innerHTML = "";
}

/* ═══════════ التنقل السريع حسب الدور ═══════════ */
function gotoLogin(role) {
  // نمرر الدور في الـ hash — الصفحة تعرف أنها مطلوبة
  // admin.html و ops.html و infographic.html لها شاشة خاصة
  if (role === "admin") {
    location.href = "admin.html";
    return;
  }
  if (role === "ops") {
    location.href = "ops.html";
    return;
  }
  if (role === "infographic") {
    location.href = "infographic.html";
    return;
  }
  if (role === "supervisor") {
    showMsg("👨‍💼 أدخل كود المشرف (6 أحرف) ثم اضغط دخول", "success");
    document.getElementById("codeInput").focus();
    window._expectedRole = "supervisor";
    return;
  }
  if (role === "officer") {
    showMsg("🎖️ أدخل كود الضابط (OFF...) ثم اضغط دخول", "success");
    document.getElementById("codeInput").focus();
    window._expectedRole = "officer";
    return;
  }
  if (role === "center") {
    showMsg("🏥 أدخل كود المركز (XXX-CEN-XXXX) ثم اضغط دخول", "success");
    document.getElementById("codeInput").focus();
    window._expectedRole = "center";
    return;
  }
}

/* ═══════════ تسجيل الدخول بالكود ═══════════ */
async function loginWithCode() {
  const input = document.getElementById("codeInput");
  const code = input.value.trim().toUpperCase();
  const btn = document.getElementById("loginBtn");

  clearMsg();

  if (!code) {
    showMsg("الرجاء إدخال كود الدخول", "error");
    input.focus();
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span>⏳</span><span>جاري التحقق...</span>`;

  try {
    // جلب كل الأكواد من access_codes
    const codes = await fsList("access_codes").catch(() => []);

    // البحث عن الكود
    const found = codes.find(c => {
      const cCode = (c.code || "").toUpperCase();
      return cCode === code;
    });

    if (!found) {
      showMsg("كود غير صالح — تأكد من الكود", "error");
      btn.disabled = false;
      btn.innerHTML = `<span>✅</span><span>دخول النظام</span>`;
      input.select();
      return;
    }

    if (found.active === false) {
      showMsg("هذا الكود معطّل — تواصل مع الإدارة", "error");
      btn.disabled = false;
      btn.innerHTML = `<span>✅</span><span>دخول النظام</span>`;
      return;
    }

    // تحديد نوع الكود والصفحة
    let targetPage = "";
    let userInfo = {};

    // أنواع الأكواد:
    // - type: "center" → center.html
    // - type: "officer" → officer.html
    // - type: "admin" → admin.html
    // - supervisor (افتراضي) → app.html

    if (found.type === "center") {
      targetPage = "center.html";
      userInfo = {
        code: found.code,
        type: "center",
        name: found.centerName || found.supervisor || "مركز",
        centerName: found.centerName || "",
        centerCode: found.centerCode || "",
        id: found._id
      };
    } else if (found.type === "officer") {
      targetPage = "officer.html";
      userInfo = {
        code: found.code,
        type: "officer",
        name: found.name || "ضابط",
        centerName: found.center || "",
        id: found._id
      };
    } else if (found.type === "admin" || found.role === "admin") {
      targetPage = "admin.html";
      userInfo = {
        code: found.code,
        type: "admin",
        name: found.name || "الإدارة",
        id: found._id
      };
    } else {
      // مشرف ميداني (افتراضي)
      targetPage = "app.html";
      userInfo = {
        code: found.code,
        type: "supervisor",
        name: found.supervisor || found.name || "مشرف",
        id: found._id
      };
    }

    // حفظ الجلسة
    sessionStorage.setItem("amb_user", JSON.stringify(userInfo));
    sessionStorage.setItem("amb_login_time", Date.now().toString());

    showMsg(`✅ مرحباً ${userInfo.name}`, "success");

    // تحويل بعد لحظة
    setTimeout(() => {
      location.href = targetPage;
    }, 600);

  } catch(e) {
    console.error("Login error:", e);
    showMsg("تعذّر الاتصال — تحقق من الشبكة", "error");
    btn.disabled = false;
    btn.innerHTML = `<span>✅</span><span>دخول النظام</span>`;
  }
}

/* ═══════════ فحص الاتصال ═══════════ */
async function checkConnection() {
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");

  dot.className = "status-dot checking";
  text.textContent = "جارٍ الفحص...";

  try {
    const res = await fsFetch(`${FIRESTORE_URL}/settings?pageSize=1`);
    if (res.ok) {
      dot.className = "status-dot";
      text.textContent = "متصل بـ Firebase";
    } else {
      throw new Error("HTTP " + res.status);
    }
  } catch(e) {
    dot.className = "status-dot offline";
    text.textContent = "غير متصل — تحقق من الشبكة";
  }
}

/* ═══════════ الأحداث ═══════════ */
document.getElementById("codeInput").addEventListener("keypress", e => {
  if (e.key === "Enter") loginWithCode();
});
document.getElementById("codeInput").addEventListener("input", function() {
  this.value = this.value.toUpperCase();
  clearMsg();
});

setInterval(checkConnection, 30000);
