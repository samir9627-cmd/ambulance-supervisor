<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#dc2626">
  <meta name="description" content="نظام إسعاف عمان الذكي — بوابة الدخول الموحّدة">
  <title>🚑 نظام إسعاف عمان الذكي</title>

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- الأيقونة -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚑%3C/text%3E%3C/svg%3E">

  <!-- التنسيقات -->
  <link rel="stylesheet" href="./style.css">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <style>
    /* ============================================================
       تصميم خاص بصفحة الدخول
       ============================================================ */
    body {
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #7f1d1d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية متحركة */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,.06) 0%, transparent 50%);
      pointer-events: none;
      animation: bgShift 20s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0%   { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(5deg); }
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      animation: loginIn .6s cubic-bezier(.4,0,.2,1);
    }

    @keyframes loginIn {
      from { opacity: 0; transform: translateY(30px) scale(.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: rgba(255,255,255,.98);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2rem 1.75rem;
      box-shadow:
        0 25px 60px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.15) inset;
    }

    [data-theme="dark"] .login-card {
      background: rgba(30,41,59,.98);
    }

    /* الشعار */
    .logo-wrap {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .logo-circle {
      width: 90px;
      height: 90px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.75rem;
      box-shadow:
        0 10px 30px rgba(220,38,38,.4),
        0 0 0 8px rgba(220,38,38,.1);
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 10px 30px rgba(220,38,38,.4), 0 0 0 8px rgba(220,38,38,.1); }
      50%      { box-shadow: 0 10px 40px rgba(220,38,38,.6), 0 0 0 14px rgba(220,38,38,.08); }
    }

    .logo-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: .25rem;
      letter-spacing: -.02em;
    }

    .logo-sub {
      font-size: .92rem;
      color: var(--text-light);
    }

    .flag-strip {
      display: inline-flex;
      gap: 3px;
      margin-top: .6rem;
    }

    .flag-strip span {
      width: 18px;
      height: 4px;
      border-radius: 2px;
      display: block;
    }

    /* النموذج */
    .input-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    .input-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
      transition: color .25s;
    }

    .input-wrap:focus-within .input-icon {
      color: var(--primary);
    }

    #codeInput {
      width: 100%;
      padding: 1.05rem 3rem 1.05rem 1rem;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-family: var(--font);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: .35rem;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      transition: all .25s;
    }

    #codeInput:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(220,38,38,.15);
    }

    #codeInput::placeholder {
      letter-spacing: .35rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* زر الدخول */
    #loginBtn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #fff;
      font-family: var(--font);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      transition: all .3s;
      box-shadow: 0 6px 18px rgba(220,38,38,.35);
      margin-top: 1rem;
    }

    #loginBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(220,38,38,.45);
    }

    #loginBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #loginBtn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    /* رسالة الخطأ */
    #errBox {
      margin-top: 1rem;
      min-height: 0;
    }

    #errBox .alert {
      animation: shake .4s ease;
      margin: 0;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* الحالة */
    #statusBox {
      text-align: center;
      margin-top: 1rem;
      font-size: .85rem;
      color: var(--text-light);
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-left: .4rem;
      transition: background .3s;
    }

    .dot.online  { background: #16a34a; box-shadow: 0 0 8px #16a34a; }
    .dot.offline { background: #dc2626; box-shadow: 0 0 8px #dc2626; }

    /* تذييل */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: rgba(255,255,255,.85);
      font-size: .8rem;
    }

    .login-footer a {
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
    }

    /* زر الوضع الليلي */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 100;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.2);
      backdrop-filter: blur(10px);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .25s;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,.35);
      transform: rotate(20deg);
    }

    /* قائمة الصفحات (للاختبار) */
    .pages-hint {
      text-align: center;
      margin-top: 1rem;
      font-size: .78rem;
      color: var(--text-muted);
    }

    .pages-hint code {
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: var(--primary);
    }

    @media (max-width: 480px) {
      .login-card { padding: 1.5rem 1.25rem; }
      .logo-circle { width: 70px; height: 70px; font-size: 2rem; }
      .logo-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- زر الوضع الليلي -->
  <button class="theme-toggle" id="themeBtn" title="تبديل الوضع">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="login-wrap">
    <div class="login-card">

      <!-- الشعار -->
      <div class="logo-wrap">
        <div class="logo-circle">🚑</div>
        <h1 class="logo-title">نظام إسعاف عمان الذكي</h1>
        <p class="logo-sub">Smart Ambulance System</p>
        <div class="flag-strip">
          <span style="background:#dc2626;"></span>
          <span style="background:#ffffff;border:1px solid #ddd;"></span>
          <span style="background:#16a34a;"></span>
        </div>
      </div>

      <!-- النموذج -->
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="codeInput" inputmode="numeric"
               autocomplete="off" maxlength="12" placeholder="• • • • • •"
               aria-label="كود الدخول">
      </div>

      <button id="loginBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        دخول النظام
      </button>

      <div id="errBox"></div>

      <div id="statusBox">
        <span class="dot" id="netDot"></span>
        <span id="netText">جارٍ الفحص...</span>
      </div>

      <!-- تلميح الصفحات (يمكن إزالته لاحقاً) -->
      <div class="pages-hint">
        بعد الدخول ستحوَّل تلقائياً إلى الصفحة المناسبة لدورك
      </div>
    </div>

    <div class="login-footer">
      © 2026 نظام إسعاف عمان الذكي — جميع الحقوق محفوظة
    </div>
  </div>

  <!-- ============================================================
       السكربت
       ============================================================ -->
  <script type="module">
    import {
      verifyCode, saveSession, pingFirestore, COL, db, doc, getDoc, setDoc, serverTimestamp
    } from "./firebase-config.js";

    import { applyTheme, toggleTheme, toast, beep, SharedUI } from "./shared-ui.js";

    /* ---------- تطبيق الوضع المحفوظ ---------- */
    applyTheme();

    /* ---------- زر الوضع الليلي ---------- */
    document.getElementById("themeBtn").onclick = () => {
      toggleTheme();
    };

    /* ---------- عناصر الصفحة ---------- */
    const inp      = document.getElementById("codeInput");
    const btn      = document.getElementById("loginBtn");
    const errBox   = document.getElementById("errBox");
    const netDot   = document.getElementById("netDot");
    const netText  = document.getElementById("netText");

    /* ---------- فحص الاتصال بـ Firestore ---------- */
    async function checkNet() {
      netText.textContent = "جارٍ الفحص...";
      netDot.className = "dot";
      try {
        const ok = await pingFirestore();
        if (ok) {
          netDot.className = "dot online";
          netText.textContent = "متصل بـ Firebase";
        } else {
          throw new Error("فشل الاتصال");
        }
      } catch (e) {
        netDot.className = "dot offline";
        netText.textContent = "غير متصل — تحقق من الشبكة";
      }
    }
    checkNet();
    setInterval(checkNet, 30000);

    /* ---------- توجيه حسب الدور ---------- */
    function routeByRole(user) {
      const role = String(user.role || "").toLowerCase().trim();

      // دعم أسماء متعددة لكل دور
      const routes = {
        // المسعف / المشرف الميداني
        "paramedic":  "app.html",
        "مسعف":       "app.html",
        "medic":      "app.html",
        "ambulance":  "app.html",

        // صفحة المركز (مداومات + بلاغات)
        "center":     "center.html",
        "مركز":        "center.html",
        "center_admin":"center.html",

        // الضابط
        "officer":    "officer.html",
        "ضابط":       "officer.html",
        "supervisor": "officer.html",
        "مشرف":        "officer.html",

        // المدير
        "admin":      "admin.html",
        "مدير":        "admin.html",
        "manager":    "admin.html",

        // غرفة العمليات
        "ops":        "ops.html",
        "operations": "ops.html",
        "عمليات":      "ops.html",
        "غرفة":        "ops.html"
      };

      return routes[role] || "app.html";
    }

    /* ---------- تسجيل الدخول ---------- */
    async function doLogin() {
      const code = inp.value.trim();
      if (!code) {
        showError("الرجاء إدخال كود الدخول");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<div class="loader" style="width:20px;height:20px;border-width:3px;border-top-color:#fff;border-color:rgba(255,255,255,.3);border-top-color:#fff;"></div>`;
      errBox.innerHTML = "";

      try {
        const user = await verifyCode(code);

        if (!user) {
          throw new Error("كود غير صالح أو معطّل");
        }

        // تحقق من صلاحية إضافية (اختياري)
        if (user.expiresAt) {
          const exp = user.expiresAt.toDate ? user.expiresAt.toDate() : new Date(user.expiresAt);
          if (exp < new Date()) {
            throw new Error("انتهت صلاحية الكود — تواصل مع المدير");
          }
        }

        // حفظ الجلسة
        const sessionUser = {
          id:        user.id,
          name:      user.name || user.code,
          role:      user.role || "paramedic",
          centerId:  user.centerId || "",
          centerName:user.centerName || "",
          paramedicId: user.paramedicId || "",
          vehicleCode: user.vehicleCode || "",
          loginAt:   Date.now()
        };

        saveSession(sessionUser);
        await logLogin(sessionUser);

        beep("success");
        showSuccess(`✅ مرحباً ${sessionUser.name}`);

        // توجيه
        setTimeout(() => {
          const target = routeByRole(sessionUser);
          location.href = target;
        }, 700);

      } catch (e) {
        console.error("Login error:", e);
        beep("danger");
        showError(e.message || "فشل تسجيل الدخول");
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          دخول النظام
        `;
        inp.select();
      }
    }

    /* ---------- سجل تسجيل الدخول ---------- */
    async function logLogin(user) {
      try {
        const logId = `login_${Date.now()}_${user.id}`;
        await setDoc(doc(db, COL.settings, logId), {
          userId:   user.id,
          name:     user.name,
          role:     user.role,
          at:       serverTimestamp(),
          userAgent: navigator.userAgent.slice(0, 100)
        }, { merge: true });
      } catch (e) {
        console.warn("logLogin:", e);
      }
    }

    /* ---------- رسائل ---------- */
    function showError(msg) {
      errBox.innerHTML = `
        <div class="alert alert-danger">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <path d="M12 9v4M12 17h.01"/>
          </svg>
          ${msg}
        </div>
      `;
    }

    function showSuccess(msg) {
      errBox.innerHTML = `
        <div class="alert alert-success">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          ${msg}
        </div>
      `;
    }

    /* ---------- الأحداث ---------- */
    btn.onclick = doLogin;
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
    inp.focus();

    /* ---------- ملاحظة: تأثير عند الكتابة ---------- */
    inp.addEventListener("input", () => {
      errBox.innerHTML = "";
    });
  </script>
</body>
</html>
