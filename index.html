<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal','Segoe UI',sans-serif; }
:root { --gold:#c9a227; --gold-light:#e5c158; --gold-bright:#ffd966; --green:#0d4a42; --green-dark:#082b26; --green-deep:#041814; --emerald:#0a5a3a; --emerald-light:#69f0ae; --red:#e53935; --red-light:#ff5252; --amber:#fb8c00; --blue:#29b6f6; --purple:#ab47bc; --border:rgba(201,162,39,0.35); --safe-top:env(safe-area-inset-top, 0px); --safe-bottom:env(safe-area-inset-bottom, 0px); }
html, body { background:var(--green-deep); color:#fff; font-weight:600; overflow-x:hidden; min-height:100vh; scroll-behavior:smooth; }
body { display:flex; flex-direction:column; align-items:center; padding:calc(20px + var(--safe-top)) 16px calc(40px + var(--safe-bottom)); position:relative; }
body::before { content:''; position:fixed; inset:0; z-index:-2; background:radial-gradient(circle at 15% 10%, rgba(201,162,39,0.18) 0%, transparent 45%), radial-gradient(circle at 85% 90%, rgba(10,90,58,0.6) 0%, transparent 50%), linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%); }
.stars { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.star { position:absolute; width:2px; height:2px; background:var(--gold-light); border-radius:50%; opacity:0.4; animation:twinkle 4s infinite; }
@keyframes twinkle { 0%,100% { opacity:0.2; transform:scale(0.8); } 50% { opacity:0.9; transform:scale(1.4); } }
#loadingScreen { position:fixed; inset:0; z-index:99999; background:linear-gradient(135deg, #041814, #0a5a3a, #082b26); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:24px; transition:opacity 0.6s; }
#loadingScreen.hide { opacity:0; pointer-events:none; }
.loading-logo { width:140px; height:140px; object-fit:contain; border-radius:24px; background:linear-gradient(145deg, #0a5a3a, #064a2e); padding:12px; border:3px solid rgba(201,162,39,0.6); filter:drop-shadow(0 0 30px rgba(201,162,39,0.9)); animation:logoPulse 2s infinite; }
@keyframes logoPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
.loading-text { color:var(--gold-light); font-size:16px; font-weight:900; letter-spacing:3px; text-align:center; line-height:1.6; }
.loading-text .big { font-size:22px; display:block; margin-bottom:6px; }
.loading-bar { width:240px; height:4px; background:rgba(201,162,39,0.2); border-radius:4px; overflow:hidden; }
.loading-bar::after { content:''; display:block; height:100%; width:40%; background:linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius:4px; animation:loadMove 1.5s infinite; box-shadow:0 0 20px rgba(201,162,39,0.9); }
@keyframes loadMove { 0% { transform:translateX(-100%); } 100% { transform:translateX(300%); } }
.topbar { position:fixed; top:0; left:0; right:0; z-index:100; padding:calc(10px + var(--safe-top)) 16px 10px; background:linear-gradient(135deg, rgba(4,24,20,0.95), rgba(13,74,66,0.9)); backdrop-filter:blur(20px); border-bottom:1px solid rgba(201,162,39,0.25); display:flex; justify-content:space-between; align-items:center; gap:12px; }
.clock { font-family:'Courier New', monospace; font-size:15px; font-weight:900; color:var(--gold-light); letter-spacing:2px; text-shadow:0 0 15px rgba(201,162,39,0.6); }
.topbar-actions { display:flex; gap:8px; }
.icon-btn { width:40px; height:40px; border-radius:12px; border:1px solid rgba(201,162,39,0.35); background:rgba(255,255,255,0.06); color:var(--gold-light); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.2s; }
.icon-btn:active { transform:scale(0.92); background:rgba(201,162,39,0.25); }
.wrap { width:100%; max-width:520px; display:flex; flex-direction:column; gap:18px; margin-top:60px; animation:fadeUp 0.8s cubic-bezier(.4,0,.2,1); }
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.header { text-align:center; padding:24px 20px; background:linear-gradient(145deg, rgba(13,74,66,0.65), rgba(4,24,20,0.95)); border:2px solid var(--border); border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(201,162,39,0.12); position:relative; overflow:hidden; }
.header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, var(--gold), var(--gold-bright), var(--gold), transparent); background-size:200% 100%; animation:shineLine 3s linear infinite; }
@keyframes shineLine { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
.logo-wrap { position:relative; display:inline-block; margin-bottom:14px; }
.logo-wrap::before { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:200px; height:200px; background:radial-gradient(circle, rgba(201,162,39,0.35) 0%, transparent 70%); border-radius:50%; animation:logoGlow 3s infinite; z-index:-1; }
@keyframes logoGlow { 0%,100% { transform:translate(-50%,-50%) scale(1); opacity:0.5; } 50% { transform:translate(-50%,-50%) scale(1.2); opacity:1; } }
.logo { width:130px; height:130px; object-fit:contain; border-radius:24px; background:linear-gradient(145deg, #0a5a3a, #064a2e); padding:10px; border:3px solid rgba(201,162,39,0.6); filter:drop-shadow(0 0 25px rgba(201,162,39,0.8)) drop-shadow(0 0 50px rgba(201,162,39,0.35)); animation:logoFloat 3s ease-in-out infinite; }
@keyframes logoFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
.title { font-size:24px; color:var(--gold-light); font-weight:900; margin-bottom:6px; letter-spacing:0.5px; text-shadow:0 0 20px rgba(201,162,39,0.5); }
.subtitle { font-size:14px; color:rgba(255,255,255,0.9); font-weight:700; margin-bottom:4px; letter-spacing:1px; }
.brand { font-size:12px; color:rgba(255,255,255,0.7); letter-spacing:1.5px; margin-top:8px; }
.code-card { background:linear-gradient(145deg, rgba(13,74,66,0.7), rgba(4,24,20,0.95)); border:2px solid rgba(201,162,39,0.4); border-radius:22px; padding:24px 20px; box-shadow:0 15px 40px rgba(0,0,0,0.5), 0 0 40px rgba(201,162,39,0.1); position:relative; overflow:hidden; }
.code-label { display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; color:var(--gold-light); font-weight:900; margin-bottom:16px; position:relative; z-index:1; }
.code-input-wrap { position:relative; margin-bottom:14px; z-index:1; }
.code-input { width:100%; padding:20px 50px 20px 16px; background:rgba(4,24,20,0.85); border:2px solid rgba(201,162,39,0.35); border-radius:16px; color:var(--gold-light); font-size:22px; font-weight:900; text-align:center; letter-spacing:3px; font-family:'Courier New', monospace; outline:none; transition:all 0.3s; }
.code-input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(201,162,39,0.2), 0 0 30px rgba(201,162,39,0.3); background:rgba(4,24,20,0.95); }
.code-input::placeholder { letter-spacing:2px; font-size:14px; opacity:0.4; text-transform:none; }
.btn-enter { width:100%; padding:18px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--green-deep); border:none; border-radius:16px; font-family:inherit; font-size:17px; font-weight:900; cursor:pointer; transition:all 0.25s; box-shadow:0 10px 30px rgba(201,162,39,0.4); display:flex; align-items:center; justify-content:center; gap:10px; letter-spacing:0.5px; position:relative; z-index:1; }
.btn-enter:active { transform:scale(0.98); }
.btn-enter .spinner-sm { width:18px; height:18px; border:2px solid rgba(4,24,20,0.3); border-top-color:var(--green-deep); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.msg-box { margin-top:14px; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:700; display:none; align-items:center; gap:10px; line-height:1.5; position:relative; z-index:1; }
.msg-box.show { display:flex; }
.msg-box.error { background:rgba(229,57,53,0.15); border:1px solid rgba(229,57,53,0.5); color:#ff8a80; }
.msg-box.success { background:rgba(67,160,71,0.15); border:1px solid rgba(67,160,71,0.5); color:#69f0ae; }
.status { display:flex; align-items:center; justify-content:center; gap:8px; font-size:11px; color:rgba(255,255,255,0.6); padding:8px; }
.status-dot { width:8px; height:8px; border-radius:50%; background:#69f0ae; box-shadow:0 0 10px #69f0ae; animation:dotPulse 2s infinite; }
.status-dot.offline { background:#ff5252; box-shadow:0 0 10px #ff5252; }
.status-dot.checking { background:#ffa726; box-shadow:0 0 10px #ffa726; animation:dotPulse 0.8s infinite; }
@keyframes dotPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.85); } }
.special-access { background:linear-gradient(145deg, rgba(13,74,66,0.5), rgba(4,24,20,0.9)); border:2px solid rgba(201,162,39,0.25); border-radius:22px; padding:18px 16px; }
.special-title { display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:var(--gold-light); font-weight:900; margin-bottom:14px; padding-bottom:10px; border-bottom:1px dashed rgba(201,162,39,0.25); }
.special-buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.special-btn { background:linear-gradient(145deg, rgba(4,24,20,0.9), rgba(13,74,66,0.4)); border:2px solid rgba(201,162,39,0.3); border-radius:16px; padding:14px 10px; cursor:pointer; transition:0.3s; font-family:inherit; color:#fff; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; overflow:hidden; }
.special-btn:active { transform:scale(0.96); }
.special-icon { font-size:34px; line-height:1; filter:drop-shadow(0 0 12px rgba(201,162,39,0.6)); }
.special-name { font-size:13px; color:var(--gold-light); font-weight:900; }
.special-desc { font-size:9px; color:rgba(255,255,255,0.55); font-weight:600; letter-spacing:0.3px; }
.pwd-modal-overlay { position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.88); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:20px; }
.pwd-modal-overlay.show { display:flex; animation:fadeIn 0.3s; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.pwd-modal { background:linear-gradient(145deg, var(--green), var(--green-dark)); border:2px solid var(--gold); border-radius:22px; padding:28px 22px; max-width:420px; width:100%; text-align:center; animation:modalIn 0.35s cubic-bezier(.4,0,.2,1); box-shadow:0 25px 70px rgba(0,0,0,0.8), 0 0 60px rgba(201,162,39,0.3); }
@keyframes modalIn { from { transform:scale(0.85); opacity:0; } to { transform:scale(1); opacity:1; } }
.pwd-modal-icon { font-size:64px; margin-bottom:14px; filter:drop-shadow(0 0 25px rgba(201,162,39,0.8)); }
.pwd-modal-title { font-size:20px; color:var(--gold-light); font-weight:900; margin-bottom:8px; }
.pwd-modal-desc { font-size:12px; color:rgba(255,255,255,0.7); margin-bottom:20px; }
.pwd-modal-input { width:100%; padding:16px; text-align:center; background:rgba(4,24,20,0.85); border:2px solid rgba(201,162,39,0.4); border-radius:14px; color:var(--gold-light); font-size:18px; font-weight:900; letter-spacing:3px; font-family:'Courier New', monospace; outline:none; margin-bottom:14px; transition:0.3s; }
.pwd-modal-input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(201,162,39,0.2); }
.pwd-modal-actions { display:grid; grid-template-columns:1fr 2fr; gap:8px; }
.pwd-btn { padding:13px 16px; border:none; border-radius:12px; font-family:inherit; font-size:14px; font-weight:900; cursor:pointer; transition:0.2s; display:flex; align-items:center; justify-content:center; gap:6px; }
.pwd-btn.secondary { background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(201,162,39,0.3); }
.pwd-btn.primary { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--green-deep); box-shadow:0 8px 20px rgba(201,162,39,0.4); }
.pwd-btn:active { transform:scale(0.97); }
.pwd-msg { margin-top:12px; font-size:12px; font-weight:700; min-height:18px; }
.info-stats { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:18px; }
.stat-box { background:linear-gradient(145deg, rgba(4,24,20,0.9), rgba(13,74,66,0.4)); border:2px solid rgba(201,162,39,0.35); border-radius:16px; padding:18px 12px; text-align:center; position:relative; overflow:hidden; transition:0.3s; }
.stat-icon { font-size:36px; line-height:1; margin-bottom:8px; filter:drop-shadow(0 0 12px rgba(201,162,39,0.6)); position:relative; z-index:1; }
.stat-num { font-size:34px; font-weight:900; color:var(--gold-light); font-family:'Tajawal', sans-serif; line-height:1; text-shadow:0 0 20px rgba(201,162,39,0.6); position:relative; z-index:1; }
.stat-lbl { font-size:11px; color:rgba(255,255,255,0.7); margin-top:6px; font-weight:700; letter-spacing:0.5px; position:relative; z-index:1; }
</style>
</head>
<body>
<div id="loadingScreen">
  <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" alt="الشعار" class="loading-logo">
  <div class="loading-text"><span class="big">نظام الإسعاف الذكي</span><span>جاري التحميل...</span></div>
  <div class="loading-bar"></div>
</div>
<div class="topbar">
  <div class="clock" id="liveClock">--:--:--</div>
  <div class="topbar-actions"><button class="icon-btn" onclick="location.reload()">🔄</button></div>
</div>
<div class="wrap">
  <div class="header">
    <div class="logo-wrap"><img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" alt="الشعار" class="logo"></div>
    <h1 class="title">نظام الإسعاف الذكي</h1>
    <div class="subtitle">هيئة الدفاع المدني والإسعاف</div>
    <div class="brand">الإدارة العامة للإسعاف</div>
  </div>
  <div class="code-card">
    <label class="code-label"><span>🔑</span><span>أدخل كود الدخول</span></label>
    <div class="code-input-wrap">
      <input type="text" id="codeInput" class="code-input" placeholder="SUP-XXXX / OFF-XXXX / MCT-..." autocomplete="off" maxlength="30" oninput="this.value = this.value.toUpperCase()">
      <span class="code-icon" style="position:absolute;top:50%;right:18px;transform:translateY(-50%);font-size:24px;pointer-events:none;opacity:0.7;">🔐</span>
    </div>
    <button class="btn-enter" id="loginBtn" onclick="loginWithCode()"><span>✅</span><span>دخول النظام</span></button>
    <div class="msg-box" id="msgBox"></div>
  </div>
  <div class="status"><span class="status-dot checking" id="statusDot"></span><span id="statusText">جارٍ الفحص...</span></div>
  <div class="special-access">
    <div class="special-title"><span>🔐</span><span>دخول خاص — يتطلب كلمة مرور</span></div>
    <div class="special-buttons">
      <button class="special-btn" onclick="openSpecialLogin('ops')"><span class="special-icon">📡</span><span class="special-name">غرفة العمليات</span><span class="special-desc">متابعة مباشرة</span></button>
      <button class="special-btn" onclick="openSpecialLogin('admin')"><span class="special-icon">🏛️</span><span class="special-name">الإدارة العامة</span><span class="special-desc">مركز التحكم</span></button>
    </div>
  </div>
  <div class="info-stats" id="infoStats" style="margin-top:20px;">
    <div class="stat-box"><div class="stat-icon">📞</div><div class="stat-num">0</div><div class="stat-lbl">بلاغ</div></div>
    <div class="stat-box"><div class="stat-icon">🚩</div><div class="stat-num">0</div><div class="stat-lbl">إشكالية</div></div>
    <div class="stat-box"><div class="stat-icon">✅</div><div class="stat-num">0</div><div class="stat-lbl">محلولة</div></div>
    <div class="stat-box"><div class="stat-icon">🏥</div><div class="stat-num">0</div><div class="stat-lbl">مركز</div></div>
  </div>
</div>

<script>
const FIREBASE_PROJECT = "ambulance-supervisor";
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;
const DEFAULT_SPECIAL_PASSWORDS = { "ops": { page: "ops.html", name: "غرفة العمليات", icon: "📡" }, "admin": { page: "admin.html", name: "الإدارة العامة", icon: "🏛️" } };
let SPECIAL_PASSWORDS = JSON.parse(JSON.stringify(DEFAULT_SPECIAL_PASSWORDS));

function updateClock() { const el = document.getElementById("liveClock"); if (el) el.textContent = new Date().toLocaleTimeString('en-GB'); }
setInterval(updateClock, 1000); updateClock();

function fromFS(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return parseInt(v.integerValue);
  if ("booleanValue" in v) return v.booleanValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromFS);
  if ("mapValue" in v) { const o = {}; for (const k in v.mapValue.fields || {}) o[k] = fromFS(v.mapValue.fields[k]); return o; }
  return null;
}
function docToObj(doc) { const obj = {}; if (!doc.fields) return obj; for (const k in doc.fields) obj[k] = fromFS(doc.fields[k]); obj._id = doc.name.split("/").pop(); return obj; }
function esc(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function showMsg(text, type = "error") { const box = document.getElementById("msgBox"); if (!box) return; box.className = "msg-box show " + type; box.innerHTML = `<span>${type === "error" ? "⚠️" : "✅"}</span><span>${esc(text)}</span>`; }
function clearMsg() { const box = document.getElementById("msgBox"); if (box) { box.className = "msg-box"; box.innerHTML = ""; } }

function detectCodeType(code) {
  const c = code.toUpperCase().trim();
  if (/^ADM[-_][A-Z0-9]+/.test(c) || c.startsWith("ADMIN")) return { type: "admin", page: "admin.html" };
  if (/^OPS[-_][A-Z0-9]+/.test(c)) return { type: "ops", page: "ops.html" };
  if (/^OFF[-_][A-Z0-9]+/.test(c) || c.startsWith("OFF")) return { type: "officer", page: "officer.html" };
  if (/^SUP[-_][A-Z0-9]+/.test(c) || c.startsWith("SUP")) return { type: "supervisor", page: "app.html" };
  if (/-CEN[-_][A-Z0-9]+/.test(c)) return { type: "center", page: "center.html" };
  return { type: "unknown", page: "" };
}

async function loginWithCode() {
  const rawCode = document.getElementById("codeInput").value.trim();
  const btn = document.getElementById("loginBtn");
  clearMsg();
  if (!rawCode) { showMsg("الرجاء إدخال كود الدخول"); return; }
  btn.disabled = true; btn.innerHTML = `<span style="width:18px;height:18px;border:2px solid #041814;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;"></span><span>جاري التحقق...</span>`;
  
  try {
    const filterStr = JSON.stringify({"fieldFilter":{"field":{"fieldPath":"code"},"op":"EQUAL","value":{"stringValue":rawCode}}});
    const res = await fetch(`${FIRESTORE_URL}/access_codes?pageSize=1&where=${encodeURIComponent(filterStr)}`, { cache: "no-store" });
    let found = null;
    if (res.ok) { const data = await res.json(); if (data.documents && data.documents.length > 0) found = docToObj(data.documents[0]); }

    if (!found) { showMsg("كود غير صالح"); btn.disabled = false; btn.innerHTML = `<span>✅</span><span>دخول النظام</span>`; return; }
    if (found.active === false) { showMsg("هذا الكود معطّل"); btn.disabled = false; btn.innerHTML = `<span>✅</span><span>دخول النظام</span>`; return; }

    let targetPage = ""; let userInfo = { code: found.code, id: found._id };
    const cType = (found.type || "").toLowerCase(); const det = detectCodeType(found.code);

    if (cType === "admin" || det.type === "admin") { targetPage = "admin.html"; userInfo.type = "admin"; userInfo.name = found.name || found.supervisor || "الإدارة"; }
    else if (cType === "ops" || det.type === "ops") { targetPage = "ops.html"; userInfo.type = "ops"; userInfo.name = found.name || "العمليات"; }
    else if (cType === "officer" || det.type === "officer") { targetPage = "officer.html"; userInfo.type = "officer"; userInfo.name = found.name || "ضابط"; userInfo.centerName = found.center || ""; }
    else if (cType === "center" || det.type === "center") { targetPage = "center.html"; userInfo.type = "center"; userInfo.name = found.centerName || found.supervisor || "مركز"; userInfo.centerName = found.centerName || ""; }
    else if (cType === "supervisor" || det.type === "supervisor") { targetPage = "app.html"; userInfo.type = "supervisor"; userInfo.name = found.supervisor || found.name || "مشرف"; }
    else { targetPage = "app.html"; userInfo.type = "supervisor"; userInfo.name = "مستخدم"; }

    const sessionData = JSON.stringify(userInfo);
    localStorage.setItem("amb_user", sessionData);
    localStorage.setItem("amb_login_time", Date.now().toString());
    localStorage.setItem("amb_auto_login", "true");
    sessionStorage.setItem("amb_user", sessionData);
    if (userInfo.type === "admin") { localStorage.setItem("admin_session", "true"); localStorage.setItem("admin_user", sessionData); }
    if (userInfo.type === "ops") { localStorage.setItem("ops_session", "true"); localStorage.setItem("ops_user", sessionData); }

    showMsg(`✅ مرحباً ${userInfo.name}`, "success");
    const params = new URLSearchParams({ auto: "1", code: userInfo.code, name: userInfo.name, role: userInfo.type, t: Date.now() });
    setTimeout(() => { location.href = targetPage + "?" + params.toString(); }, 700);
  } catch(e) { showMsg("تعذّر الاتصال"); btn.disabled = false; btn.innerHTML = `<span>✅</span><span>دخول النظام</span>`; }
}

let _currentSpecialType = null;
function openSpecialLogin(type) {
  _currentSpecialType = type; const info = SPECIAL_PASSWORDS[type];
  const modal = document.createElement("div"); modal.id = "pwdModalDynamic"; modal.className = "pwd-modal-overlay show";
  modal.innerHTML = `<div class="pwd-modal"><div class="pwd-modal-icon">${info.icon}</div><div class="pwd-modal-title">${info.name}</div><div class="pwd-modal-desc">هذا القسم يتطلب كلمة مرور</div><input type="password" id="specialPwdInput" class="pwd-modal-input" placeholder="أدخل كلمة المرور" onkeydown="if(event.key==='Enter')submitSpecialPassword()"><div class="pwd-msg" id="specialPwdMsg"></div><div class="pwd-modal-actions" style="margin-top:14px;"><button class="pwd-btn secondary" onclick="closeSpecialLogin()">إلغاء</button><button class="pwd-btn primary" onclick="submitSpecialPassword()">🔓 دخول</button></div></div>`;
  modal.onclick = (e) => { if (e.target === modal) closeSpecialLogin(); };
  document.body.appendChild(modal); setTimeout(() => document.getElementById("specialPwdInput").focus(), 200);
}
function closeSpecialLogin() { const m = document.getElementById("pwdModalDynamic"); if (m) m.remove(); _currentSpecialType = null; }

async function submitSpecialPassword() {
  const info = SPECIAL_PASSWORDS[_currentSpecialType]; if (!info) return;
  const pwd = document.getElementById("specialPwdInput").value.trim(); const msg = document.getElementById("specialPwdMsg");
  if (!pwd) { msg.innerHTML = '⚠️ أدخل كلمة المرور'; return; }
  msg.innerHTML = '⏳ جاري التحقق...';
  let isValid = false;
  try {
    const res = await fetch(`${FIRESTORE_URL}/settings?pageSize=1`, { cache: "no-store" });
    if (res.ok) {
      const data = await res.json(); const docs = data.documents || [];
      if (docs.length > 0 && docs[0].fields && docs[0].fields.passwords) {
        const p = docs[0].fields.passwords.mapValue.fields || {}; const pwdField = p[_currentSpecialType];
        if (pwdField) { const arr = pwdField.arrayValue?.values || []; for (const v of arr) if (v.stringValue === pwd) isValid = true; }
      }
    }
  } catch(e) {}
  if (!isValid) { const def = { ops: "ops2025", admin: "supervisor2025" }; if (pwd === def[_currentSpecialType]) isValid = true; }
  if (!isValid) { msg.innerHTML = '❌ كلمة المرور خاطئة'; return; }
  
  msg.innerHTML = '✅ جاري الدخول...';
  const userInfo = { code: "special_" + _currentSpecialType, type: _currentSpecialType, name: info.name };
  const sessionData = JSON.stringify(userInfo);
  localStorage.setItem("amb_user", sessionData); localStorage.setItem("amb_auto_login", "true");
  if (_currentSpecialType === "admin") { localStorage.setItem("admin_session", "true"); localStorage.setItem("admin_user", sessionData); }
  if (_currentSpecialType === "ops") { localStorage.setItem("ops_session", "true"); localStorage.setItem("ops_user", sessionData); }
  
  setTimeout(() => { location.href = info.page + "?auto=1&role=" + _currentSpecialType + "&name=" + encodeURIComponent(info.name) + "&t=" + Date.now(); }, 700);
}

async function checkConnection() {
  const dot = document.getElementById("statusDot"), text = document.getElementById("statusText");
  try { const res = await fetch(`${FIRESTORE_URL}/settings?pageSize=1`, { cache: "no-store" }); if (res.ok) { dot.className = "status-dot"; text.textContent = "متصل"; } else throw 0; }
  catch(e) { dot.className = "status-dot offline"; text.textContent = "غير متصل"; }
}

window.onload = () => {
  setTimeout(() => { const ls = document.getElementById("loadingScreen"); if (ls) { ls.classList.add("hide"); setTimeout(() => ls.remove(), 700); } }, 1000);
  checkConnection(); setInterval(checkConnection, 30000);
  document.getElementById("codeInput").addEventListener("keypress", e => { if (e.key === "Enter") loginWithCode(); });
};
</script>
