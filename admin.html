<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#041814">
<title>الإدارة العامة — نظام الإسعاف الذكي v8.2</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal',sans-serif; }
:root {
  --gold:#978d5b; --gold-light:#c4b87a; --gold-bright:#e0d49c;
  --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814;
  --green:#43a047; --green-light:#69f0ae; --red:#e53935; --red-light:#ff5252;
  --amber:#fb8c00; --amber-light:#ffa726; --blue:#29b6f6; --blue-light:#64b5f6;
  --purple:#ab47bc; --border:rgba(151,141,91,0.25);
}
html, body { background:var(--teal-deep); color:#fff; font-weight:600; overflow-x:hidden; }
body { min-height:100vh; padding-bottom:88px; }
#loginScreen { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #041814, #0d4a42); }
.login-box { text-align:center; width:90%; max-width:400px; padding:30px; background:var(--teal-dark); border:2px solid var(--border); border-radius:20px; }
.login-logo { width:120px; height:120px; border-radius:20px; margin-bottom:20px; }
.login-title { font-size:22px; color:var(--gold-light); font-weight:900; margin-bottom:20px; }
.pass-input { width:100%; padding:15px; background:#000; border:1px solid var(--border); border-radius:12px; color:var(--gold-light); text-align:center; font-size:18px; margin-bottom:15px; }
.login-btn { width:100%; padding:15px; background:var(--gold); color:var(--teal-deep); font-size:16px; font-weight:900; border:none; border-radius:12px; cursor:pointer; }

#mainApp { display:none; } #mainApp.ready { display:block; }
.topbar { position:sticky; top:0; z-index:100; padding:12px 16px; background:var(--teal-dark); border-bottom:2px solid var(--gold); display:flex; align-items:center; gap:10px; }
.topbar-logo { width:40px; height:40px; border-radius:10px; }
.topbar-info { flex:1; } .topbar-info h1 { font-size:15px; color:var(--gold-light); }
.icon-btn { width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:#fff; cursor:pointer; }

.tabs-bar { position:sticky; top:66px; z-index:98; background:var(--teal-deep); border-bottom:1px solid var(--border); overflow-x:auto; }
.tabs-scroll { display:flex; gap:6px; padding:10px; }
.tab-btn { padding:8px 15px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:20px; color:#aaa; font-size:12px; cursor:pointer; white-space:nowrap; }
.tab-btn.active { background:var(--gold); color:var(--teal-deep); font-weight:900; }

.page { display:none; padding:16px; max-width:900px; margin:0 auto; }
.page.active { display:block; }
.card { background:linear-gradient(145deg, var(--surface), rgba(4,24,20,0.9)); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; }
.card-title { font-size:14px; color:var(--gold-light); font-weight:900; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.page-head h2 { font-size:16px; color:var(--gold-light); }

.btn { padding:10px 14px; border:none; border-radius:10px; background:var(--gold); color:var(--teal-deep); font-size:12px; font-weight:900; cursor:pointer; }
.btn.secondary { background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--border); }
.btn.success { background:var(--green); color:#fff; }
.btn.danger { background:var(--red); color:#fff; }
.btn.small { padding:6px 12px; font-size:11px; }

input, select, textarea { width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); border-radius:10px; color:#fff; font-size:13px; margin-bottom:12px; outline:none; }
label { display:block; font-size:12px; margin-bottom:6px; color:#ccc; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.item-card { background:rgba(13,74,66,0.6); border:1px solid var(--border); border-right:4px solid var(--gold); border-radius:12px; padding:12px; margin-bottom:10px; }
.item-head { display:flex; justify-content:space-between; margin-bottom:6px; }
.item-title { font-size:13px; font-weight:900; color:var(--gold-light); }
.item-badge { background:var(--gold); color:var(--teal-deep); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:900; }
.item-meta { font-size:11px; color:#aaa; margin-bottom:8px; }
.item-actions { display:flex; gap:6px; border-top:1px solid var(--border); padding-top:8px; }
.item-actions button { flex:1; padding:6px; border-radius:6px; border:none; cursor:pointer; font-size:11px; font-weight:700; }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:200; background:var(--teal-dark); border-top:2px solid var(--gold); padding:8px 2px; display:grid; grid-template-columns:repeat(6, 1fr); gap:2px; }
.nav-btn { display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:#888; font-size:9px; cursor:pointer; }
.nav-btn .nav-icon { font-size:20px; } .nav-btn.active { color:var(--gold-light); font-weight:900; }

.modal-overlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal-sheet { background:var(--teal-dark); width:100%; max-width:400px; border:2px solid var(--gold); border-radius:20px; padding:20px; max-height:90vh; overflow-y:auto; }
.modal-sheet h3 { color:var(--gold-light); text-align:center; margin-bottom:15px; font-size:16px; }
.modal-actions { display:flex; gap:10px; margin-top:15px; }
.modal-actions .btn { flex:1; padding:12px; }

/* الطباعة */
#printArea { display:none; }
@media print {
  body * { visibility:hidden; } body { background:white !important; }
  #printArea { visibility:visible !important; display:block !important; position:absolute; left:0; top:0; width:100%; background:white !important; }
  #printArea * { visibility:visible !important; }
  .topbar, .tabs-bar, .bottom-nav, .modal-overlay, #toast { display:none !important; }
}
.print-form { width:100%; max-width:210mm; margin:0 auto; background:white; color:#000; font-size:9pt; padding:0; }
.print-header { background:#978d5b !important; color:white !important; padding:8px 10px; border-radius:4px; display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; min-height:60px; border:1px solid #7a7049; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.print-header-side { text-align:center; font-size:9pt; font-weight:900; line-height:1.25; color:#fff; }
.print-header-side.left { text-align:left; } .print-header-side.right { text-align:right; }
.print-header-side .authority { font-size:10pt; color:#fff; margin-bottom:2px; }
.print-header-side .dept { font-size:8pt; color:#f5e9c8; }
.print-header-side .en { font-size:5pt; color:#e0d49c; font-family:monospace; }
.print-header-logo { width:55px; height:55px; object-fit:contain; }
.print-title { text-align:center; font-size:14pt; font-weight:900; color:#7a7049; margin:10px 0; padding:6px; border-top:2px solid #978d5b; border-bottom:2px solid #978d5b; background:#f9f8f4; }
.print-section { margin-bottom:8px; border:1px solid #978d5b; border-radius:4px; }
.print-section-title { background:#978d5b !important; color:white !important; padding:4px 8px; font-size:10pt; font-weight:900; -webkit-print-color-adjust:exact; }
.print-section-body { padding:8px; background:white; }
.print-field { display:flex; gap:4px; font-size:9pt; padding:4px 0; border-bottom:1px dotted #ccc; }
.print-field .label { font-weight:900; color:#7a7049; }
.print-field .value { font-weight:700; color:#000; }
.print-footer { margin-top:15px; padding-top:8px; border-top:1px solid #978d5b; display:flex; justify-content:space-between; font-size:7pt; }
.print-signatures { display:grid; grid-template-columns:repeat(3, 1fr); gap:15px; margin-top:25px; border-top:1px dashed #978d5b; padding-top:10px; }
.print-signature { text-align:center; font-size:8pt; }
.print-signature .role { font-weight:900; color:#7a7049; margin-bottom:4px; }
.print-signature .line { border-top:1px solid #333; padding-top:4px; margin-top:25px; font-size:7pt; color:#666; }

#toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--teal-dark); border:2px solid var(--gold); padding:12px 24px; border-radius:12px; font-weight:900; z-index:9999; display:none; text-align:center; width:90%; max-width:400px; }
</style>
</head>
<body>
<div id="toast"></div>

<div id="loginScreen">
  <div class="login-box">
    <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="login-logo">
    <div class="login-title">الإدارة العامة للإسعاف</div>
    <input type="password" id="passInput" class="pass-input" placeholder="كلمة المرور">
    <button class="login-btn" onclick="loginWithPassword()">🔓 دخول النظام</button>
  </div>
</div>

<div id="mainApp">
  <div class="topbar">
    <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="topbar-logo">
    <div class="topbar-info"><h1>الإدارة العامة v8.2</h1></div>
    <button class="icon-btn" onclick="syncData()">🔄</button>
    <button class="icon-btn" onclick="location.reload()">🚪</button>
  </div>

  <div class="tabs-bar">
    <div class="tabs-scroll">
      <button class="tab-btn active" data-tab="paramedics" onclick="switchTab('paramedics')">👨‍🚒 المسعفون</button>
      <button class="tab-btn" data-tab="officers" onclick="switchTab('officers')">🎖️ الضباط</button>
      <button class="tab-btn" data-tab="supervisors" onclick="switchTab('supervisors')">👨‍💼 المشرفون</button>
      <button class="tab-btn" data-tab="centers" onclick="switchTab('centers')">🏥 المراكز</button>
      <button class="tab-btn" data-tab="vehicles" onclick="switchTab('vehicles')">🚑 المركبات</button>
      <button class="tab-btn" data-tab="stock" onclick="switchTab('stock')">💊 المخزون</button>
    </div>
  </div>

  <div class="page active" id="page-paramedics">
    <div class="page-head"><h2>المسعفون</h2><button class="btn small" onclick="openForm('paramedic')">➕ إضافة</button></div>
    <div id="list-paramedics"></div>
  </div>
  <div class="page" id="page-officers">
    <div class="page-head"><h2>الضباط</h2><button class="btn small" onclick="openForm('officer')">➕ إضافة</button></div>
    <div id="list-officers"></div>
  </div>
  <div class="page" id="page-supervisors">
    <div class="page-head"><h2>المشرفون</h2><button class="btn small" onclick="openForm('supervisor')">➕ إضافة</button></div>
    <div id="list-supervisors"></div>
  </div>
  <div class="page" id="page-centers">
    <div class="page-head"><h2>المراكز</h2><button class="btn small" onclick="openForm('center')">➕ إضافة</button></div>
    <div id="list-centers"></div>
  </div>
  <div class="page" id="page-vehicles">
    <div class="page-head"><h2>المركبات</h2><button class="btn small" onclick="openForm('vehicle')">➕ إضافة</button></div>
    <div id="list-vehicles"></div>
  </div>
  <div class="page" id="page-stock">
    <div class="page-head"><h2>المخزون</h2><button class="btn small" onclick="openForm('stock')">➕ إضافة</button></div>
    <div id="list-stock"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('paramedics')"><span class="nav-icon">👨‍🚒</span><span>المسعفون</span></button>
    <button class="nav-btn" onclick="switchTab('officers')"><span class="nav-icon">🎖️</span><span>الضباط</span></button>
    <button class="nav-btn" onclick="switchTab('supervisors')"><span class="nav-icon">👨‍💼</span><span>المشرفون</span></button>
    <button class="nav-btn" onclick="switchTab('centers')"><span class="nav-icon">🏥</span><span>المراكز</span></button>
    <button class="nav-btn" onclick="switchTab('vehicles')"><span class="nav-icon">🚑</span><span>المركبات</span></button>
    <button class="nav-btn" onclick="switchTab('stock')"><span class="nav-icon">💊</span><span>المخزون</span></button>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <h3 id="modal-title">إضافة</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn success" id="btn-save" onclick="saveData()">💾 حفظ</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<script>
const FIRESTORE_URL = "https://firestore.googleapis.com/v1/projects/ambulance-supervisor/databases/(default)/documents";
const DEFAULT_LOGO = "https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg";
let currentType = "", editId = null;
let dbData = { paramedics: [], officers: [], supervisors: [], centers: [], vehicles: [], stock: [] };

function toast(msg, color = "#978d5b") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.borderColor = color; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3000);
}

function switchTab(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + id).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(`.tab-btn[data-tab="${id}"]`)?.classList.add("active");
  const navIds = ["paramedics", "officers", "supervisors", "centers", "vehicles", "stock"];
  const idx = navIds.indexOf(id);
  if (idx !== -1) document.querySelectorAll(".nav-btn")[idx].classList.add("active");
}

/* محرك Firebase */
function toFS(data) {
  const fields = {};
  for (let k in data) if (data[k] !== undefined && data[k] !== null) fields[k] = { stringValue: String(data[k]) };
  return { fields };
}
function fromFS(doc) {
  const obj = { _id: doc.name.split("/").pop() };
  for (let k in doc.fields) obj[k] = doc.fields[k].stringValue || "";
  return obj;
}
async function syncData() {
  toast("⏳ جاري التحميل...");
  try {
    for (let col of ["paramedics", "officers", "supervisors", "access_codes", "vehicles", "stock"]) {
      const r = await fetch(`${FIRESTORE_URL}/${col}`);
      if (r.ok) {
        const d = await r.json();
        let items = (d.documents || []).map(fromFS);
        if (col === "access_codes") dbData.centers = items.filter(x => x.type === "center");
        else dbData[col] = items;
      }
    }
    renderAll(); toast("✅ تم التحديث", "#43a047");
  } catch(e) { toast("❌ فشل الاتصال", "#e53935"); }
}
async function deleteData(type, id) {
  if (!confirm("تأكيد الحذف؟")) return;
  let col = type === "center" ? "access_codes" : type + "s";
  try {
    await fetch(`${FIRESTORE_URL}/${col}/${id}`, { method: "DELETE" });
    toast("🗑️ تم الحذف", "#e53935"); syncData();
  } catch(e) { toast("❌ فشل الحذف", "#e53935"); }
}

const fieldsMap = {
  paramedic: [{ id: "name", label: "الاسم الكامل", type: "text" }, { id: "rank", label: "الرتبة", type: "text" }, { id: "center", label: "المركز", type: "text" }, { id: "phone", label: "الهاتف", type: "text" }],
  officer: [{ id: "name", label: "الاسم", type: "text" }, { id: "rank", label: "الرتبة", type: "text" }, { id: "sector", label: "القطاع", type: "text" }],
  supervisor: [{ id: "name", label: "الاسم", type: "text" }, { id: "sector", label: "القطاع", type: "text" }],
  center: [{ id: "name", label: "اسم المركز", type: "text" }, { id: "sector", label: "القطاع", type: "text" }],
  vehicle: [{ id: "plate", label: "رقم اللوحة", type: "text" }, { id: "type", label: "نوع المركبة", type: "text" }],
  stock: [{ id: "name", label: "اسم المادة", type: "text" }, { id: "qty", label: "الكمية", type: "number" }]
};

function openForm(type, existingData = null) {
  currentType = type; editId = existingData ? existingData._id : null;
  document.getElementById("modal-title").textContent = editId ? "تعديل" : "إضافة جديد";
  let html = "";
  fieldsMap[type].forEach(f => {
    let val = existingData && existingData[f.id] ? existingData[f.id] : "";
    html += `<div class="form-group"><label>${f.label}</label><input type="${f.type}" id="inp-${f.id}" value="${val}"></div>`;
  });
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}
function closeModal() { document.getElementById("modal").classList.remove("show"); }

async function saveData() {
  let payload = {};
  for (let f of fieldsMap[currentType]) {
    const val = document.getElementById(`inp-${f.id}`).value.trim();
    if (f.id === "name" && !val) return toast("⚠️ الاسم مطلوب!", "#e53935");
    payload[f.id] = val;
  }
  let col = currentType === "center" ? "access_codes" : currentType + "s";
  if (currentType === "center") payload.type = "center";
  try {
    document.getElementById("btn-save").textContent = "⏳...";
    let url = `${FIRESTORE_URL}/${col}`; let method = "POST";
    if (editId) { url += `/${editId}`; method = "PATCH"; }
    const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(toFS(payload)) });
    if (!res.ok) throw new Error("فشل الحفظ");
    toast("✅ تم الحفظ بنجاح", "#43a047"); closeModal(); syncData();
  } catch(e) { toast("❌ " + e.message, "#e53935"); } finally { document.getElementById("btn-save").textContent = "💾 حفظ"; }
}

function renderCard(item, type) {
  const sub = item.center || item.sector || item.rank || item.type || "";
  const extra = item.phone ? `<div class="item-meta">📞 ${item.phone}</div>` : "";
  const extra2 = item.qty ? `<div class="item-meta">🔢 الكمية: ${item.qty}</div>` : "";
  return `
    <div class="item-card">
      <div class="item-head"><div class="item-title">${item.name || "بدون اسم"}</div></div>
      <div class="item-meta">${sub}</div> ${extra} ${extra2}
      <div class="item-actions">
        <button style="background:rgba(151,141,91,0.2);color:#c4b87a;border:1px solid #c4b87a;" onclick='printData("${type}", ${JSON.stringify(item).replace(/'/g, "&#39;")})'>🖨️ طباعة</button>
        <button style="background:rgba(41,182,246,0.2);color:#81d4fa;border:1px solid #81d4fa;" onclick='openForm("${type}", ${JSON.stringify(item).replace(/'/g, "&#39;")})'>✏️ تعديل</button>
        <button style="background:rgba(229,57,53,0.2);color:#ff8a80;border:1px solid #ff8a80;" onclick='deleteData("${type}", "${item._id}")'>🗑️ حذف</button>
      </div>
    </div>
  `;
}
function renderAll() {
  document.getElementById("list-paramedics").innerHTML = dbData.paramedics.map(x => renderCard(x, "paramedic")).join("") || "<p style='text-align:center;color:#888;'>لا يوجد</p>";
  document.getElementById("list-officers").innerHTML = dbData.officers.map(x => renderCard(x, "officer")).join("") || "<p style='text-align:center;color:#888;'>لا يوجد</p>";
  document.getElementById("list-supervisors").innerHTML = dbData.supervisors.map(x => renderCard(x, "supervisor")).join("") || "<p style='text-align:center;color:#888;'>لا يوجد</p>";
  document.getElementById("list-centers").innerHTML = dbData.centers.map(x => renderCard(x, "center")).join("") || "<p style='text-align:center;color:#888;'>لا يوجد</p>";
  document.getElementById("list-vehicles").innerHTML = dbData.vehicles.map(x => renderCard(x, "vehicle")).join("") || "<p style='text-align:center;color:#888;'>لا يوجد</p>";
  document.getElementById("list-stock").innerHTML = dbData.stock.map(x => renderCard(x, "stock")).join("") || "<p style='text-align:center;color:#888;'>لا يوجد</p>";
}

function printData(type, data) {
  let rows = "";
  for (let key in data) {
    if (key === "_id" || key === "type") continue;
    let label = key === "name" ? "الاسم" : key === "rank" ? "الرتبة" : key === "center" ? "المركز" : key === "phone" ? "الهاتف" : key === "sector" ? "القطاع" : key === "plate" ? "رقم اللوحة" : key === "qty" ? "الكمية" : key;
    rows += `<div class="print-field"><span class="label">${label}:</span><span class="value">${data[key]}</span></div>`;
  }
  const html = `
    <div class="print-form">
      <div class="print-header">
        <div class="print-header-side right"><div class="authority">سلطنة عمان</div><div class="dept">هيئة الدفاع المدني والإسعاف</div><div class="en">CIVIL DEFENCE</div></div>
        <img src="${DEFAULT_LOGO}" class="print-header-logo">
        <div class="print-header-side left"><div class="authority">الإدارة العامة</div><div class="dept">للإسعاف</div><div class="en">GENERAL ADMINISTRATION</div></div>
      </div>
      <div class="print-title">بطاقة بيانات</div>
      <div class="print-section"><div class="print-section-title">المعلومات الأساسية</div><div class="print-section-body"><div class="print-row">${rows}</div></div></div>
      <div class="print-signatures">
        <div class="print-signature"><div class="role">الموظف</div><div class="line">التوقيع</div></div>
        <div class="print-signature"><div class="role">المشرف</div><div class="line">التوقيع</div></div>
        <div class="print-signature"><div class="role">الإدارة</div><div class="line">التوقيع</div></div>
      </div>
      <div class="print-footer"><div>🕐 ${new Date().toLocaleString("ar-OM")}</div><div>طبعه: المسؤول</div></div>
    </div>`;
  document.getElementById("printArea").innerHTML = html;
  setTimeout(() => { window.print(); document.getElementById("printArea").innerHTML = ""; }, 500);
}

function loginWithPassword() {
  if (document.getElementById("passInput").value === "admin" || document.getElementById("passInput").value === "123456") {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainApp").classList.add("ready");
    syncData();
  } else { toast("❌ كلمة المرور خاطئة", "#e53935"); }
}
</script>
