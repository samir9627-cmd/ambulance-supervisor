<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>الإدارة العامة — نظام الإسعاف الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
body { background:#041814; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-box { background:linear-gradient(145deg, #0d4a42, #041814); padding:40px 24px; border-radius:24px; border:2px solid rgba(201,162,39,0.3); width:100%; max-width:400px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.8); }
.logo { width:100px; height:100px; border-radius:20px; border:2px solid #c9a227; margin-bottom:20px; }
h1 { color:#e5c158; font-size:22px; margin-bottom:8px; }
p { color:rgba(255,255,255,0.6); font-size:13px; margin-bottom:24px; }
input { width:100%; padding:16px; background:rgba(0,0,0,0.3); border:2px solid rgba(201,162,39,0.3); border-radius:14px; color:#e5c158; font-size:20px; text-align:center; letter-spacing:4px; outline:none; margin-bottom:16px; }
button { width:100%; padding:16px; background:linear-gradient(135deg, #c9a227, #e5c158); border:none; border-radius:14px; font-weight:900; font-size:16px; color:#041814; cursor:pointer; }
.msg { margin-top:16px; font-size:14px; font-weight:700; min-height:20px; }
#mainApp { display:none; padding:20px; text-align:center; }
</style>
</head>
<body>
  <div id="loginScreen" class="login-box">
    <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" class="logo">
    <h1>الإدارة العامة</h1>
    <p>نظام الإسعاف الذكي — v9.0</p>
    <input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
    <button onclick="loginWithPassword()">🔓 دخول آمن</button>
    <div class="msg" id="loginMsg"></div>
  </div>
  <div id="mainApp">
    <h2 style="color:#69f0ae;">✅ تم الدخول بنجاح</h2>
    <p style="margin-top:20px; color:#fff;">مرحباً بك في لوحة التحكم (النسخة الاحتياطية المؤقتة)</p>
    <button style="max-width:200px; margin-top:30px; background:#e53935; color:#fff;" onclick="localStorage.clear(); location.reload();">خروج</button>
  </div>

<script>
function loginWithPassword() {
  const pass = document.getElementById("passInput").value.trim();
  const msg = document.getElementById("loginMsg");
  if (!pass) { msg.innerHTML = '<span style="color:#ff5252">أدخل الكلمة</span>'; return; }
  
  // خطة الإنقاذ: قبول الكلمات الافتراضية دائماً
  const defaultPasswords = ["supervisor2025", "admin2025", "123456", "ops2025"];
  if (defaultPasswords.includes(pass)) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
    localStorage.setItem("admin_session", "true");
  } else {
    msg.innerHTML = '<span style="color:#ff5252">❌ الكلمة خاطئة، جرب: supervisor2025</span>';
  }
}
document.getElementById("passInput").addEventListener("keypress", e => { if (e.key === "Enter") loginWithPassword(); });
</script>
</body>
</html>
