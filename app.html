function applySolutionFromEl(el) {
  const text = readOnclickData(el, "solution");
  if (!text) return;
  const inp = document.getElementById("solutionInput");
  if (!inp) return;
  const current = inp.value.trim();
  inp.value = current ? `${current}\n${text}` : text;
  inp.focus();
  vibrate(15);
}

function resolveIssueFromEl(el) {
  const id = readOnclickData(el, "issueId");
  if (id) resolveIssueWithSolution(id);
}
function changeStatusFromEl(el) {
  const id = readOnclickData(el, "issueId");
  if (id) changeStatusFromModal(id, "escalated");
}
function quickCommentFromEl(el) {
  const id = readOnclickData(el, "issueId");
  const text = readOnclickData(el, "comment");
  if (id && text) quickComment(id, text);
}

async function resolveIssueWithSolution(issueId) {
  const issue = myIssues.find(i => i.id === issueId) || myCreatedIssues.find(i => i.id === issueId);
  if (!issue) return;
  const solutionText = document.getElementById("solutionInput")?.value.trim();
  if (!solutionText) { showToast("اكتب نص الحل", "warn"); hapticError(); return; }
  const ok = await confirmDialog("تأكيد الحل؟", "ستُغلق الإشكالية نهائياً", { icon: "✅", confirmText: "حل", confirmType: "success" });
  if (!ok) return;
  vibrate(30);
  setPending(true, "جارٍ الحفظ...");
  if (!issue.comments) issue.comments = [];
  issue.comments.push({
    id: "C" + Date.now(),
    timestamp: new Date().toISOString(),
    author: supervisor.name,
    role: "supervisor",
    text: `✅ الحل: ${solutionText}`,
    type: "resolution"
  });
  issue.status = "resolved";
  issue.resolution = solutionText;
  issue.resolvedAt = new Date().toISOString();
  issue.resolvedBy = supervisor.name;
  const idx = allIssues.findIndex(x => x.id === issueId);
  if (idx >= 0) allIssues[idx] = issue;
  hapticSuccess();
  playSuccess();
  showToast("🎉 تم حل الإشكالية", "success", 3500);
  closeModal();
  refreshAllViews();
  try {
    if (issue._id) await fsUpdate("issues", issue._id, issue);
  } catch(e) { showToast("⚠️ سيتم التحديث لاحقاً", "warn"); }
  finally { setPending(false); }
}

async function quickComment(issueId, text) {
  const issue = myIssues.find(i => i.id === issueId) || myCreatedIssues.find(i => i.id === issueId);
  if (!issue) return;
  if (!issue.comments) issue.comments = [];
  issue.comments.push({
    id: "C" + Date.now(),
    timestamp: new Date().toISOString(),
    author: supervisor.name,
    role: "supervisor",
    text
  });
  if (!issue.status || issue.status === "new") issue.status = "progress";
  hapticSuccess();
  playPing();
  showToast("✅ تم إرسال التعليق", "success");
  const idx = allIssues.findIndex(x => x.id === issueId);
  if (idx >= 0) allIssues[idx] = issue;
  closeModal();
  refreshAllViews();
  try {
    if (issue._id) await fsUpdate("issues", issue._id, issue);
  } catch(e) {}
}

async function changeStatusFromModal(issueId, newStatus) {
  closeModal();
  setTimeout(async () => {
    const ok = await confirmDialog("تصعيد الإشكالية؟", "ستُعلَّم كإشكالية تحتاج تدخل الضابط", { icon: "🚨", confirmText: "تصعيد", confirmType: "danger" });
    if (!ok) return;
    const issue = myIssues.find(i => i.id === issueId) || myCreatedIssues.find(i => i.id === issueId);
    if (!issue) return;
    issue.status = newStatus;
    issue.updatedAt = new Date().toISOString();
    showToast("✅ تم التحديث", "success");
    refreshAllViews();
    if (issue._id) fsUpdate("issues", issue._id, issue).catch(console.error);
  }, 200);
}

function computeVisitScore() {
  if (!visitDraft || !visitDraft.checklist) return 0;
  const total = visitDraft.checklist.reduce((s, c) => s + c.weight, 0);
  const got = visitDraft.checklist.reduce((s, c) => s + (c.checked ? c.weight : 0), 0);
  return Math.round((got / total) * 100);
}

function toggleVisitCheckFromEl(el) {
  const idx = parseInt(readOnclickData(el, "visitCheck"));
  if (isNaN(idx) || !visitDraft || !visitDraft.checklist[idx]) return;
  visitDraft.checklist[idx].checked = !visitDraft.checklist[idx].checked;
  vibrate(15);
  const score = computeVisitScore();
  const items = document.querySelectorAll("#visitChecklist .checklist-item");
  if (items[idx]) {
    items[idx].classList.toggle("checked", visitDraft.checklist[idx].checked);
    const box = items[idx].querySelector(".ci-box");
    if (box) box.textContent = visitDraft.checklist[idx].checked ? "✓" : "";
  }
  const scoreEl = document.getElementById("visitScoreDisplay");
  if (scoreEl) scoreEl.textContent = score + "%";
}

function renderVisitGPSBoxHTML() {
  const gps = visitDraft?.gps;
  if (gps && gps.lat) {
    return `
      <div class="gps-status success">
        <span>✅</span><span style="flex:1;">تم تحديد موقعك</span>
        <button type="button" onclick="clearVisitGPS()" style="background:transparent;border:none;color:#ff8a80;font-weight:900;cursor:pointer;font-size:14px;">✕</button>
      </div>
      <div class="gps-coords">${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)}</div>
    `;
  }
  return `
    <div class="gps-status"><span>📍</span><span style="flex:1;">لم يتم تحديد الموقع</span></div>
    <button type="button" class="btn info small block" onclick="requestVisitGPS()" style="margin-top:8px;">🌐 تحديد موقعي</button>
  `;
}

function requestVisitGPS() {
  if (!navigator.geolocation) { showToast("⚠️ لا يدعم GPS", "warn"); return; }
  const box = document.getElementById("visitGpsBox");
  if (box) box.innerHTML = '<div class="gps-status loading"><span>⏳</span><span>جاري التحديد...</span></div>';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      visitDraft.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      const box = document.getElementById("visitGpsBox");
      if (box) box.innerHTML = renderVisitGPSBoxHTML();
      showToast("✅ تم تحديد موقعك", "success", 1800);
    },
    () => {
      const box = document.getElementById("visitGpsBox");
      if (box) box.innerHTML = renderVisitGPSBoxHTML();
      showToast("⚠️ تعذّر تحديد الموقع", "danger");
    },
    { enableHighAccuracy: true, timeout: 12000 }
  );
}
function clearVisitGPS() {
  if (visitDraft) visitDraft.gps = null;
  const box = document.getElementById("visitGpsBox");
  if (box) box.innerHTML = renderVisitGPSBoxHTML();
}

function refreshVisitImagesGrid() {
  const grid = document.getElementById("visitImagesGrid");
  if (!grid || !visitDraft) return;
  const imgs = visitDraft.images || [];
  grid.innerHTML = "";
  imgs.forEach((img, idx) => {
    const div = document.createElement("div");
    div.className = "image-preview-item";
    div.innerHTML = `<img src="${img.dataUrl}"><div class="remove-btn" onclick="event.stopPropagation();removeVisitImage(${idx})">✕</div>`;
    div.onclick = () => showImageModal(img.dataUrl);
    grid.appendChild(div);
  });
  if (imgs.length < IMAGE_CONFIG.maxImages) {
    const btn = document.createElement("button");
    btn.className = "image-add-btn";
    btn.type = "button";
    btn.onclick = () => openVisitImagePicker();
    btn.innerHTML = `<span>+</span><span class="ia-label">${imgs.length}/${IMAGE_CONFIG.maxImages}</span>`;
    grid.appendChild(btn);
  }

function openVisitImagePicker() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      showToast("⏳ جاري ضغط الصورة...", "info", 1500);
      const compressed = await compressImage(file);
      visitDraft.images = visitDraft.images || [];
      visitDraft.images.push({ dataUrl: compressed, name: file.name });
      refreshVisitImagesGrid();
      const sizeKB = Math.round(compressed.length * 0.75 / 1024);
      showToast(`✅ صورة مضغوطة (~${sizeKB}KB)`, "success", 2000);
    } catch(err) {
      showToast("❌ فشل ضغط الصورة", "danger");
    }
  };
  inp.click();
}

function removeVisitImage(idx) {

/* ═══════════════════════════════════════════════════════════
   🆕 v23: ضغط الصور (صورة واحدة، 800px، جودة 55%)
   ═══════════════════════════════════════════════════════════ */
async function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const maxDim = IMAGE_CONFIG.maxDimension;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        try {
          let quality = IMAGE_CONFIG.quality;
          let dataUrl = canvas.toDataURL("image/jpeg", quality);
          /* 🆕 ضغط إضافي تلقائي إذا تجاوز الحد */
          let sizeKB = Math.round(dataUrl.length * 0.75 / 1024);
          while (sizeKB > IMAGE_CONFIG.maxSizeKB && quality > 0.2) {
            quality -= 0.1;
            dataUrl = canvas.toDataURL("image/jpeg", quality);
            sizeKB = Math.round(dataUrl.length * 0.75 / 1024);
          }
          console.log(`📷 compressed: ${sizeKB}KB (q=${quality.toFixed(2)})`);
          resolve(dataUrl);
        } catch(err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════════════════════════════════════════════
   Quick Entry Form — تسجيل الإشكاليات
   ═══════════════════════════════════════════════════════════ */
function startEntry(mode, fromDraft = false) {
  if (!fromDraft) {
    draftState = {
      mode: mode,
      targetType: "paramedic",
      issueTypes: [],
      praiseTypes: [],
      severities: ["متوسط"],
      targetValue: "",
      centerName: "",
      description: "",
      images: [],
      gps: null,
      savedAt: null
    };
  }
  renderEntryModal();
}

function renderEntryModal() {
  const isPraise = draftState.mode === "praise";
  const currentShiftKey = getCurrentShiftByTime();
  const period = SHIFT_PERIODS[currentShiftKey];
  const sector = supervisorSector || "";
  const sectorCenters = (appData.sectors || {})[sector] || [];
  if (sectorCenters.length === 0) { showToast("⚠️ لا توجد مراكز", "warn", 3500); return; }
  const centersOptions = sectorCenters.map(c =>
    `<option value="${esc(c)}" ${draftState.centerName === c ? 'selected' : ''}>${esc(c)}</option>`
  ).join("");
  const typesForTarget = getTypesForTarget(draftState.targetType, isPraise);
  const selectedTypesList = isPraise ? draftState.praiseTypes : draftState.issueTypes;
  const targetGridHtml = `
    <div class="target-grid">
      ${[
        { key: "paramedic", icon: "👨‍🚒", name: "مسعف" },
        { key: "center", icon: "🏥", name: "مركز" },
        { key: "vehicle", icon: "🚑", name: "مركبة" },
        { key: "medical_stock", icon: "💊", name: "مخزن" },
        { key: "equipment", icon: "🧰", name: "معدات" }
      ].map(t => `
        <div class="target-btn ${draftState.targetType === t.key ? 'active' : ''}" data-entry-target="${t.key}" onclick="pickEntryTargetFromEl(this)">
          <span class="t-icon">${t.icon}</span>
          <span class="t-name">${t.name}</span>
        </div>
      `).join("")}
    </div>
  `;
  let targetFieldsHtml = "";
  if (draftState.targetType === "paramedic") {
    targetFieldsHtml = `<label>👨‍🚒 اختر المسعف <span style="color:#ff5252;">*</span></label>
      <select id="entryParamedic" onchange="draftState.targetValue = this.value;">
        <option value="">— اختر المركز أولاً —</option>
      </select>`;
  } else if (draftState.targetType === "center") {
    targetFieldsHtml = `<label>🏥 المركز</label>
      <div style="background:rgba(201,162,39,0.15);border:2px solid var(--gold);border-radius:11px;padding:12px 14px;color:var(--gold-light);font-weight:900;font-size:13px;">
        🏥 <span id="entryCenterDisplay">— المركز المختار أعلاه —</span>
      </div>`;
  } else if (draftState.targetType === "vehicle") {
    targetFieldsHtml = `<label>🚑 رقم المركبة <span style="color:#ff5252;">*</span></label>
      <input type="text" id="entryVehicle" placeholder="AMB-01" maxlength="30" value="${esc(draftState.targetValue)}" oninput="draftState.targetValue = this.value;">`;
  } else if (draftState.targetType === "medical_stock") {
    targetFieldsHtml = `<label>💊 نوع المخزون</label>
      <select id="entryStock" onchange="draftState.targetValue = this.value;">
        <option value="">— اختر —</option>
        ${(appData.medicalStock || []).map(m => `<option ${draftState.targetValue === m ? 'selected' : ''}>${esc(m)}</option>`).join("")}
      </select>`;
  } else if (draftState.targetType === "equipment") {
    targetFieldsHtml = `<label>🧰 نوع المعدات</label>
      <select id="entryEquip" onchange="draftState.targetValue = this.value;">
        <option value="">— اختر —</option>
        ${(appData.equipment || []).map(e => `<option ${draftState.targetValue === e ? 'selected' : ''}>${esc(e)}</option>`).join("")}
      </select>`;
  }
  let typesChipsHtml = typesForTarget.length === 0
    ? `<div style="padding:14px;font-size:12px;opacity:0.6;text-align:center;background:rgba(4,24,20,0.5);border-radius:10px;">⚠️ لم تُضف أنواع — تواصل مع الإدارة</div>`
    : `<div class="chips-wrap">
        ${typesForTarget.map(t => {
          const isSelected = selectedTypesList.includes(t);
          return `<div class="chip-select ${isSelected ? 'selected' : ''}" data-entry-type="${esc(t)}" onclick="toggleEntryTypeFromEl(this)">${isSelected ? "✓ " : ""}${esc(t)}</div>`;
        }).join("")}
      </div>`;
  let severityHtml = "";
  if (!isPraise) {
    severityHtml = `<label>🔴 الخطورة <span style="color:#ff5252;">*</span></label>
      <div class="chips-wrap">
        ${["منخفض", "متوسط", "عالي"].map(s => `
          <div class="chip-select ${draftState.severities.includes(s) ? 'selected' : ''}" data-entry-severity="${s}" onclick="pickEntrySeverityFromEl(this)">
            ${{"منخفض":"🟢 منخفض","متوسط":"🟡 متوسط","عالي":"🔴 عالي"}[s]}
          </div>
        `).join("")}
      </div>`;
  }
  openModal({
    title: isPraise ? "⭐ تسجيل إشادة" : "🚩 تسجيل إشكالية",
    body: `
      <div class="warning-bar ${isPraise ? 'success' : 'info'}" style="margin-bottom:12px;">
        <span>${period.icon}</span>
        <span>الشفت ${period.label} — ${period.start} → ${period.end}</span>
      </div>
      <label>🏥 المركز <span style="color:#ff5252;">*</span></label>
      <select id="entryCenter" onchange="onEntryCenterChange();">
        <option value="">— اختر —</option>
        ${centersOptions}
      </select>
      <label>🎯 نوع المتابعة <span style="color:#ff5252;">*</span></label>
      ${targetGridHtml}
      ${targetFieldsHtml}
      <label>${isPraise ? "⭐ أنواع الإشادة" : "🚩 أنواع الإشكاليات"}</label>
      ${typesChipsHtml}
      ${severityHtml}
      <label>${isPraise ? "⭐ نص الإشادة" : "📝 الوصف"} <span style="color:#ff5252;">*</span></label>
      <textarea id="entryDesc" maxlength="500" oninput="draftState.description = this.value; scheduleDraftSave();">${esc(draftState.description || "")}</textarea>
      <label>📷 صورة (اختياري)</label>
      <div class="images-preview-grid" id="entryImagesGrid"></div>
      <label>📍 الموقع</label>
      <div class="gps-box" id="gpsBox">${renderGPSBoxHTML()}</div>
    `,
    actions: [
      { text: "إلغاء", type: "secondary", onClick: closeModal },
      { text: isPraise ? "⭐ حفظ" : "🚩 حفظ", type: isPraise ? "success" : "danger", onClick: submitEntry }
    ]
  });
  setTimeout(() => {
    refreshEntryImagesGrid();
    if (draftState.centerName) {
      const sel = document.getElementById("entryCenter");
      if (sel) sel.value = draftState.centerName;
      if (draftState.targetType === "paramedic") onEntryCenterChange();
    }
  }, 50);
}

function getTypesForTarget(targetType, isPraise) {
  if (isPraise) return appData.praiseTypes || [];
  const supIssues = appData.supervisorIssues || {};
  if (supIssues[targetType]?.categories) return supIssues[targetType].categories;
  if (appData.categories?.[targetType]) return appData.categories[targetType];
  return [];
}

function pickEntryTargetFromEl(el) {
  const type = readOnclickData(el, "entryTarget");
  if (!type) return;
  draftState.targetType = type;
  draftState.issueTypes = [];
  draftState.praiseTypes = [];
  draftState.targetValue = "";
  renderEntryModal();
  vibrate(15);
}

function onEntryCenterChange() {
  const centerName = document.getElementById("entryCenter").value;
  if (!centerName) return;
  draftState.centerName = centerName;
  scheduleDraftSave();
  const display = document.getElementById("entryCenterDisplay");
  if (display) display.textContent = cleanCenter(centerName);
  if (draftState.targetType === "paramedic") {
    const sel = document.getElementById("entryParamedic");
    if (!sel) return;
    const centerClean = cleanCenter(centerName);
    const list = allParamedics.filter(p => {
      const pc = cleanCenter(p.center || "");
      return pc === centerClean || pc.includes(centerClean) || centerClean.includes(pc);
    });
    sel.innerHTML = list.length === 0
      ? '<option value="">لا يوجد مسعفون</option>'
      : '<option value="">— اختر المسعف —</option>' + list.map(p =>
          `<option value="${esc(p.name)}" ${draftState.targetValue === p.name ? 'selected' : ''}>${p.role === "driver" ? "🚑" : "👨‍🚒"} ${esc(p.name)} — ${esc(p.rank || "")}</option>`
        ).join("");
  }
}

function toggleEntryTypeFromEl(el) {
  const type = readOnclickData(el, "entryType");
  if (!type) return;
  const list = draftState.mode === "praise" ? draftState.praiseTypes : draftState.issueTypes;
  const idx = list.indexOf(type);
  if (idx >= 0) list.splice(idx, 1);
  else list.push(type);
  vibrate(15);
  el.classList.toggle("selected");
  if (el.classList.contains("selected")) {
    if (!el.innerHTML.trim().startsWith("✓")) el.innerHTML = "✓ " + el.innerHTML;
  } else {
    if (el.innerHTML.trim().startsWith("✓")) el.innerHTML = el.innerHTML.replace("✓ ", "");
  }
  scheduleDraftSave();
}

function pickEntrySeverityFromEl(el) {
  const key = readOnclickData(el, "entrySeverity");
  if (!key) return;
  draftState.severities = [key];
  vibrate(15);
  document.querySelectorAll("[data-entry-severity]").forEach(c => {
    c.classList.toggle("selected", readOnclickData(c, "entrySeverity") === key);
  });
  scheduleDraftSave();
}

/* 🆕 v23: صور الإدخال — صورة واحدة مضغوطة */
function refreshEntryImagesGrid() {
  const grid = document.getElementById("entryImagesGrid");
  if (!grid) return;
  const imgs = draftState.images || [];
  grid.innerHTML = "";
  imgs.forEach((img, idx) => {
    const div = document.createElement("div");
    div.className = "image-preview-item";
    div.innerHTML = `<img src="${img.dataUrl}"><div class="remove-btn" onclick="event.stopPropagation(); removeEntryImage(${idx})">✕</div>`;
    div.onclick = () => showImageModal(img.dataUrl);
    grid.appendChild(div);
  });
  if (imgs.length < IMAGE_CONFIG.maxImages) {
    const btn = document.createElement("button");
    btn.className = "image-add-btn";
    btn.type = "button";
    btn.onclick = openImagePicker;
    btn.innerHTML = `<span>+</span><span class="ia-label">${imgs.length}/${IMAGE_CONFIG.maxImages}</span>`;
    grid.appendChild(btn);
  }
}
function openImagePicker() {
  const remaining = IMAGE_CONFIG.maxImages - (draftState.images?.length || 0);
  if (remaining <= 0) { showToast(`الحد ${IMAGE_CONFIG.maxImages} صورة`, "warn"); return; }
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      showToast("⏳ جاري ضغط الصورة...", "info", 1500);
      const compressed = await compressImage(file);
      draftState.images = draftState.images || [];
      draftState.images.push({ dataUrl: compressed, name: file.name });
      refreshEntryImagesGrid();
      const sizeKB = Math.round(compressed.length * 0.75 / 1024);
      showToast(`✅ صورة مضغوطة (~${sizeKB}KB)`, "success", 2000);
      scheduleDraftSave();
    } catch(err) {
      showToast("❌ فشل ضغط الصورة", "danger");
    }
  };
  inp.click();
}
function removeEntryImage(idx) {
  if (!draftState.images) return;
  draftState.images.splice(idx, 1);
  refreshEntryImagesGrid();
  scheduleDraftSave();
}

function renderGPSBoxHTML() {
  const gps = draftState.gps;
  if (gps && gps.lat) {
    return `<div class="gps-status success">
        <span>✅</span><span style="flex:1;">تم التحديد</span>
        <button type="button" onclick="clearGPS()" style="background:transparent;border:none;color:#ff8a80;cursor:pointer;">✕</button>
      </div>
      <div class="gps-coords">${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)}</div>`;
  }
  return `<div class="gps-status"><span>📍</span><span style="flex:1;">لم يتم التحديد</span></div>
    <button type="button" class="btn info small block" onclick="requestGPS()" style="margin-top:8px;">🌐 تحديد موقعي</button>`;
}
function requestGPS() {
  if (!navigator.geolocation) { showToast("⚠️ لا يدعم GPS", "warn"); return; }
  const box = document.getElementById("gpsBox");
  if (box) box.innerHTML = '<div class="gps-status loading"><span>⏳</span><span>جاري التحديد...</span></div>';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      draftState.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      const box = document.getElementById("gpsBox");
      if (box) box.innerHTML = renderGPSBoxHTML();
      scheduleDraftSave();
      showToast("✅ تم تحديد موقعك", "success", 2000);
    },
    (err) => {
      const box = document.getElementById("gpsBox");
      if (box) box.innerHTML = renderGPSBoxHTML();
      showToast(err.code === 1 ? "🚫 تم رفض الإذن" : "⚠️ تعذّر التحديد", "danger");
    },
    { enableHighAccuracy: true, timeout: 12000 }
  );
}
function clearGPS() {
  draftState.gps = null;
  const box = document.getElementById("gpsBox");
  if (box) box.innerHTML = renderGPSBoxHTML();
  scheduleDraftSave();
}

/* 🆕 v23: Submit Entry مع دعم offline queue */
async function submitEntry() {
  if (submitInProgress) return;
  const isPraise = draftState.mode === "praise";
  const centerName = document.getElementById("entryCenter").value;
  if (!centerName) { showToast("اختر المركز", "warn"); hapticError(); return; }
  draftState.centerName = centerName;
  const selectedTypes = isPraise ? draftState.praiseTypes : draftState.issueTypes;
  if (selectedTypes.length === 0) { showToast("اختر نوع", "warn"); hapticError(); return; }
  let targetName = "", targetId = "";
  if (draftState.targetType === "paramedic") {
    const pv = document.getElementById("entryParamedic")?.value;
    if (!pv) { showToast("اختر المسعف", "warn"); hapticError(); return; }
    targetName = pv; targetId = pv;
  } else if (draftState.targetType === "center") {
    targetName = centerName; targetId = centerName;
  } else if (draftState.targetType === "vehicle") {
    const vn = document.getElementById("entryVehicle").value.trim();
    if (!vn) { showToast("أدخل رقم المركبة", "warn"); hapticError(); return; }
    targetName = "🚑 " + vn; targetId = vn;
  } else if (draftState.targetType === "medical_stock") {
    const sv = document.getElementById("entryStock").value;
    if (!sv) { showToast("اختر المخزون", "warn"); hapticError(); return; }
    targetName = "💊 " + sv; targetId = sv;
  } else if (draftState.targetType === "equipment") {
    const ev = document.getElementById("entryEquip").value;
    if (!ev) { showToast("اختر المعدات", "warn"); hapticError(); return; }
    targetName = "🧰 " + ev; targetId = ev;
  }
  const description = document.getElementById("entryDesc").value.trim();
  if (!description) { showToast("اكتب الوصف", "warn"); hapticError(); return; }
  if (!isPraise) {
    const rl = checkRateLimit();
    if (!rl.ok) {
      showToast("⚠️ تجاوزت الحد المسموح (30/ساعة)", "danger", 4000);
      hapticError();
      return;
    }
  }
  submitInProgress = true;
  setPending(true, isPraise ? "جارٍ حفظ الإشادة..." : "جارٍ حفظ الإشكالية...");
  const severity = isPraise ? "منخفض" : (draftState.severities[0] || "متوسط");
  const imagesData = (draftState.images || []).map(img => img.dataUrl);
  const issue = {
    id: "ISS" + Date.now() + Math.random().toString(36).substr(2, 5),
    timestamp: new Date().toISOString(),
    supervisor: supervisor.name,
    supervisorCode: supervisor.code,
    sector: supervisorSector,
    center: centerName,
    centerName: centerName,
    targetType: draftState.targetType,
    targetId: targetId,
    targetName: targetName,
    isPraise: isPraise,
    issueTypes: isPraise ? [] : [...selectedTypes],
    issueType: isPraise ? null : selectedTypes.join(" • "),
    praiseTypes: isPraise ? [...selectedTypes] : [],
    praiseType: isPraise ? selectedTypes.join(" • ") : null,
    severity: severity,
    description: description,
    images: imagesData,
    gps: draftState.gps,
    status: isPraise ? "resolved" : "new",
    resolvedAt: isPraise ? new Date().toISOString() : null,
    resolvedBy: isPraise ? supervisor.name : null,
    comments: [],
    appVersion: APP_VERSION
  };
  try {
    let saved = { ...issue };
    try {
      const res = await fsAdd("issues", issue);
      saved._id = res.name.split("/").pop();
    } catch(err) {
      /* 🆕 v23: إذا فشل الحفظ (إنترنت) → طابور المزامنة */
      if (!navigator.onLine) {
        await queueForSync("issues", issue);
        saved._id = "offline_" + issue.id;
        showToast("📥 حفظت محلياً — ستُزامن عند العودة", "info", 4000);
      } else if (imagesData.length > 0) {
        showToast("⚠️ الصورة كبيرة — حفظ بدونها", "warn", 3000);
        const light = { ...issue, images: [] };
        const res2 = await fsAdd("issues", light);
        saved._id = res2.name.split("/").pop();
        saved.images = [];
      } else throw err;
    }
    allIssues.push(saved);
    myIssues.push(saved);
    myCreatedIssues.push(saved);
    if (!isPraise) recordRateLimitHit();
    clearDraft();
    hapticSuccess();
    playSuccess();
    closeModal();
    document.getElementById("successCheck").textContent = isPraise ? "⭐" : "✓";
    document.getElementById("successTitle").textContent = isPraise ? "⭐ تمت الإشادة" : "✅ تم الحفظ";
    document.getElementById("successSub").textContent = isPraise ? "شكراً" : "أُرسلت للضابط";
    document.getElementById("successScreen").classList.add("show");
    refreshAllViews();
  } catch(e) {
    console.error(e);
    showToast("❌ فشل الحفظ", "danger", 4000);
  } finally {
    submitInProgress = false;
    setPending(false);
  }
}

/* ═══════════════════════════════════════════════════════════
   المسودات
   ═══════════════════════════════════════════════════════════ */
function saveDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ ...draftState, savedAt: new Date().toISOString() }));
    const ind = document.getElementById("draftIndicator");
    if (ind) { ind.classList.add("show"); setTimeout(() => ind.classList.remove("show"), 1200); }
  } catch(e) {}
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d.savedAt && (Date.now() - new Date(d.savedAt).getTime()) > 24*3600*1000) {
      localStorage.removeItem(DRAFT_KEY); return null;
    }
    return d;
  } catch(e) { return null; }
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
  const banner = document.getElementById("pendingDraftBanner");
  if (banner) banner.innerHTML = "";
}
function checkPendingDraft() {
  const d = loadDraft();
  const banner = document.getElementById("pendingDraftBanner");
  if (!banner) return;
  if (!d) { banner.innerHTML = ""; return; }
  const hasContent = (d.description && d.description.trim()) || (d.images && d.images.length > 0) || d.centerName;
  if (!hasContent) { banner.innerHTML = ""; return; }
  banner.innerHTML = `
    <div class="warning-bar info" style="cursor:pointer;" onclick="restoreDraft()">
      <span>💾</span>
      <span style="flex:1;">لديك مسودة محفوظة (${timeAgo(d.savedAt)}) — اضغط لاسترجاعها</span>
      <button onclick="event.stopPropagation(); discardDraft()" style="background:transparent;border:none;color:#ff8a80;font-weight:900;cursor:pointer;font-size:16px;">✕</button>
    </div>
  `;
}
function restoreDraft() {
  const d = loadDraft();
  if (!d) return;
  draftState = { ...draftState, ...d };
  startEntry(d.mode || "complaint", true);
  showToast("✅ تم استرجاع المسودة", "success", 2000);
}
async function discardDraft() {
  const ok = await confirmDialog("حذف المسودة؟", "لا يمكن التراجع", { icon: "🗑️", confirmText: "حذف", confirmType: "danger" });
  if (!ok) return;
  clearDraft();
  showToast("🗑️ تم حذف المسودة", "info", 1500);
}
function scheduleDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => saveDraft(), 1500);
}
function checkVisitDraft() {
  try {
    const raw = localStorage.getItem(VISIT_DRAFT_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.savedAt && (Date.now() - new Date(d.savedAt).getTime()) > 24*3600*1000) {
      localStorage.removeItem(VISIT_DRAFT_KEY);
    }
  } catch(e) {}
}
function checkInternalDraft() {
  try {
    const raw = localStorage.getItem(INTERNAL_DRAFT_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.savedAt && (Date.now() - new Date(d.savedAt).getTime()) > 24*3600*1000) {
      localStorage.removeItem(INTERNAL_DRAFT_KEY);
    }
  } catch(e) {}
}
  /* ═══════════════════════════════════════════════════════════
   الإشعارات
   ═══════════════════════════════════════════════════════════ */
function buildNotifications() {
  const notifs = [];
  allBroadcasts.forEach(b => {
    const isForMe = b.targetType === "all" || b.targetType === "supervisors" ||
                    (b.targetType === "individual" && b.targetValue && String(b.targetValue).includes(supervisor.name)) ||
                    (b.targetType === "center" && b.targetValue && supervisorCenters.some(c => centerMatches(c, b.targetValue))) ||
                    (b.targetType === "sector" && b.targetValue && centerMatches(b.targetValue, supervisorSector));
    if (isForMe && hoursSince(b.timestamp) < 72) {
      notifs.push({
        id: "B_" + (b._id || b.id),
        timestamp: b.timestamp,
        type: b.type === "🚨 حالة طارئة" ? "danger" : (b.type === "⚠️ تنبيه هام" ? "warn" : "info"),
        title: `📢 ${b.title}`,
        text: b.body
      });
    }
  });
  myCreatedIssues.filter(i => i.status === "resolved" && isWithin7Days(i.resolvedAt)).forEach(i => {
    notifs.push({
      id: "R_" + i.id,
      timestamp: i.resolvedAt,
      type: "success",
      title: "✅ تم حل إشكالية سجلتها",
      text: i.issueType || ""
    });
  });
  notifs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  notifications = notifs.slice(0, 50);
  updateNotifBadge();
  updateChatBadge();
  const sig = notifications.map(n => n.id).join("|");
  if (sig !== lastNotifSignature && lastNotifSignature !== "") {
    const newIds = notifications.filter(n => !lastNotifSignature.includes(n.id)).length;
    if (newIds > 0) playPing();
  }
  lastNotifSignature = sig;
}
function updateNotifBadge() {
  const unread = notifications.filter(n => !readNotifIds.has(n.id)).length;
  const badge = document.getElementById("notifBadge");
  if (badge) {
    if (unread > 0) { badge.style.display = "flex"; badge.textContent = unread > 9 ? "9+" : unread; }
    else badge.style.display = "none";
  }
}
function updateChatBadge() {
  if (!supervisor) return;
  const myChats = chats.filter(c => (c.participants || []).includes(supervisor.name));
  const unread = myChats.reduce((sum, c) =>
    sum + (c.unread && c.unread[supervisor.name] ? c.unread[supervisor.name] : 0), 0);
  [document.getElementById("chatBadge"), document.getElementById("chatBadge2")].forEach(badge => {
    if (!badge) return;
    if (unread > 0) { badge.style.display = "flex"; badge.textContent = unread > 9 ? "9+" : unread; }
    else badge.style.display = "none";
  });
}

    return tb - ta;

function handleChatKeydown(e) {

}
async function sendChatMessage() {
  if (!currentChat) return;
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  const chat = chats.find(c => c.id === currentChat);
  if (!chat) return;
  const message = { id: "M" + Date.now(), sender: supervisor.name, text, timestamp: new Date().toISOString() };
  if (!chat.messages) chat.messages = [];
  chat.messages.push(message);
  chat.lastMessage = text;
  chat.lastTimestamp = message.timestamp;
  const otherId = (chat.participants || []).find(p => p !== supervisor.name);
  if (otherId) { if (!chat.unread) chat.unread = {}; chat.unread[otherId] = (chat.unread[otherId] || 0) + 1; }
  input.value = "";
  renderChatMessages(chat);
  setTimeout(() => { const c = document.getElementById("chatMessages"); if (c) c.scrollTop = c.scrollHeight; }, 50);
  try {
    if (chat._firestoreId) {
      const data = { ...chat }; delete data._firestoreId; delete data._id;
      await fsUpdate("chats", chat._firestoreId, data);
    } else {
      const data = { ...chat }; delete data._id;
      const res = await fsAdd("chats", data);
      chat._firestoreId = res.name.split("/").pop();
    }
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════
   المزامنة
   ═══════════════════════════════════════════════════════════ */
async function syncFromCloud(silent = false) {
  if (isSyncing || !supervisor) return;
  isSyncing = true;
  if (!silent) setOnlineStatus("checking");
  let okCount = 0;
  try {
    try {
      const settings = await fsList("settings");
      if (settings.length > 0) {
        const s = settings[0];
        ["ranks","sectors","medicalStock","equipment","praiseTypes","internalCategories"].forEach(k => {
          if (s[k] !== undefined) appData[k] = s[k];
        });
        if (s.supervisorIssues) {
          appData.supervisorIssues = s.supervisorIssues;
          ["paramedic","center","vehicle","medical_stock","equipment"].forEach(type => {
            if (s.supervisorIssues[type]?.categories) appData.categories[type] = s.supervisorIssues[type].categories;
          });
          if (s.supervisorIssues.praise?.categories) appData.praiseTypes = s.supervisorIssues.praise.categories;
        }
        applyBrandFromSettings(s);
      }
      okCount++;
    } catch(e) {}
    try {
      const allSup = await fsList("supervisors");
      allSupervisors = allSup.map(s => ({ ...s, _firestoreId: s._id }));
      const me = allSupervisors.find(s => s.code === supervisor.code);
      if (me) {
        supervisorSector = me.sector || supervisorSector;
        supervisorScope = me.scope || supervisorScope;
        supervisorCenters = me.centers || supervisorCenters;
        supervisor.name = me.name || supervisor.name;
        const allSectorCenters = Object.entries(appData.sectors || {}).flatMap(
          ([sector, centers]) => (centers || []).map(c => ({ sector, name: c }))
        );
        if (me.scope === "full") supervisorCenters = (appData.sectors || {})[me.sector] || [];
        else if (me.scope === "all") supervisorCenters = allSectorCenters.map(x => x.name);
        else if (me.scope === "centers" || me.scope === "single") supervisorCenters = me.centers || [];
        saveSession(supervisor);
      }
      okCount++;
    } catch(e) {}
    try {
      const officers = await fsList("officers");
      allOfficers = officers.map(o => ({ ...o, _firestoreId: o._id }));
      myOfficers = allOfficers.filter(o => {
        if (!o.sector) return true;
        if (centerMatches(o.sector, supervisorSector)) return true;
        if (o.sector.includes(supervisorSector) || supervisorSector.includes(o.sector)) return true;
        return false;
      });
      okCount++;
    } catch(e) {}
    try {
      const cp = await fsList("paramedics");
      allParamedics = cp.map(p => ({
        milNum: p.milNum, rank: p.rank, name: p.name, role: p.role || "paramedic",
        center: p.centerName || p.center, phone: p.phone,
        active: p.active !== false, _firestoreId: p._id
      })).filter(p => p.active);
      myParamedics = allParamedics.filter(p => {
        const pc = p.center || "";
        return pc && supervisorCenters.some(c => centerMatches(c, pc));
      });
      okCount++;
    } catch(e) {}
    try {
      const ci = await fsList("issues");
      allIssues = ci.map(i => ({ ...i, id: i.id || i._id }));
      myIssues = allIssues.filter(i => {
        const ic = i.center || i.centerName || "";
        return ic && supervisorCenters.some(c => centerMatches(c, ic));
      });
      myCreatedIssues = allIssues.filter(i =>
        i.supervisor === supervisor.name || i.supervisorCode === supervisor.code
      );
      /* 🆕 v23: تخزين محلي للعمل offline */
      await cacheIssuesLocally();
      okCount++;
    } catch(e) {}
    try {
      const cr = await fsList("reports");
      allReports = cr.map(r => ({ ...r, id: r.id || r._id }));
      myReports = allReports.filter(r => {
        const rc = r.centerName || r.center || "";
        return rc && supervisorCenters.some(c => centerMatches(c, rc));
      });
      okCount++;
    } catch(e) {}
    try {
      const cs = await fsList("shifts");
      const tk = todayKey();
      allShiftsToday = cs.map(s => ({ ...s, id: s.id || s._id })).filter(s => s.date === tk);
      myShifts = {};
      allShiftsToday.forEach(s => {
        const sc = s.centerName || s.center || "";
        if (supervisorCenters.some(c => centerMatches(c, sc))) {
          myShifts[cleanCenter(sc) + "_" + s.shiftType] = s;
        }
      });
      okCount++;
    } catch(e) {}
    try { allBroadcasts = await fsList("broadcasts"); okCount++; } catch(e) {}
    try { chats = (await fsList("chats")).map(c => ({ ...c, _firestoreId: c._id })); okCount++; } catch(e) {}
    try {
      const cv = await fsList("visits");
      allVisits = cv.map(v => ({ ...v, id: v.id || v._id }));
      myVisits = allVisits.filter(v =>
        v.supervisor === supervisor.name || v.supervisorCode === supervisor.code
      );
      okCount++;
    } catch(e) {}
    try {
      const cint = await fsList("internal_issues");
      allInternalIssues = cint.map(i => ({ ...i, id: i.id || i._id }));
      myInternalIssues = allInternalIssues.filter(i =>
        i.supervisor === supervisor.name || i.supervisorCode === supervisor.code
      );
      okCount++;
    } catch(e) {}

    if (okCount > 0) setOnlineStatus("online"); else setOnlineStatus("offline");
    updateScopeDisplay();
    refreshAllViews();
    buildNotifications();
    lastSmartSync = Date.now();
  } catch(e) {
    console.error("Sync:", e);
    syncFailStreak++;
    if (syncFailStreak >= 2) setOnlineStatus("offline");
  } finally {
    isSyncing = false;
  }
}

async function smartPoll() {
  if (isSmartPolling || isSyncing || !supervisor) return;
  if (Date.now() - lastSmartSync < 4000) return;
  isSmartPolling = true;
  try {
    const [issues, internal] = await Promise.all([
      fsList("issues").catch(() => null),
      fsList("internal_issues").catch(() => null)
    ]);
    let changed = false;
    if (issues) {
      const mapped = issues.map(i => ({ ...i, id: i.id || i._id }));
      const myNew = mapped.filter(i => {
        const ic = i.center || i.centerName || "";
        return ic && supervisorCenters.some(c => centerMatches(c, ic));
      });
      const myCreated = mapped.filter(i =>
        i.supervisor === supervisor.name || i.supervisorCode === supervisor.code
      );
      myCreated.forEach(newIssue => {
        const old = myCreatedIssues.find(o => o.id === newIssue.id);
        if (old) {
          const oldComments = (old.comments || []).length;
          const newComments = (newIssue.comments || []).length;
          if (newComments > oldComments) {
            const latest = newIssue.comments[newIssue.comments.length - 1];
            if (latest && latest.author !== supervisor.name) {
              playPing();
              showToast(`💬 تعليق جديد من ${latest.author}`, "info", 4000);
              changed = true;
            }
          }
          if (old.status !== "resolved" && newIssue.status === "resolved") {
            playSuccess();
            showToast(`🎉 تم حل إشكاليتك: ${newIssue.issueType || newIssue.praiseType || ""}`, "success", 4500);
            changed = true;
          }
        }
      });
      allIssues = mapped;
      myIssues = myNew;
      myCreatedIssues = myCreated;
    }
    if (internal) {
      const mappedInt = internal.map(i => ({ ...i, id: i.id || i._id }));
      myInternalIssues = mappedInt.filter(i =>
        i.supervisor === supervisor.name || i.supervisorCode === supervisor.code
      );
      allInternalIssues = mappedInt;
    }
    if (changed) { refreshAllViews(); buildNotifications(); }
    lastSmartSync = Date.now();
  } catch(e) {
  } finally {
    isSmartPolling = false;
  }
}

function manualRefresh() {
  const btn = document.getElementById("refreshBtn");
  if (btn) btn.textContent = "⏳";
  showToast("جاري التحديث...", "info", 1500);
  vibrate(20);

/* ═══════════════════════════════════════════════════════════
   الصفحة الشخصية
   ═══════════════════════════════════════════════════════════ */
function renderProfile() {
  const stats = computeMyStats();
  const el = (id) => document.getElementById(id);
  if (el("pStatTotal")) el("pStatTotal").textContent = stats.total;
  if (el("pStatResolved")) el("pStatResolved").textContent = stats.resolvedCount;
  if (el("pStatProgress")) el("pStatProgress").textContent = stats.progressCount;
  if (el("pStatVisits")) el("pStatVisits").textContent = stats.visitsCount;
  renderWeeklyChart();
  renderMonthlyChart();
  updateBiometricUI();
}
function renderWeeklyChart() {
  const days = [];
  const dayNames = ["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i*86400000);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const count = myCreatedIssues.filter(x => (x.timestamp||"").slice(0,10) === key).length;
    days.push({ label: dayNames[d.getDay()], count });
  }
  const max = Math.max(...days.map(d => d.count), 1);
  const el = document.getElementById("weeklyChart");
  if (!el) return;
  el.innerHTML = days.map(d => {
    const h = (d.count / max) * 100;
    return `<div class="bar-item">
      <div class="bar-value">${d.count}</div>
      <div class="bar" style="height:${h}%;"></div>
      <div class="bar-label">${d.label}</div>
    </div>`;
  }).join("");
}
function renderMonthlyChart() {
  const months = [];
  const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const yearMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const count = myCreatedIssues.filter(x => (x.timestamp || "").slice(0,7) === yearMonth).length;
    months.push({ label: monthNames[d.getMonth()].slice(0,4), count });
  }
  const max = Math.max(...months.map(m => m.count), 1);
  const el = document.getElementById("monthlyChart");
  if (!el) return;
  el.innerHTML = months.map(m => {
    const w = (m.count / max) * 100;
    return `<div class="month-cell">
      <div class="mc-label">${m.label}</div>
      <div class="mc-value">${m.count}</div>
      <div class="mc-bar" style="width:${Math.max(w,5)}%;"></div>
    </div>`;
  }).join("");
}

function refreshAllViews() {
  try { renderHome(); } catch(e) { console.warn("Home:", e); }

  try { renderVisits(); } catch(e) {}
  try { renderReports(); } catch(e) {}

function switchPage(id, filter = null) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const page = document.getElementById("page-" + id);
  if (page) page.classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  const navBtn = document.querySelector(`.nav-btn[data-page="${id}"]`);
  if (navBtn) navBtn.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
  vibrate(15);
  try { localStorage.setItem(LAST_PAGE_KEY, id); } catch(e) {}
  if (id === "issues" && filter) {
    currentIssuesFilter = filter;
    document.querySelectorAll("#issuesFilters .filter-pill").forEach(b => {
      b.classList.toggle("active", b.dataset.filter === filter);
    });
  }
  refreshAllViews();
}
function openModal({ title, body, actions = [] }) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = body;
  const oldActions = document.getElementById("modalActionsBar");
  if (oldActions) oldActions.remove();
  if (!actions.length) actions = [{ text: "إغلاق", type: "secondary", onClick: closeModal }];
  const actionsBar = document.createElement("div");
  actionsBar.id = "modalActionsBar";
  actionsBar.style.cssText = "display:grid;grid-template-columns:" + (actions.length === 1 ? "1fr" : "1fr 2fr") + ";gap:10px;margin-top:16px;";
  actions.forEach(a => {
    const btn = document.createElement("button");
    btn.className = "btn " + (a.type || "");
    btn.textContent = a.text;
    btn.onclick = () => { if (typeof a.onClick === "function") a.onClick(); };
    actionsBar.appendChild(btn);
  });
  document.getElementById("modalBody").appendChild(actionsBar);
  document.getElementById("modalOverlay").classList.add("show");
}
function closeModal() { document.getElementById("modalOverlay").classList.remove("show"); }
function closeSuccess() { document.getElementById("successScreen").classList.remove("show"); }

/* ═══════════════════════════════════════════════════════════
   PTR (Pull to refresh) + Idle + Visibility
   ═══════════════════════════════════════════════════════════ */
function attachPullToRefresh() {
  let startY = 0, pulling = false;
  const ind = document.getElementById("ptrIndicator");
  if (!ind) return;
  document.addEventListener("touchstart", (e) => {
    if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 80 && window.scrollY === 0) { ind.classList.add("visible"); ind.textContent = "⬆️ اترك للتحديث"; }
    else if (dy > 20 && window.scrollY === 0) { ind.classList.add("visible"); ind.textContent = "⬇️ اسحب للتحديث"; }
    else ind.classList.remove("visible");
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (!pulling) return;
    pulling = false;
    if (ind.classList.contains("visible") && ind.textContent.includes("اترك")) {
      ind.textContent = "🔄 جاري التحديث...";
      syncFromCloud().then(() => setTimeout(() => ind.classList.remove("visible"), 500));
    } else ind.classList.remove("visible");
  });
}

function attachIdleListeners() {
  const reset = () => {
    lastActivityTime = Date.now();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!supervisor) return;
      if (biometricEnabled) {
        playLockSound();
        showLockScreen();
        showToast("🔒 تم قفل التطبيق تلقائياً", "info", 3500);
      } else {
        showToast("⏰ قفل الجلسة", "warn", 3500);
        setTimeout(() => confirmLogoutDialog(), 2000);
      }
    }, IDLE_TIMEOUT_MS);
  };
  ["click","touchstart","keydown","scroll"].forEach(ev => {
    document.addEventListener(ev, reset, { passive: true });
  });
  reset();
}

function attachVisibilityListeners() {
  document.addEventListener("visibilitychange", () => {
    isPageVisible = !document.hidden;
    if (isPageVisible) setTimeout(() => { if (supervisor) syncFromCloud(true); }, 500);
  });
  window.addEventListener("focus", () => { isPageVisible = true; lastActivityTime = Date.now(); });
  window.addEventListener("blur", () => { isPageVisible = false; });
}
function debouncedRefresh() {
  clearTimeout(refreshDebounceTimer);
  refreshDebounceTimer = setTimeout(() => {
    try { refreshAllViews(); } catch(e) {}
  }, VIEW_REFRESH_DEBOUNCE);
}

/* ═══════════════════════════════════════════════════════════
   Bootstrap — بدء التشغيل
   ═══════════════════════════════════════════════════════════ */
(async function start() {
  console.log(`📱 v${APP_VERSION} — بدء التشغيل`);

  /* فتح IndexedDB */
  try { await openDB(); } catch(e) { console.warn("IndexedDB unavailable:", e); }

  if (biometricEnabled && localStorage.getItem(BIOMETRIC_CRED_KEY)) {
    const bioBtn = document.getElementById("loginBiometric");
    if (bioBtn) bioBtn.classList.add("show");
  }

  /* 🔒 v23: قراءة من URL ثم مسح فوري */
  const urlUser = getUserFromUrl();
  if (urlUser && urlUser.code) {
    supervisor = { ...urlUser };
    saveSession(supervisor);
    document.getElementById("loginScreen").style.display = "none";
    try {
      const [settings, sups] = await Promise.all([
        fsList("settings").catch(() => []),
        fsList("supervisors").catch(() => [])
      ]);
      if (settings.length > 0) {
        const s = settings[0];
        if (s.sectors) appData.sectors = s.sectors;
        applyBrandFromSettings(s);
      }
      const me = sups.find(x => x.code === supervisor.code);
      if (me) {
        supervisor.name = me.name || supervisor.name;
        supervisor.sector = me.sector || supervisor.sector;
        supervisor.scope = me.scope || supervisor.scope;
        supervisor.centers = me.centers || supervisor.centers;
        saveSession(supervisor);
      }
    } catch(e) {}
    applySupervisorScope();
    return;
  }

  const saved = loadSession();
  if (saved && saved.code) {
    supervisor = { ...saved, name: saved.name || "مشرف" };
    try {
      const [settings, sups] = await Promise.all([
        fsList("settings").catch(() => []),
        fsList("supervisors").catch(() => [])
      ]);
      if (settings.length > 0) {
        const s = settings[0];
        if (s.sectors) appData.sectors = s.sectors;
        applyBrandFromSettings(s);
      }
      const me = sups.find(x => x.code === supervisor.code);
      if (me) {
        supervisor.name = me.name || supervisor.name;
        supervisor.sector = me.sector || supervisor.sector;
        supervisor.scope = me.scope || supervisor.scope;
        supervisor.centers = me.centers || supervisor.centers;
        saveSession(supervisor);
      }
    } catch(e) {}
    document.getElementById("loginScreen").style.display = "none";
    if (biometricEnabled && localStorage.getItem(BIOMETRIC_CRED_KEY)) {
      setTimeout(() => {
        document.getElementById("mainApp").classList.add("ready");
        showLockScreen();
      }, 100);
      applySupervisorScope();
    } else {
      applySupervisorScope();
    }
    return;
  }
  document.getElementById("loginScreen").style.display = "flex";
  setTimeout(() => document.getElementById("codeInput")?.focus(), 200);
})();
