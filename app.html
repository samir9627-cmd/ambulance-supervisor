<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041814">
<title>لوحة المشرف — نظام الإسعاف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
body { background:#041814; color:#fff; min-height:100vh; }
.topbar { background:#0d4a42; padding:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #c9a227; }
.title { font-size:16px; color:#e5c158; font-weight:900; }
.content { padding:20px; text-align:center; }
.card { background:rgba(13,74,66,0.5); padding:20px; border-radius:16px; border:1px solid rgba(201,162,39,0.3); margin-bottom:16px; }
.btn { padding:12px; border-radius:12px; border:none; font-weight:900; cursor:pointer; width:100%; margin-top:10px; }
.btn-danger { background:#e53935; color:#fff; }
.btn-primary { background:#c9a227; color:#041814; }
#loginScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:20px; text-align:center; }
#mainApp { display:none; }
</style>
</head>
<body>

<div id="loginScreen">
  <img src="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg" style="width:80px; border-radius:16px; border:2px solid #c9a227; margin-bottom:20px;">
  <h2 style="color:#e5c158;">جاري التحقق من الجلسة...</h2>
  <p style="margin-top:10px; font-size:12px; color:rgba(255,255,255,0.6);">إذا لم يتم توجيهك تلقائياً، يرجى العودة للصفحة الرئيسية.</p>
</div>

<div id="mainApp">
  <div class="topbar">
    <div class="title" id="welcomeName">لوحة المشرف</div>
    <button class="btn btn-danger" style="width:auto; padding:8px 16px; margin:0;" onclick="logout()">خروج</button>
  </div>
  <div class="content">
    <div class="card">
      <h2 style="color:#69f0ae;">✅ مرحباً بك</h2>
      <p style="margin-top:10px; font-size:13px; color:rgba(255,255,255,0.8);">تم تسجيل دخولك بنجاح إلى لوحة المشرف الميداني (نسخة الإنقاذ).</p>
      <p style="margin-top:10px; font-size:12px; color:#c9a227;" id="userCode"></p>
    </div>
    <div class="card">
      <p style="font-size:12px; color:rgba(255,255,255,0.6);">هنا ستظهر الإشكاليات والبلاغات في النسخة الكاملة.</p>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // دالة قراءة الجلسة الموحدة
  const userStr = localStorage.getItem("amb_user") || sessionStorage.getItem("amb_user");
  
  if (!userStr) {
    // إذا لم توجد جلسة، أعد المستخدم للصفحة الرئيسية
    location.href = "index.html";
    return;
  }
  
  try {
    const user = JSON.parse(userStr);
    // عرض البيانات
    document.getElementById("welcomeName").innerText = "المشرف: " + (user.name || "مستخدم");
    document.getElementById("userCode").innerText = "الكود: " + (user.code || "—");
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
  } catch (e) {
    location.href = "index.html";
  }
});

function logout() {
  localStorage.removeItem("amb_user");
  sessionStorage.removeItem("amb_user");
  location.href = "index.html";
}
</script>
</body>
</html>
