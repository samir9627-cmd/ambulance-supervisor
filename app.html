<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#041814">
<meta name="apple-mobile-web-app-title" content="لوحة المشرف">
<link rel="apple-touch-icon" href="https://i.postimg.cc/q72nZ5HT/IMG-2018.jpg">
<title>لوحة المشرف — v23.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'Cairo','Tajawal','Segoe UI',sans-serif; }

:root {
  --gold:#c9a227; --gold-light:#e5c158; --gold-bright:#ffd966;
  --teal:#0d4a42; --teal-dark:#082b26; --teal-deep:#041814;
  --green:#43a047; --green-light:#69f0ae;
  --red:#e53935; --red-light:#ff5252;
  --amber:#fb8c00; --amber-light:#ffa726;
  --blue:#29b6f6; --blue-light:#64b5f6;
  --purple:#ab47bc; --purple-light:#ce93d8;
  --pink:#ec407a;
  --cyan:#00bcd4; --cyan-light:#4dd0e1;
  --surface:rgba(13,74,66,0.55);
  --surface-2:rgba(4,24,20,0.75);
  --border:rgba(201,162,39,0.25);
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}

html, body { background:var(--teal-deep); color:#fff; font-weight:600; overflow-x:hidden; overscroll-behavior-y:contain; }
body { min-height:100vh; padding-bottom:calc(100px + var(--safe-bottom)); }
body::before {
  content:''; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(circle at 15% 10%, rgba(201,162,39,0.18) 0%, transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(13,74,66,0.7) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(41,182,246,0.05) 0%, transparent 60%),
    linear-gradient(180deg, #041814 0%, #082b26 50%, #041814 100%);
}

@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
@keyframes pulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.6; transform:scale(1.05);} }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
@keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
@keyframes checkPop { 0% { transform:scale(0); } 100% { transform:scale(1); } }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes lockShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} }

/* ═══ شاشة النطاق ═══ */
#scopeScreen { position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg, #041814, #0d4a42, #082b26); overflow-y:auto; }
.scope-box { text-align:center; max-width:460px; width:100%; padding:34px 24px; background:linear-gradient(145deg, rgba(13,74,66,0.65), rgba(4,24,20,0.95)); border:2px solid var(--border); border-radius:28px; box-shadow:0 25px 70px rgba(0,0,0,0.7), 0 0 60px rgba(201,162,39,0.15); animation:scaleIn 0.4s; }
.scope-icon { font-size:64px; margin-bottom:16px; filter:drop-shadow(0 0 25px rgba(201,162,39,0.7)); animation:float 3s ease-in-out infinite; }
.scope-title { font-size:22px; color:var(--gold-light); font-weight:900; margin-bottom:8px; }
.scope-sub { font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:20px; }
.scope-info-card { background:linear-gradient(135deg, rgba(201,162,39,0.2), rgba(13,74,66,0.5)); border:2px solid rgba(201,162,39,0.4); border-radius:18px; padding:18px; margin-bottom:20px; text-align:right; }
.scope-info-row { display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13px; }
.scope-info-row:not(:last-child) { border-bottom:1px solid rgba(201,162,39,0.12); }
.scope-info-row .sir-icon { font-size:20px; flex-shrink:0; }
.scope-info-row .sir-label { color:rgba(255,255,255,0.7); font-weight:600; }
.scope-info-row .sir-value { margin-right:auto; color:var(--gold-light); font-weight:900; }
.scope-centers-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.scope-center-chip { padding:6px 12px; border-radius:12px; font-size:11px; font-weight:700; background:rgba(41,182,246,0.2); color:#81d4fa; border:1px solid rgba(41,182,246,0.4); }

/* ═══ شاشة الدخول ═══ */
#loginScreen { position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg, #041814, #0d4a42, #082b26); overflow-y:auto; }
.login-box { text-align:center; max-width:420px; width:100%; padding:34px 24px; background:linear-gradient(145deg, rgba(13,74,66,0.65), rgba(4,24,20,0.95)); border:2px solid var(--border); border-radius:28px; box-shadow:0 25px 70px rgba(0,0,0,0.7), 0 0 60px rgba(201,162,39,0.15); animation:scaleIn 0.4s; }
.logo-wrap { position:relative; display:inline-block; margin-bottom:20px; }
.logo-wrap::before { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200px; height:200px; background:radial-gradient(circle, rgba(201,162,39,0.4) 0%, transparent 70%); border-radius:50%; animation:pulse 3s infinite; z-index:-1; }
.login-logo { width:130px; height:130px; object-fit:contain; border-radius:22px; background:linear-gradient(145deg, #0a5a3a, #064a2e); padding:8px; border:2px solid rgba(201,162,39,0.5); filter:drop-shadow(0 0 25px rgba(201,162,39,0.9)); animation:float 3s ease-in-out infinite; }
.login-title { font-size:22px; color:var(--gold-light); font-weight:900; margin-bottom:6px; }
.login-subtitle { font-size:12px; color:rgba(255,255,255,0.6); margin-bottom:26px; letter-spacing:2px; }
.code-input { width:100%; padding:20px; background:rgba(4,24,20,0.85); border:2px solid var(--border); border-radius:16px; color:var(--gold-light); font-size:24px; font-weight:900; text-align:center; letter-spacing:6px; font-family:'Courier New', monospace; outline:none; margin-bottom:16px; text-transform:uppercase; transition:0.3s; }
.code-input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(201,162,39,0.2), 0 0 30px rgba(201,162,39,0.5); }
.code-input::placeholder { letter-spacing:4px; font-size:18px; opacity:0.35; }
.login-btn { width:100%; padding:17px; border:none; border-radius:16px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); font-size:17px; font-weight:900; cursor:pointer; font-family:inherit; box-shadow:0 10px 30px rgba(201,162,39,0.4); transition:0.2s; }
.login-btn:active { transform:scale(0.97); }
.login-btn:disabled { opacity:0.6; }
.login-msg { margin-top:16px; font-size:13px; min-height:22px; font-weight:700; }
.login-footer { margin-top:22px; font-size:11px; color:rgba(255,255,255,0.5); padding-top:18px; border-top:1px solid rgba(201,162,39,0.15); }

.login-biometric { margin-top:16px; padding:16px; background:linear-gradient(135deg, rgba(201,162,39,0.15), rgba(13,74,66,0.5)); border:2px solid var(--gold); border-radius:16px; cursor:pointer; display:none; align-items:center; justify-content:center; gap:12px; transition:0.3s; animation:float 3s ease-in-out infinite; }
.login-biometric.show { display:flex; }
.login-biometric:active { transform:scale(0.97); }
.login-biometric .bio-icon { font-size:32px; filter:drop-shadow(0 0 15px rgba(201,162,39,0.9)); }
.login-biometric .bio-text { text-align:right; flex:1; }
.login-biometric .bio-title { font-size:14px; font-weight:900; color:var(--gold-light); }
.login-biometric .bio-sub { font-size:11px; color:rgba(255,255,255,0.65); margin-top:3px; }

/* ═══ شاشة القفل ═══ */
#lockScreen { position:fixed; inset:0; z-index:9500; display:none; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg, #041814, #0d4a42, #082b26); backdrop-filter:blur(20px); }
.lock-box { text-align:center; max-width:400px; width:100%; padding:40px 24px; background:linear-gradient(145deg, rgba(13,74,66,0.75), rgba(4,24,20,0.95)); border:2px solid var(--gold); border-radius:28px; box-shadow:0 25px 70px rgba(0,0,0,0.8), 0 0 80px rgba(201,162,39,0.3); animation:scaleIn 0.4s; }
.lock-box.shake { animation:lockShake 0.5s; }
.lock-icon { font-size:72px; margin-bottom:16px; filter:drop-shadow(0 0 30px rgba(201,162,39,0.9)); animation:float 3s ease-in-out infinite; }
.lock-title { font-size:22px; color:var(--gold-light); font-weight:900; margin-bottom:8px; }
.lock-sub { font-size:13px; color:rgba(255,255,255,0.7); margin-bottom:24px; line-height:1.6; }
.lock-fingerprint { width:140px; height:140px; border-radius:50%; margin:0 auto 24px; background:radial-gradient(circle, rgba(201,162,39,0.3), rgba(13,74,66,0.6)); border:3px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:64px; cursor:pointer; transition:0.3s; animation:pulse 2s infinite; }
.lock-fingerprint:active { transform:scale(0.95); }
.lock-fingerprint.success { background:radial-gradient(circle, rgba(67,160,71,0.4), rgba(4,24,20,0.8)); border-color:var(--green-light); animation:none; }
.lock-fingerprint.error { background:radial-gradient(circle, rgba(229,57,53,0.4), rgba(4,24,20,0.8)); border-color:var(--red-light); }
.lock-btn-use-code { margin-top:16px; padding:12px 24px; background:transparent; border:1px solid var(--border); color:rgba(255,255,255,0.7); border-radius:12px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:0.2s; }
.lock-btn-use-code:active { background:rgba(255,255,255,0.1); }

/* ═══ التطبيق ═══ */
#mainApp { display:none; }
#mainApp.ready { display:block; animation:fadeIn 0.5s; }

.topbar { position:sticky; top:0; z-index:100; padding:calc(12px + var(--safe-top)) 16px 12px; background:linear-gradient(135deg, rgba(4,24,20,0.98), rgba(13,74,66,0.95)); border-bottom:2px solid var(--gold); backdrop-filter:blur(20px); display:flex; align-items:center; gap:8px; box-shadow:0 4px 25px rgba(0,0,0,0.7); }
.topbar-logo { width:44px; height:44px; border-radius:12px; flex-shrink:0; background:linear-gradient(145deg, #0a5a3a, #064a2e); padding:3px; border:1px solid var(--border); filter:drop-shadow(0 0 8px rgba(201,162,39,0.7)); object-fit:contain; }
.topbar-info { flex:1; min-width:0; }
.topbar-info h1 { font-size:13px; color:var(--gold-light); font-weight:900; }
.topbar-info p { font-size:10px; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:6px; margin-top:3px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--green-light); box-shadow:0 0 8px var(--green-light); }
.status-dot.offline { background:var(--red-light); box-shadow:0 0 8px var(--red-light); }
.status-dot.checking { background:var(--amber-light); box-shadow:0 0 8px var(--amber-light); animation:pulse 1s infinite; }

.topbar-clock { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 10px; border-radius:10px; background:rgba(255,255,255,0.06); border:1px solid var(--border); flex-shrink:0; min-width:64px; }
.topbar-clock-time { font-size:14px; font-weight:900; font-family:'Tajawal', sans-serif; color:var(--gold-light); line-height:1; letter-spacing:0.5px; }
.topbar-clock-shift { font-size:8px; font-weight:700; color:rgba(255,255,255,0.6); margin-top:2px; }

.pending-indicator { position:fixed; top:calc(80px + var(--safe-top)); right:16px; z-index:120; display:none; align-items:center; gap:6px; padding:6px 12px; background:linear-gradient(135deg, rgba(251,140,0,0.95), rgba(255,167,38,0.95)); color:#041814; border-radius:20px; font-size:11px; font-weight:900; box-shadow:0 6px 20px rgba(251,140,0,0.5); animation:slideDown 0.3s; }
.pending-indicator.show { display:flex; }
.pending-indicator .pending-spin { width:12px; height:12px; border:2px solid rgba(4,24,20,0.3); border-top-color:#041814; border-radius:50%; animation:spin 0.8s linear infinite; }

.icon-btn { width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.2s; flex-shrink:0; position:relative; }
.icon-btn:active { transform:scale(0.92); background:rgba(201,162,39,0.25); }
.icon-btn.danger { background:rgba(198,40,40,0.4); border-color:rgba(255,82,82,0.5); }
.icon-btn .badge-dot { position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px; background:linear-gradient(135deg, var(--red), var(--red-light)); border-radius:10px; border:2px solid var(--teal-deep); font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.offline-banner { background:linear-gradient(90deg, var(--red), #ff5252); color:#fff; padding:8px 16px; text-align:center; font-size:11px; font-weight:700; display:none; position:sticky; top:calc(72px + var(--safe-top)); z-index:99; }
.offline-banner.show { display:block; animation:slideDown 0.3s; }

.page { display:none; padding:16px; max-width:720px; margin:0 auto; }
.page.active { display:block; animation:slideUp 0.35s ease-out; }

/* ═══ زر العودة للأعلى ═══ */
.back-to-top { position:fixed; bottom:calc(200px + var(--safe-bottom)); right:16px; width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg, var(--teal), var(--teal-dark)); color:var(--gold-light); border:2px solid var(--border); font-size:20px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:150; box-shadow:0 6px 20px rgba(0,0,0,0.5); transition:0.3s; }
.back-to-top.show { display:flex; animation:scaleIn 0.3s; }
.back-to-top:active { transform:scale(0.9); }

/* ═══ بطاقات ═══ */
.card { background:linear-gradient(145deg, var(--surface), rgba(4,24,20,0.9)); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; box-shadow:0 8px 25px rgba(0,0,0,0.4); position:relative; overflow:hidden; }
.card-title { font-size:14px; color:var(--gold-light); font-weight:900; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid rgba(201,162,39,0.15); display:flex; align-items:center; gap:8px; }
.card-title .hint { margin-right:auto; font-size:10px; color:rgba(255,255,255,0.55); font-weight:500; }
.card-title .badge-count { margin-right:auto; background:var(--gold); color:var(--teal-deep); padding:2px 10px; border-radius:12px; font-size:11px; font-weight:900; }

/* ═══ Hero Card ═══ */
.hero-card { position:relative; background:linear-gradient(135deg, rgba(201,162,39,0.25), rgba(13,74,66,0.7)), radial-gradient(circle at top right, rgba(41,182,246,0.15), transparent 60%); border:2px solid rgba(201,162,39,0.5); border-radius:24px; padding:22px; margin-bottom:16px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,0.4), inset 0 0 60px rgba(201,162,39,0.05); }
.hero-card::before { content:''; position:absolute; top:-100px; left:-100px; width:300px; height:300px; background:radial-gradient(circle, rgba(201,162,39,0.3), transparent 70%); border-radius:50%; pointer-events:none; animation:float 6s ease-in-out infinite; }
.hero-card::after { content:''; position:absolute; bottom:-80px; right:-80px; width:200px; height:200px; background:radial-gradient(circle, rgba(41,182,246,0.2), transparent 70%); border-radius:50%; pointer-events:none; }
.hero-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; position:relative; z-index:1; }
.hero-greet { font-size:13px; color:rgba(255,255,255,0.7); margin-bottom:4px; }
.hero-name { font-size:22px; color:#fff; font-weight:900; line-height:1.2; text-shadow:0 2px 20px rgba(201,162,39,0.4); }
.hero-avatar { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; box-shadow:0 0 25px rgba(201,162,39,0.6); flex-shrink:0; }
.hero-meta { display:flex; flex-wrap:wrap; gap:6px; position:relative; z-index:1; margin-bottom:14px; }
.hero-chip { padding:5px 12px; border-radius:12px; font-size:11px; font-weight:900; display:inline-flex; align-items:center; gap:5px; backdrop-filter:blur(10px); }
.hero-chip.gold { background:rgba(201,162,39,0.25); color:var(--gold-light); border:1px solid rgba(201,162,39,0.5); }
.hero-chip.blue { background:rgba(41,182,246,0.25); color:#81d4fa; border:1px solid rgba(41,182,246,0.5); }
.hero-chip.green { background:rgba(67,160,71,0.25); color:#a5d6a7; border:1px solid rgba(67,160,71,0.5); }

/* ═══ KPI الجديد المبسط ═══ */
.kpi-simple {
  position:relative;
  background:linear-gradient(135deg, rgba(201,162,39,0.2), rgba(13,74,66,0.7));
  border:2px solid rgba(201,162,39,0.5);
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
}
.kpi-simple::before {
  content:'';
  position:absolute;
  top:-50px; left:-50px;
  width:200px; height:200px;
  background:radial-gradient(circle, rgba(201,162,39,0.25), transparent 70%);
  border-radius:50%;
  pointer-events:none;
  animation:float 5s ease-in-out infinite;
}
.kpi-simple-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  position:relative;
  z-index:1;
}
.kpi-simple-title {
  font-size:13px;
  color:var(--gold-light);
  font-weight:900;
  display:flex;
  align-items:center;
  gap:6px;
}
.kpi-simple-period {
  font-size:10px;
  color:rgba(255,255,255,0.6);
  background:rgba(4,24,20,0.5);
  padding:3px 10px;
  border-radius:10px;
  font-weight:700;
}
.kpi-simple-body {
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:16px;
  position:relative;
  z-index:1;
}
.kpi-score-big {
  text-align:center;
  flex-shrink:0;
}
.kpi-score-number {
  font-size:44px;
  font-weight:900;
  font-family:'Tajawal', sans-serif;
  line-height:1;
  color:var(--gold-light);
  text-shadow:0 2px 20px rgba(201,162,39,0.5);
  transition:color 0.3s;
}
.kpi-score-number .kpi-max {
  font-size:18px;
  opacity:0.5;
}
.kpi-score-grade {
  font-size:13px;
  font-weight:900;
  margin-top:6px;
  padding:3px 12px;
  border-radius:10px;
  display:inline-block;
  transition:all 0.3s;
}
.kpi-score-grade.grade-A { background:rgba(0,230,118,0.2); color:#69f0ae; }
.kpi-score-grade.grade-B { background:rgba(255,213,79,0.2); color:#ffd54f; }
.kpi-score-grade.grade-C { background:rgba(255,167,38,0.2); color:#ffa726; }
.kpi-score-grade.grade-D { background:rgba(239,83,80,0.2); color:#ff8a80; }
.kpi-metrics-mini {
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.kpi-metric-box {
  background:rgba(4,24,20,0.5);
  border-radius:10px;
  padding:8px 10px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.06);
}
.kpi-metric-box .kpi-metric-num {
  font-size:18px;
  font-weight:900;
  font-family:'Tajawal', sans-serif;
  line-height:1;
}
.kpi-metric-box .kpi-metric-lbl {
  font-size:9px;
  opacity:0.65;
  margin-top:3px;
}
.kpi-metric-box.blue .kpi-metric-num { color:var(--blue-light); }
.kpi-metric-box.green .kpi-metric-num { color:var(--green-light); }
.kpi-metric-box.purple .kpi-metric-num { color:var(--purple-light); }
.kpi-metric-box.red .kpi-metric-num { color:var(--red-light); }
.kpi-bar {
  height:8px;
  background:rgba(4,24,20,0.7);
  border-radius:6px;
  overflow:hidden;
  position:relative;
  z-index:1;
}
.kpi-bar-fill {
  height:100%;
  border-radius:6px;
  transition:width 0.6s, background 0.3s;
}
.kpi-bar-fill.grade-A { background:linear-gradient(90deg, #00e676, #69f0ae); }
.kpi-bar-fill.grade-B { background:linear-gradient(90deg, #ffd54f, #ffe082); }
.kpi-bar-fill.grade-C { background:linear-gradient(90deg, #ffa726, #ffcc80); }

/* ═══ هدف اليوم ═══ */

.daily-goal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; }
.daily-goal-head .dg-title { color:var(--gold-light); font-weight:900; display:flex; align-items:center; gap:6px; }
.daily-goal-head .dg-count { color:#fff; font-weight:900; font-family:'Tajawal', sans-serif; font-size:16px; }
.progress-track { height:10px; background:rgba(255,255,255,0.08); border-radius:10px; overflow:hidden; position:relative; }
.progress-fill { height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold-bright)); border-radius:10px; transition:width 0.5s cubic-bezier(0.4,0,0.2,1); position:relative; overflow:hidden; box-shadow:0 0 15px rgba(201,162,39,0.6); }
.progress-fill::after { content:''; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation:shimmer 2s infinite; }
.streak-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:linear-gradient(135deg, rgba(229,57,53,0.25), rgba(251,140,0,0.25)); border:1px solid rgba(251,140,0,0.5); border-radius:14px; font-size:11px; font-weight:900; color:#ffcc80; margin-top:10px; position:relative; z-index:1; }

/* ═══ أزرار سريعة ═══ */
.quick-actions-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.quick-action-btn { padding:18px 14px; border-radius:18px; border:none; font-family:inherit; font-weight:900; font-size:14px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; transition:all 0.25s; position:relative; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.3); }
.quick-action-btn::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle, rgba(255,255,255,0.15), transparent 60%); opacity:0; transition:0.3s; }
.quick-action-btn:active { transform:scale(0.96); }
.quick-action-btn:active::before { opacity:1; }
.quick-action-btn .qa-icon { font-size:32px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
.quick-action-btn.danger { background:linear-gradient(135deg, #e53935, #ff5252); color:#fff; }
.quick-action-btn.success { background:linear-gradient(135deg, #43a047, #69f0ae); color:#041814; }
.quick-action-btn.info { background:linear-gradient(135deg, #29b6f6, #64b5f6); color:#fff; }
.quick-action-btn.purple { background:linear-gradient(135deg, #ab47bc, #ce93d8); color:#fff; }

/* ═══ إحصائيات ═══ */
.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.stat-big { background:linear-gradient(145deg, rgba(4,24,20,0.9), rgba(13,74,66,0.6)); border:1px solid var(--border); border-radius:18px; padding:16px; position:relative; overflow:hidden; transition:0.2s; cursor:pointer; }
.stat-big:active { transform:scale(0.97); }
.stat-big::before { content:''; position:absolute; top:0; right:0; width:80px; height:80px; background:radial-gradient(circle, currentColor, transparent 70%); opacity:0.15; border-radius:50%; }
.stat-big .sb-icon { position:absolute; top:12px; left:12px; font-size:32px; opacity:0.5; filter:drop-shadow(0 0 8px currentColor); }
.stat-big .sb-num { font-size:36px; font-weight:900; line-height:1; font-family:'Tajawal', sans-serif; margin-bottom:4px; }
.stat-big .sb-label { font-size:12px; color:rgba(255,255,255,0.7); font-weight:700; }
.stat-big.blue { color:var(--blue-light); }
.stat-big.red { color:var(--red-light); }
.stat-big.green { color:var(--green-light); }
.stat-big.amber { color:var(--amber-light); }
.stat-big.purple { color:var(--purple-light); }
.stat-big.cyan { color:var(--cyan-light); }

.stats-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:14px; }

.stats-grid.four { grid-template-columns:repeat(2, 1fr); }
@media (min-width:520px) { .stats-grid.four { grid-template-columns:repeat(4, 1fr); } }
.stat-mini { background:linear-gradient(145deg, var(--surface-2), rgba(13,74,66,0.4)); border:1px solid var(--border); border-radius:16px; padding:16px 14px; position:relative; overflow:hidden; transition:0.2s; cursor:pointer; }
.stat-mini:active { transform:scale(0.97); }
.stat-mini .stat-icon { position:absolute; top:10px; left:10px; font-size:26px; opacity:0.35; }
.stat-mini .num { font-size:26px; font-weight:900; color:var(--gold-light); line-height:1; font-family:'Tajawal', sans-serif; }
.stat-mini .lbl { font-size:11px; color:rgba(255,255,255,0.7); margin-top:5px; font-weight:600; }
.stat-mini.red .num { color:var(--red-light); }
.stat-mini.green .num { color:var(--green-light); }
.stat-mini.amber .num { color:var(--amber-light); }
.stat-mini.blue .num { color:var(--blue-light); }
.stat-mini.purple .num { color:var(--purple-light); }
.stat-mini.cyan .num { color:var(--cyan-light); }

/* ═══ شريط النطاق ═══ */
.scope-bar { background:linear-gradient(135deg, rgba(201,162,39,0.15), rgba(41,182,246,0.15)); border:2px solid rgba(201,162,39,0.4); border-radius:16px; padding:14px; margin-bottom:14px; }
.scope-bar-title { font-size:12px; font-weight:900; color:var(--gold-light); display:flex; align-items:center; gap:6px; margin-bottom:8px; }

.scope-bar-center { padding:4px 10px; border-radius:10px; font-size:10px; font-weight:700; background:rgba(41,182,246,0.2); color:#81d4fa; border:1px solid rgba(41,182,246,0.4); }

/* ═══ بطاقات الإشكاليات ═══ */
.issue-card { background:linear-gradient(145deg, rgba(13,74,66,0.6), rgba(4,24,20,0.9)); border:1px solid var(--border); border-right:4px solid var(--amber); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
.issue-card::before { content:''; position:absolute; top:0; right:0; width:100%; height:3px; background:linear-gradient(90deg, transparent, currentColor, transparent); opacity:0.4; }
.issue-card:active { transform:scale(0.99); }
.issue-card.status-new { border-right-color:var(--blue); color:var(--blue-light); }
.issue-card.status-progress { border-right-color:var(--amber); color:var(--amber-light); }
.issue-card.status-escalated { border-right-color:var(--red); color:var(--red-light); }
.issue-card.status-resolved { border-right-color:var(--green); color:var(--green-light); opacity:0.9; }
.issue-card.praise-card { border-right-color:var(--gold-bright); background:linear-gradient(145deg, rgba(201,162,39,0.15), rgba(4,24,20,0.9)); color:var(--gold-light); }

.issue-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }

.issue-desc { font-size:12px; color:rgba(255,255,255,0.85); line-height:1.6; margin-bottom:8px; }
.issue-chips { display:flex; gap:5px; flex-wrap:wrap; }

/* ═══ بطاقات التقارير ═══ */
.report-card { background:linear-gradient(145deg, rgba(13,74,66,0.6), rgba(4,24,20,0.9)); border:1px solid var(--border); border-right:4px solid var(--blue); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; transition:0.2s; }
.report-card.sev-critical { border-right-color:var(--red); }
.report-card.sev-high { border-right-color:var(--amber); }
.report-card.sev-medium { border-right-color:#f9a825; }
.report-card.sev-low { border-right-color:var(--green); }
.report-num { font-family:'Courier New', monospace; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); padding:3px 10px; border-radius:8px; font-size:11px; font-weight:900; display:inline-block; margin-bottom:8px; }
.report-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
.report-type { font-size:14px; font-weight:900; color:var(--gold-light); flex:1; }
.report-time { font-size:10px; color:rgba(255,255,255,0.6); font-family:'Courier New', monospace; }
.report-body { font-size:12px; color:rgba(255,255,255,0.85); line-height:1.5; margin-bottom:8px; }
.report-chips { display:flex; gap:5px; flex-wrap:wrap; }

/* ═══ Chips ═══ */
.chip { font-size:10px; padding:3px 9px; border-radius:10px; font-weight:700; display:inline-flex; align-items:center; gap:3px; border:1px solid; }
.chip.new { background:rgba(41,182,246,0.2); color:#81d4fa; border-color:rgba(41,182,246,0.4); }
.chip.progress { background:rgba(251,140,0,0.2); color:#ffcc80; border-color:rgba(251,140,0,0.4); }
.chip.escalated { background:rgba(229,57,53,0.2); color:#ff8a80; border-color:rgba(229,57,53,0.4); }
.chip.resolved { background:rgba(67,160,71,0.2); color:#a5d6a7; border-color:rgba(67,160,71,0.4); }
.chip.high { background:rgba(229,57,53,0.25); color:#ff8a80; border-color:rgba(229,57,53,0.5); }
.chip.mid { background:rgba(251,140,0,0.25); color:#ffcc80; border-color:rgba(251,140,0,0.5); }
.chip.low { background:rgba(67,160,71,0.25); color:#a5d6a7; border-color:rgba(67,160,71,0.5); }
.chip.comments { background:rgba(171,71,188,0.2); color:#ce93d8; border-color:rgba(171,71,188,0.4); }
.chip.img { background:rgba(41,182,246,0.2); color:#81d4fa; border-color:rgba(41,182,246,0.4); }
.chip.gps { background:rgba(41,182,246,0.2); color:#81d4fa; border-color:rgba(41,182,246,0.4); }
.chip.praise { background:rgba(201,162,39,0.25); color:var(--gold-light); border-color:rgba(201,162,39,0.5); }
.chip.critical { background:rgba(229,57,53,0.25); color:#ff8a80; border-color:rgba(229,57,53,0.5); }
.chip.green { background:rgba(67,160,71,0.25); color:#a5d6a7; border-color:rgba(67,160,71,0.5); }
.chip.amber { background:rgba(251,140,0,0.25); color:#ffcc80; border-color:rgba(251,140,0,0.5); }
.chip.blue { background:rgba(41,182,246,0.25); color:#81d4fa; border-color:rgba(41,182,246,0.5); }
.chip.purple { background:rgba(171,71,188,0.25); color:#ce93d8; border-color:rgba(171,71,188,0.5); }
.chip.cyan { background:rgba(0,188,212,0.25); color:#4dd0e1; border-color:rgba(0,188,212,0.5); }
.chip.grey { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.15); }

/* ═══ فلاتر ═══ */
.filter-scroll { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; scrollbar-width:none; }
.filter-scroll::-webkit-scrollbar { display:none; }
.filter-pill { flex-shrink:0; padding:8px 16px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:20px; font-size:11px; color:rgba(255,255,255,0.7); font-weight:700; cursor:pointer; font-family:inherit; transition:0.2s; }
.filter-pill.active { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); border-color:var(--gold); box-shadow:0 4px 15px rgba(201,162,39,0.4); }

/* ═══ بطاقات الدوام ═══ */
.shift-card-mini { background:linear-gradient(145deg, rgba(13,74,66,0.7), rgba(4,24,20,0.95)); border:2px solid var(--border); border-radius:16px; padding:14px; margin-bottom:8px; border-right:4px solid rgba(255,255,255,0.15); cursor:pointer; transition:0.2s; }
.shift-card-mini:active { transform:scale(0.99); }
.shift-card-mini.open { border-right-color:var(--green-light); }
.shift-card-mini.warning { border-right-color:var(--amber); }
.shift-card-mini .scm-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.shift-card-mini .scm-icon { font-size:22px; }
.shift-card-mini .scm-info { flex:1; min-width:0; }
.shift-card-mini .scm-name { font-size:13px; font-weight:900; color:var(--gold-light); }
.shift-card-mini .scm-meta { font-size:10px; opacity:0.65; margin-top:2px; }
.shift-card-mini .scm-status { padding:3px 9px; border-radius:8px; font-size:9px; font-weight:900; }
.shift-card-mini .scm-status.open { background:rgba(67,160,71,0.25); color:#a5d6a7; }
.shift-card-mini .scm-status.warning { background:rgba(251,140,0,0.25); color:#ffcc80; }
.shift-card-mini .scm-status.closed { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.5); }
.shift-card-mini .scm-staff { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.shift-card-mini .scm-staff-chip { padding:3px 8px; border-radius:8px; font-size:9px; font-weight:700; background:rgba(201,162,39,0.2); color:var(--gold-light); border:1px solid rgba(201,162,39,0.4); }
.shift-card-mini .scm-staff-chip.empty { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); border-color:rgba(255,255,255,0.1); font-style:italic; }

/* ═══ القائمة السفلية ═══ */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:200; background:linear-gradient(180deg, rgba(13,74,66,0.98), rgba(4,24,20,0.98)); border-top:2px solid var(--gold); padding:8px 4px calc(8px + var(--safe-bottom)); display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:auto auto; gap:2px; backdrop-filter:blur(20px); box-shadow:0 -4px 25px rgba(0,0,0,0.6); }
.nav-btn { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:10px; cursor:pointer; transition:0.25s; background:transparent; border:none; color:rgba(255,255,255,0.65); font-family:inherit; font-weight:700; font-size:8.5px; position:relative; }
.nav-btn .nav-icon { font-size:18px; line-height:1; transition:0.25s; }
.nav-btn:active { transform:scale(0.92); }
.nav-btn.active { background:linear-gradient(135deg, rgba(201,162,39,0.3), rgba(201,162,39,0.1)); color:var(--gold-light); }
.nav-btn.active .nav-icon { transform:scale(1.15); filter:drop-shadow(0 0 8px rgba(201,162,39,0.9)); }
.nav-btn .nav-badge { position:absolute; top:-2px; right:2px; min-width:14px; height:14px; background:linear-gradient(135deg, var(--red), var(--red-light)); color:#fff; border-radius:7px; font-size:8px; font-weight:900; display:flex; align-items:center; justify-content:center; padding:0 3px; border:1.5px solid var(--teal-deep); }
.nav-btn.center-btn { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); font-weight:900; box-shadow:0 -4px 20px rgba(201,162,39,0.6); border:2px solid var(--teal-deep); }
.nav-btn.center-btn .nav-icon { font-size:22px; }
.nav-btn.center-btn.active { background:linear-gradient(135deg, var(--gold-bright), var(--gold-light)); }

/* ═══ Modal ═══ */
.modal-overlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.show { display:flex; animation:fadeIn 0.3s; }
.modal-sheet { background:linear-gradient(145deg, var(--teal), var(--teal-dark)); border-top-left-radius:26px; border-top-right-radius:26px; border-top:3px solid var(--gold); width:100%; max-width:720px; max-height:92vh; padding:24px 18px calc(24px + var(--safe-bottom)); overflow-y:auto; animation:slideUp 0.35s cubic-bezier(0.22,1,0.36,1); }
.modal-sheet::before { content:''; display:block; width:42px; height:4px; background:rgba(255,255,255,0.3); border-radius:3px; margin:-12px auto 16px; }
.modal-sheet h3 { color:var(--gold-light); font-size:17px; font-weight:900; text-align:center; padding-bottom:14px; border-bottom:1px solid rgba(201,162,39,0.2); margin-bottom:18px; }

/* ═══ أزرار ═══ */
.btn { width:100%; padding:14px; border:none; border-radius:14px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); font-size:14px; font-weight:900; cursor:pointer; font-family:inherit; box-shadow:0 6px 18px rgba(201,162,39,0.35); transition:0.2s; display:flex; align-items:center; justify-content:center; gap:8px; position:relative; overflow:hidden; }
.btn:active { transform:scale(0.97); }
.btn:disabled { opacity:0.5; }
.btn.secondary { background:rgba(255,255,255,0.08); color:#fff; border:1px solid var(--border); box-shadow:none; }
.btn.danger { background:linear-gradient(135deg, var(--red), var(--red-light)); color:#fff; }
.btn.success { background:linear-gradient(135deg, var(--green), var(--green-light)); color:#041814; }
.btn.info { background:linear-gradient(135deg, var(--blue), var(--blue-light)); color:#fff; }
.btn.purple { background:linear-gradient(135deg, var(--purple), var(--purple-light)); color:#fff; }
.btn.amber { background:linear-gradient(135deg, var(--amber), var(--amber-light)); color:#041814; }
.btn.cyan { background:linear-gradient(135deg, var(--cyan), var(--cyan-light)); color:#041814; }
.btn.small { padding:8px 14px; font-size:11px; width:auto; }
.btn.block { width:100%; }
.btn.big { padding:16px 20px; font-size:15px; }

/* ═══ مودال مخصص (بدل prompt/confirm) ═══ */
.dialog-overlay { position:fixed; inset:0; z-index:600; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:24px; }
.dialog-overlay.show { display:flex; animation:fadeIn 0.25s; }
.dialog-box { background:linear-gradient(145deg, var(--teal), var(--teal-dark)); border:2px solid var(--gold); border-radius:22px; width:100%; max-width:400px; padding:24px 20px; animation:scaleIn 0.3s; box-shadow:0 25px 70px rgba(0,0,0,0.8); }
.dialog-icon { font-size:48px; text-align:center; margin-bottom:12px; }
.dialog-title { font-size:17px; color:var(--gold-light); font-weight:900; text-align:center; margin-bottom:10px; }
.dialog-message { font-size:13px; color:rgba(255,255,255,0.85); text-align:center; line-height:1.6; margin-bottom:20px; }
.dialog-input { width:100%; padding:12px 14px; background:rgba(4,24,20,0.7); border:1px solid var(--border); border-radius:11px; color:#fff; font-size:14px; font-family:inherit; font-weight:600; outline:none; margin-bottom:16px; }
.dialog-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.15); }
.dialog-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* ═══ حقول إدخال ═══ */
input[type="text"], input[type="number"], input[type="date"], textarea, select { width:100%; padding:12px 14px; background:rgba(4,24,20,0.7); border:1px solid var(--border); border-radius:11px; color:#fff; font-size:13px; font-family:inherit; font-weight:600; outline:none; margin-bottom:12px; transition:0.2s; }
input:focus, textarea:focus, select:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.15); }
select option { background:var(--teal-deep); color:#fff; }
textarea { resize:vertical; min-height:80px; }
label { display:block; font-size:12px; color:rgba(255,255,255,0.85); font-weight:700; margin-bottom:7px; }

/* ═══ Chips الاختيار ═══ */
.chips-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.chip-select { padding:9px 14px; border-radius:18px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.85); font-size:12px; font-weight:700; cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:5px; font-family:inherit; user-select:none; }
.chip-select.selected { background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--teal-deep); border-color:var(--gold); box-shadow:0 4px 15px rgba(201,162,39,0.3); }

/* ═══ شبكة الأهداف ═══ */
.target-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin-bottom:12px; }
@media (max-width:480px) { .target-grid { grid-template-columns:repeat(3, 1fr); } }

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* 🆕 v23: دالة آمنة لقراءة data-* attributes (بدل inline onclick مع interp) */
function readOnclickData(el, attrName) {
  if (!el) return null;
  return el.getAttribute(`data-${attrName}`);
}

/* 🆕 v23: دالة آمنة لإسناد onclick عبر dataset */
function bindClickData(el, attrName, handler) {
  if (!el) return;
  const dataAttr = `data-${attrName}`;
  el.setAttribute("data-bound", "true");
  el.onclick = (e) => {
    e.stopPropagation();
    const val = el.getAttribute(dataAttr);
    if (val !== null) handler(val);
  };
}

function showToast(msg, type = "success", duration = 2800) {
  const c = document.getElementById("toastContainer");
  if (!c) return;
  const t = document.createElement("div");
  t.className = "toast " + type;
  const icons = { success:"✅", danger:"⚠️", info:"ℹ️", warn:"🔔" };
  t.innerHTML = `<span>${icons[type] || "ℹ️"}</span><span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => t.remove(), duration);
}

function fmtTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function fmtDateShort(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1}`;
}
function fmtDate(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleString("ar-OM", { dateStyle:"short", timeStyle:"short" });
}
function timeAgo(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return "الآن";
  if (diff < 3600) return `قبل ${Math.floor(diff / 60)} د`;
  if (diff < 86400) return `قبل ${Math.floor(diff / 3600)} س`;
  if (diff < 604800) return `قبل ${Math.floor(diff / 86400)} يوم`;
  return d.toLocaleDateString("ar-OM");
}
function hoursSince(ts) {
  if (!ts) return 0;
  return (Date.now() - new Date(ts).getTime()) / 3600000;
}
function daysSince(ts) {
  if (!ts) return 999;
  return (Date.now() - new Date(ts).getTime()) / 86400000;
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function cleanCenter(n) {
  return (n || "").toString().replace("مركز إسعاف ", "").trim();
}
function getCurrentShiftByTime() {
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  if (minutes >= 330 && minutes < 810) return "morning";
  if (minutes >= 810 && minutes < 1290) return "evening";
  return "night";
}
function centerMatches(a, b) {
  if (!a || !b) return false;
  const ac = cleanCenter(a);
  const bc = cleanCenter(b);
  if (ac === bc) return true;
  if (ac && bc && (ac.includes(bc) || bc.includes(ac))) return true;
  return false;
}
function isWithin7Days(ts) {
  if (!ts) return false;
  return daysSince(ts) <= DATA_FRESHNESS_DAYS;
}

function filterFreshIssues(issues) {
  return issues.filter(i => {
    if (i.status !== "resolved" && !i.isPraise) return true;
    const date = i.resolvedAt || i.timestamp;
    return isWithin7Days(date);
  });
}
function filterFreshVisits(visits) {
  return visits.filter(v => isWithin7Days(v.timestamp));
}
function filterFreshInternal(issues) {
  return issues.filter(i => {
    if (i.status !== "resolved") return true;
    return isWithin7Days(i.resolvedAt || i.timestamp);
  });
}

/* 🆕 v23: هل تجاوزت SLA؟ */
function isSLAExceeded(issue) {
  if (issue.status === "resolved" || issue.isPraise) return false;
  const slaHours = SLA_HOURS[issue.severity] || 24;
  return hoursSince(issue.timestamp) > slaHours;
}

function checkRateLimit() {
  try {
    const raw = localStorage.getItem(RATE_LIMIT_KEY);
    const now = Date.now();
    let list = raw ? JSON.parse(raw) : [];
    list = list.filter(t => (now - t) < RATE_LIMIT_WINDOW);
    if (list.length >= RATE_LIMIT_MAX) return { ok: false, remaining: 0 };
    return { ok: true, remaining: RATE_LIMIT_MAX - list.length };
  } catch(e) {
    return { ok: true, remaining: RATE_LIMIT_MAX };
  }
}
function recordRateLimitHit() {
  try {
    const raw = localStorage.getItem(RATE_LIMIT_KEY);
    const now = Date.now();
    let list = raw ? JSON.parse(raw) : [];
    list = list.filter(t => (now - t) < RATE_LIMIT_WINDOW);
    list.push(now);
    localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify(list));
  } catch(e) {}
}

    sector: user.sector || "",
    scope: user.scope || "full",

    role: "supervisor",
    type: "supervisor",
    savedAt: new Date().toISOString()
  };
  const json = JSON.stringify(payload);
  try {
    localStorage.setItem(SESSION_KEYS.primary, json);
    localStorage.setItem(SESSION_KEYS.fallback, json);
    localStorage.setItem(SESSION_KEYS.legacy, json);
    localStorage.setItem(SESSION_TIME_KEY, Date.now().toString());
    sessionStorage.setItem(SESSION_KEYS.primary, json);

function loadSession() {
  const tryParse = (raw) => {
    try { const d = JSON.parse(raw || "null"); if (d && d.code) return d; } catch(e) {}
    return null;
  };
  let s = tryParse(sessionStorage.getItem(SESSION_KEYS.primary))
       || tryParse(sessionStorage.getItem(SESSION_KEYS.fallback));
  if (s) return s;
  s = tryParse(localStorage.getItem(SESSION_KEYS.primary))
   || tryParse(localStorage.getItem(SESSION_KEYS.fallback))
   || tryParse(localStorage.getItem(SESSION_KEYS.legacy));
  if (s) {
    const savedTime = parseInt(localStorage.getItem(SESSION_TIME_KEY) || "0");
    if (savedTime && (Date.now() - savedTime) > (24 * 60 * 60 * 1000)) return null;
    return s;
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════
   🆕 v23: IndexedDB — Offline-first Storage
   ═══════════════════════════════════════════════════════════ */
const DB_NAME = "supervisor_offline_v23";
const DB_VERSION = 1;
const DB_STORES = {
  issues: "issues",
  drafts: "drafts",
  queue: "sync_queue"
};

let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    if (!window.indexedDB) return reject(new Error("IndexedDB not supported"));
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORES.issues)) {
        db.createObjectStore(DB_STORES.issues, { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains(DB_STORES.drafts)) {
        db.createObjectStore(DB_STORES.drafts, { keyPath: "key" });
      }
      if (!db.objectStoreNames.contains(DB_STORES.queue)) {
        db.createObjectStore(DB_STORES.queue, { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    req.onerror = (e) => reject(e.target.error);
  });
}

async function idbPut(storeName, data) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      const req = store.put(data);
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e.target.error);
    });
  } catch(e) {
    console.warn("IndexedDB put:", e);
    return null;
  }
}

async function idbGet(storeName, key) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e.target.error);
    });
  } catch(e) {
    return null;
  }
}

async function idbGetAll(storeName) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e.target.error);
    });
  } catch(e) {
    return [];
  }
}

async function idbDelete(storeName, key) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      const req = store.delete(key);
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => reject(e.target.error);
    });
  } catch(e) {
    return false;
  }
}

async function idbClear(storeName) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      const req = store.clear();
      req.onsuccess = () => resolve(true);
      req.onerror = (e) => reject(e.target.error);
    });
  } catch(e) {
    return false;
  }
}

  console.log("📥 queued for sync:", collection, data.id);

/* 🆕 v23: معالجة طابور المزامنة عند العودة للإنترنت */
async function processSyncQueue() {
  try {
    const queue = await idbGetAll(DB_STORES.queue);
    if (queue.length === 0) return;
    console.log("🔄 processing sync queue:", queue.length);
    let successCount = 0;
    for (const item of queue) {
      try {
        await fsAdd(item.collection, item.data);
        await idbDelete(DB_STORES.queue, item.id);
        successCount++;
      } catch(e) {
        console.warn("sync item failed:", e);
        item.retries = (item.retries || 0) + 1;
        if (item.retries < 3) await idbPut(DB_STORES.queue, item);
        else await idbDelete(DB_STORES.queue, item.id);
      }
    }
    if (successCount > 0) {
      showToast(`✅ تمت مزامنة ${successCount} عنصر`, "success", 3500);
      syncFromCloud(true);
    }
  } catch(e) {
    console.warn("processSyncQueue:", e);
  }
}

let dialogResolve = null;
let dialogMode = "confirm";

function showDialog({ icon = "❓", title = "تأكيد", message = "", type = "confirm", placeholder = "", defaultValue = "", confirmText = "تأكيد", cancelText = "إلغاء", confirmType = "" }) {
  return new Promise((resolve) => {
    dialogResolve = resolve;
    dialogMode = type;
    document.getElementById("dialogIcon").textContent = icon;
    document.getElementById("dialogTitle").textContent = title;
    document.getElementById("dialogMessage").textContent = message;
    document.getElementById("dialogCancelBtn").textContent = cancelText;
    document.getElementById("dialogConfirmBtn").textContent = confirmText;
    document.getElementById("dialogConfirmBtn").className = "btn " + confirmType;
    
    const inputWrap = document.getElementById("dialogInputWrap");
    const input = document.getElementById("dialogInput");
    if (type === "prompt") {
      inputWrap.style.display = "block";
      input.placeholder = placeholder;
      input.value = defaultValue;
      setTimeout(() => input.focus(), 100);
    } else {
      inputWrap.style.display = "none";
    }
    
    document.getElementById("dialogOverlay").classList.add("show");
  });
}

function closeDialog(confirmed) {
  document.getElementById("dialogOverlay").classList.remove("show");
  const input = document.getElementById("dialogInput");
  const val = input ? input.value : "";
  if (dialogResolve) {
    if (dialogMode === "prompt") dialogResolve(confirmed ? val : null);
    else dialogResolve(confirmed);
    dialogResolve = null;
  }
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type = "sine", vol = 0.15, delay = 0) {
  if (!soundEnabled) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  setTimeout(() => {
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = type;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur + 0.05);
    } catch(e) {}
  }, delay * 1000);
}
function playSuccess() { playTone(523.25, 0.15, "sine", 0.15, 0); playTone(783.99, 0.25, "sine", 0.15, 0.16); }
function playPing() { playTone(660, 0.15, "sine", 0.12, 0); }
function playLockSound() { playTone(440, 0.2, "triangle", 0.1, 0); playTone(330, 0.3, "triangle", 0.1, 0.2); }

}

/* ═══════════════════════════════════════════════════════════
   Firestore REST API
   ═══════════════════════════════════════════════════════════ */
function fromFSValue(v) {
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return parseInt(v.integerValue);
  if ("doubleValue" in v) return parseFloat(v.doubleValue);
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromFSValue);
  if ("mapValue" in v) {
    const o = {};
    for (const k in v.mapValue.fields || {}) o[k] = fromFSValue(v.mapValue.fields[k]);
    return o;
  }
  return null;
}
function toFSValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === "string") return { stringValue: v };
  if (typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === "boolean") return { booleanValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toFSValue) } };
  if (typeof v === "object") {
    const fields = {};
    for (const k in v) fields[k] = toFSValue(v[k]);
    return { mapValue: { fields } };
  }
  return { nullValue: null };
}
function objToDoc(obj) {
  const fields = {};
  for (const k in obj) if (obj[k] !== undefined) fields[k] = toFSValue(obj[k]);
  return { fields };
}
function docToObj(doc) {
  const obj = {};
  if (!doc.fields) return obj;
  for (const k in doc.fields) obj[k] = fromFSValue(doc.fields[k]);
  obj._id = doc.name.split("/").pop();
  return obj;
}
async function fsFetch(url, options = {}) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal, cache: "no-store" });
    clearTimeout(tid);
    return res;
  } catch(e) { clearTimeout(tid); throw e; }
}
async function fsList(col) {
  const res = await fsFetch(`${FIRESTORE_URL}/${col}?pageSize=1000`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const d = await res.json();
  return (d.documents || []).map(docToObj);
}
async function fsAdd(col, data) {
  const clean = { ...data };
  delete clean._id; delete clean.id; delete clean._firestoreId;
  const res = await fsFetch(`${FIRESTORE_URL}/${col}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(objToDoc(clean))
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status} — ${txt.substring(0,200)}`);
  }
  return res.json();
}
async function fsUpdate(col, id, data) {
  const clean = { ...data };
  delete clean._id; delete clean.id; delete clean._firestoreId;
  const res = await fsFetch(`${FIRESTORE_URL}/${col}/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(objToDoc(clean))
  });
  if (!res.ok) {
    const txt = await res.text();

  }

}

/* ═══════════════════════════════════════════════════════════
   Biometric (WebAuthn)
   ═══════════════════════════════════════════════════════════ */
function isBiometricSupported() {
  return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
}
async function checkBiometricAvailable() {
  if (!isBiometricSupported()) return false;
  try {
    if (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    }
  } catch(e) {}
  return false;
}
function randomBytes(len = 32) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return arr;
}
function bufToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToBuf(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}
async function registerBiometric() {
  if (!supervisor) return false;
  if (!isBiometricSupported()) { showToast("⚠️ البصمة غير مدعومة", "warn", 3500); return false; }
  try {
    const rpId = window.location.hostname || "localhost";
    const challenge = randomBytes(32);
    const userId = randomBytes(16);
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { id: rpId, name: "نظام الإسعاف الذكي" },
        user: { id: userId, name: supervisor.code, displayName: supervisor.name },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", requireResidentKey: false },
        timeout: 60000,
        attestation: "none"
      }
    });
    if (cred) {
      const credId = bufToBase64(cred.rawId);
      localStorage.setItem(BIOMETRIC_CRED_KEY, credId);
      localStorage.setItem(BIOMETRIC_KEY, "on");
      localStorage.setItem(BIOMETRIC_USER_KEY, supervisor.code);
      biometricEnabled = true;
      return true;
    }
    return false;
  } catch(e) { console.warn("Biometric register:", e); return false; }
}
async function authenticateBiometric() {
  const credIdB64 = localStorage.getItem(BIOMETRIC_CRED_KEY);
  if (!credIdB64) return false;
  if (!isBiometricSupported()) return false;
  try {
    const rpId = window.location.hostname || "localhost";
    const challenge = randomBytes(32);
    const credId = base64ToBuf(credIdB64);
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge, rpId,
        allowCredentials: [{ id: credId, type: "public-key", transports: ["internal"] }],
        userVerification: "required",
        timeout: 60000
      }
    });
    return !!assertion;
  } catch(e) { console.warn("Biometric auth:", e); return false; }
}
async function toggleBiometric() {
  if (!isBiometricSupported()) { showToast("⚠️ البصمة غير مدعومة", "warn", 3500); return; }
  const available = await checkBiometricAvailable();
  if (!available) { showToast("⚠️ لا يوجد مستشعر بصمة", "warn", 3500); return; }
  if (biometricEnabled) {
    const ok = await confirmDialog("تعطيل البصمة؟", "ستحتاج لإدخال الكود في كل مرة", { confirmText: "تعطيل" });
    if (!ok) return;

    localStorage.removeItem(BIOMETRIC_USER_KEY);

  }
}

function prepareScope() {
  if (!supervisor) return;
  Promise.all([
    fsList("settings").catch(() => []),
    fsList("supervisors").catch(() => [])
  ]).then(([settings, sups]) => {
    if (settings.length > 0) {
      const s = settings[0];
      if (s.sectors) appData.sectors = s.sectors;
      applyBrandFromSettings(s);
    }
    const me = sups.find(x => x.code === supervisor.code);
    if (me) {
      supervisor.name = me.name || supervisor.name;
      supervisor.sector = me.sector || supervisor.sector;
      supervisor.scope = me.scope || supervisor.scope;
      supervisor.centers = me.centers || supervisor.centers || [];
      saveSession(supervisor);
    }
    applySupervisorScope();
  }).catch(() => applySupervisorScope());

function applySupervisorScope() {
  if (!supervisor.sector && !supervisor.scope) {
    document.getElementById("mainApp").classList.add("ready");

  supervisorSector = supervisor.sector || "";

  const allSectorCenters = Object.entries(appData.sectors || {}).flatMap(
    ([sector, centers]) => (centers || []).map(c => ({ sector, name: c }))
  );
  if (supervisorScope === "full") supervisorCenters = (appData.sectors || {})[supervisorSector] || [];
  else if (supervisorScope === "all") supervisorCenters = allSectorCenters.map(x => x.name);
  else if (supervisorScope === "centers" || supervisorScope === "single") supervisorCenters = supervisor.centers || [];
  if (supervisorCenters.length === 0 && supervisorSector) {

  /* ═══════════════════════════════════════════════════════════
   🆕 v23: KPI المبسط — رقم واحد + 4 مؤشرات
   ═══════════════════════════════════════════════════════════ */

function computeMyStats() {
  const fresh = filterFreshIssues(myCreatedIssues);
  const total = fresh.length;
  const resolvedCount = fresh.filter(i => i.status === "resolved" && !i.isPraise).length;
  return {
    total: total,
    resolvedCount: resolvedCount,
    progressCount: fresh.filter(i => i.status === "progress").length,
    praiseCount: fresh.filter(i => i.isPraise).length,
    complaintCount: fresh.filter(i => !i.isPraise).length,
    withImages: fresh.filter(i => i.images && i.images.length > 0).length,
    withGPS: fresh.filter(i => i.gps && i.gps.lat).length,
    maxPerDay: computeMaxPerDay(),
    visitsCount: filterFreshVisits(myVisits).length,
    internalCount: filterFreshInternal(myInternalIssues).length,
    streak: computeStreak(),
    avgResolveHours: computeAvgResolveHours(),
    responseRate: computeResponseRate(),
    criticalCount: fresh.filter(i => 
      !i.isPraise && i.status !== "resolved" && 
      i.severity && (i.severity === "عالي" || i.severity === "critical")
    ).length
  };
}

function computeStreak() {
  const days = new Set(myCreatedIssues.map(i => (i.timestamp || "").slice(0,10)));
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (days.has(key)) { streak++; d.setDate(d.getDate() - 1); }
    else if (i === 0) { d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}
function computeMaxPerDay() {
  const byDay = {};
  myCreatedIssues.forEach(i => {
    const day = (i.timestamp || "").slice(0,10);
    byDay[day] = (byDay[day] || 0) + 1;
  });
  const vals = Object.values(byDay);
  return vals.length ? Math.max(...vals) : 0;
}
function computeAvgResolveHours() {
  const resolved = myCreatedIssues.filter(i => i.status === "resolved" && i.resolvedAt && i.timestamp && !i.isPraise);
  if (resolved.length === 0) return null;
  const total = resolved.reduce((s, i) => {
    const t = (new Date(i.resolvedAt).getTime() - new Date(i.timestamp).getTime()) / 3600000;
    return s + (t > 0 ? t : 0);
  }, 0);
  return Math.round(total / resolved.length);
}
function computeResponseRate() {
  const mine = myCreatedIssues.filter(i => !i.isPraise);
  if (mine.length === 0) return null;
  const responded = mine.filter(i => i.status === "resolved" || i.status === "progress" || (i.comments || []).length > 0).length;
  return Math.round((responded / mine.length) * 100);
}

/* 🆕 v23: KPI مبسط — رقم واحد من 100 + تصنيف */
function computeMyKPI() {
  const stats = computeMyStats();
  if (stats.total === 0 && stats.visitsCount === 0 && stats.internalCount === 0) {
    return { 
      balance: 50, 
      level: "بداية", 
      grade: "B",
      color: "#ffd54f", 
      desc: "ابدأ بتسجيل أول نشاط"
    };
  }
  
  let balance = 50;
  balance += Math.min(15, stats.total * 1.2);
  balance += Math.min(10, stats.praiseCount * 1.5);
  balance += Math.min(12, stats.resolvedCount * 1.5);
  balance += Math.min(5, stats.visitsCount * 0.8);
  balance += Math.min(3, stats.internalCount * 0.5);
  balance += Math.min(5, stats.streak * 0.7);
  if (stats.withImages > 0) balance += Math.min(3, stats.withImages * 0.3);
  if (stats.withGPS > 0) balance += Math.min(2, stats.withGPS * 0.2);
  
  const stuck = myIssues.filter(i => i.status === "new" && !i.isPraise && hoursSince(i.timestamp) > 48).length;
  balance -= Math.min(15, stuck * 3);
  const stuckCritical = myIssues.filter(i =>
    i.status !== "resolved" && !i.isPraise && i.severity && i.severity.includes("عالي") && hoursSince(i.timestamp) > 24
  ).length;
  balance -= Math.min(10, stuckCritical * 5);
  if (stats.responseRate !== null && stats.responseRate < 50) balance -= 5;
  if (stats.avgResolveHours !== null && stats.avgResolveHours > 72) balance -= 5;
  
  balance = Math.max(0, Math.min(100, Math.round(balance)));
  
  let level = "يحتاج تحسين", grade = "D", color = "#ff8a80";
  if (balance >= 90) { level = "ممتاز"; grade = "A"; color = "#69f0ae"; }
  else if (balance >= 75) { level = "جيد"; grade = "B"; color = "#ffd54f"; }
  else if (balance >= 60) { level = "مقبول"; grade = "C"; color = "#ffa726"; }
  
  return { balance, level, grade, color, desc: `آخر 7 أيام` };
}

      }).join("");
    }
  }

  const pending = myIssues.filter(i => i.status !== "resolved" && !i.isPraise).length;
  if (navIssuesBadge) {

    else navIssuesBadge.style.display = "none";
  }
  const navInternalBadge = el("navInternalBadge");
  const openInternal = myInternalIssues.filter(i => i.status !== "resolved").length;
  if (navInternalBadge) {
    if (openInternal > 0) { navInternalBadge.style.display = "flex"; navInternalBadge.textContent = openInternal > 9 ? "9+" : openInternal; }
    else navInternalBadge.style.display = "none";
  }

    if (warnCount > 0) { navDutyBadge.style.display = "flex"; navDutyBadge.textContent = warnCount > 9 ? "9+" : warnCount; }
    else navDutyBadge.style.display = "none";
  }
  const navVisitsBadge = el("navVisitsBadge");
  const weekVisits = myVisits.filter(v => isWithin7Days(v.timestamp)).length;
  if (navVisitsBadge) {
    if (weekVisits > 0) { navVisitsBadge.style.display = "flex"; navVisitsBadge.textContent = weekVisits > 9 ? "9+" : weekVisits; }
    else navVisitsBadge.style.display = "none";

}

function renderDailyGoal() {
  const today = todayKey();
  const count = myCreatedIssues.filter(i => (i.timestamp || "").slice(0,10) === today).length;
  const el = document.getElementById("dailyGoalCount");
  const progress = document.getElementById("dailyGoalProgress");
  if (el) el.textContent = `${count}/${DAILY_GOAL}`;
  if (progress) {
    const pct = Math.min(100, (count / DAILY_GOAL) * 100);
    progress.style.width = pct + "%";
  }
}
function renderStreak() {
  const el = document.getElementById("streakDays");
  if (!el) return;
  el.textContent = computeStreak();
}

function renderSmartAlerts() {
  const el = document.getElementById("smartAlerts");
  if (!el) return;
  const alerts = [];
  const byCenter = {};
  myIssues.forEach(i => {
    if (i.status === "resolved" || i.isPraise) return;
    if (!isWithin7Days(i.timestamp)) return;
    const c = cleanCenter(i.center || i.centerName || "");
    byCenter[c] = (byCenter[c] || 0) + 1;
  });
  Object.entries(byCenter).forEach(([center, count]) => {
    if (count >= 3) {
      alerts.push({
        type: "warning", icon: "🔁",
        title: `نمط متكرر في ${center}`,
        text: `${count} إشكاليات في 7 أيام — يحتاج مراجعة شاملة`
      });
    }
  });
  const stuckCritical = myIssues.filter(i =>
    i.status !== "resolved" && !i.isPraise &&
    i.severity && i.severity.includes("عالي") && hoursSince(i.timestamp) > 24
  );
  if (stuckCritical.length > 0) {
    alerts.push({
      type: "danger", icon: "🚨",
      title: `${stuckCritical.length} إشكالية حرجة معلقة`,
      text: `مضت أكثر من 24 ساعة — تصعيد فوري مطلوب`
    });
  }
  const stuck = myIssues.filter(i =>
    i.status === "new" && !i.isPraise && hoursSince(i.timestamp) > 48
  );
  if (stuck.length > 0) {
    alerts.push({
      type: "info", icon: "⏰",
      title: `${stuck.length} إشكالية لم تُعالَج`,
      text: `مضت أكثر من 48 ساعة — تحتاج متابعة`
    });
  }
  const today = todayKey();
  const todayCount = myCreatedIssues.filter(i => (i.timestamp || "").slice(0,10) === today).length;
  if (todayCount >= DAILY_GOAL) {
    alerts.push({
      type: "success", icon: "🎉",
      title: "أحسنت! حققت هدف اليوم",
      text: `سجّلت ${todayCount} إشكالية/إشادة اليوم`
    });
  }
  el.innerHTML = alerts.slice(0, 3).map(a => `
    <div class="smart-alert ${a.type}">
      <span class="sa-icon">${a.icon}</span>
      <div class="sa-content">
        <div class="sa-title">${esc(a.title)}</div>
        <div class="sa-text">${esc(a.text)}</div>
      </div>
    </div>
  `).join("");
}

function countOpenShifts() {
  const currentKey = getCurrentShiftByTime();
  let count = 0;
  supervisorCenters.forEach(c => {
    const key = cleanCenter(c) + "_" + currentKey;
    if (myShifts[key] && myShifts[key].status === "open") count++;
  });
  return count;
}
function countWarnCenters() {
  const currentKey = getCurrentShiftByTime();
  let count = 0;
  supervisorCenters.forEach(c => {
    const key = cleanCenter(c) + "_" + currentKey;
    const shift = myShifts[key];
    if (!shift || shift.status !== "open") {
      const anyOpen = Object.keys(myShifts).some(k =>
        k.startsWith(cleanCenter(c) + "_") && myShifts[k].status === "open"
      );
      if (!anyOpen) count++;
    }
  });
  return count;
}

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">

        <span style="padding:4px 12px;border-radius:12px;font-size:10px;font-weight:900;background:${openCount > 0 ? 'linear-gradient(135deg, var(--green), var(--green-light))' : 'rgba(255,255,255,0.1)'};color:${openCount > 0 ? '#041814' : 'rgba(255,255,255,0.6)'};">
          ${openCount}/${totalCenters} مفتوح
        </span>
      </div>
      <div style="background:rgba(4,24,20,0.5);padding:10px;border-radius:10px;text-align:center;font-size:11px;color:rgba(255,255,255,0.75);">
        ${openCount === totalCenters
          ? '✅ جميع مراكزك فتحت الشفت'
          : (openCount === 0

function renderUrgentAlerts() {
  const el = document.getElementById("urgentAlerts");
  if (!el) return;
  const alerts = [];
  const critical = myIssues.filter(i =>
    i.status !== "resolved" && i.severity &&
    (i.severity === "critical" || i.severity.includes("عالي"))
  ).length;
  if (critical > 0) alerts.push({ type:"danger", icon:"🚨", text:`${critical} إشكالية حرجة`, onclick:"switchPage('issues', 'critical')" });
  const late = countWarnCenters();
  if (late > 0) alerts.push({ type:"warn", icon:"⏰", text:`${late} مركز لم يفتح الشفت`, onclick:"switchPage('duty')" });
  el.innerHTML = alerts.map(a => `
    <div class="warning-bar ${a.type}" onclick="${a.onclick}" style="cursor:pointer;">
      <span>${a.icon}</span><span>${esc(a.text)}</span>
    </div>
  `).join("");
}

function renderDutyQuick() {
  const el = document.getElementById("dutyQuickList");
  const updatedEl = document.getElementById("dutyQuickUpdated");
  if (!el) return;
  if (updatedEl) updatedEl.textContent = `آخر تحديث: ${fmtTime(new Date().toISOString())}`;
  const currentKey = getCurrentShiftByTime();
  if (supervisorCenters.length === 0) {
    el.innerHTML = '<div class="empty" style="padding:20px;font-size:12px;">لا توجد مراكز في نطاقك</div>';
    return;
  }
  el.innerHTML = supervisorCenters.slice(0, 5).map(c => renderShiftCardMini(c, currentKey)).join("") +
    (supervisorCenters.length > 5
      ? `<button class="btn secondary block small" onclick="switchPage('duty')" style="margin-top:8px;">عرض كل المراكز (${supervisorCenters.length}) ←</button>`
      : "");
}

function renderRecentIssues() {
  const fresh = filterFreshIssues(myIssues);
  const recent = [...fresh].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 3);
  const countEl = document.getElementById("recentIssuesCount");
  if (countEl) countEl.textContent = recent.length;
  const el = document.getElementById("recentIssues");
  if (!el) return;
  if (recent.length === 0) {
    el.innerHTML = '<div class="empty" style="padding:20px;font-size:12px;">لا توجد إشكاليات حديثة</div>';

    el.innerHTML = recent.map(i => renderIssueCard(i)).join("");

}

/* ═══════════════════════════════════════════════════════════
   الإشكاليات
   ═══════════════════════════════════════════════════════════ */
function filterIssues(filter, btn) {
  currentIssuesFilter = filter;
  document.querySelectorAll("#issuesFilters .filter-pill").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderIssues();
}
function renderIssues() {
  if (!supervisor) return;
  const fresh = filterFreshIssues(myIssues);
  let list = [...fresh].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  if (currentIssuesFilter === "open") list = list.filter(i => i.status !== "resolved" && !i.isPraise);
  else if (currentIssuesFilter === "critical") list = list.filter(i =>
    i.status !== "resolved" && i.severity && (i.severity === "critical" || i.severity.includes("عالي"))
  );
  else if (currentIssuesFilter === "resolved") list = list.filter(i => i.status === "resolved" && !i.isPraise);
  else if (currentIssuesFilter === "mine") list = list.filter(i =>
    i.supervisor === supervisor.name || i.supervisorCode === supervisor.code
  );
  else if (currentIssuesFilter === "praise") list = list.filter(i => i.isPraise);
  const countEl = document.getElementById("issuesCount");
  if (countEl) countEl.textContent = list.length;
  const el = document.getElementById("issuesList");
  if (!el) return;
  if (list.length === 0) {
    el.innerHTML = '<div class="empty"><span class="icon">✅</span>لا توجد إشكاليات</div>';
    return;
  }
  el.innerHTML = list.slice(0, 100).map(i => renderIssueCard(i)).join("");
}

/* 🆕 v23: تلوين SLA — إشكالية تجاوزت وقتها */
function renderIssueCard(issue) {
  const meta = { paramedic: "👨‍🚒", center: "🏥", vehicle: "🚑", medical_stock: "💊", equipment: "🧰" };
  const icon = meta[issue.targetType] || "📌";
  const isPraise = issue.isPraise;
  const status = issue.status || "new";
  const d = new Date(issue.timestamp);
  const timeStr = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const dateStr = `${d.getDate()}/${d.getMonth()+1}`;
  const isOverdue = status !== "resolved" && !isPraise && hoursSince(issue.timestamp) > 8;
  const slaExceeded = isSLAExceeded(issue);
  
  let statusChip = "";
  if (isPraise) statusChip = '<span class="chip praise">⭐ إشادة</span>';
  else if (status === "resolved") statusChip = '<span class="chip resolved">✅ محلولة</span>';
  else if (status === "progress") statusChip = '<span class="chip progress">🟡 قيد المعالجة</span>';
  else if (status === "escalated") statusChip = '<span class="chip escalated">🔴 مُصعّدة</span>';
  else statusChip = '<span class="chip new">🆕 جديدة</span>';
  
  const commentsCount = (issue.comments || []).length;
  const centerDisplay = issue.center || issue.centerName || "";
  const imagesCount = (issue.images || []).length;
  
  return `
    <div class="issue-card ${isPraise ? 'praise-card' : 'status-' + status}${slaExceeded ? ' sla-warning' : ''}" data-issue-id="${esc(issue.id)}" onclick="openIssueDetailFromEl(this)">
      <div class="issue-head">
        <div class="issue-target">${icon} ${esc(issue.targetName || issue.issueType || "—")}</div>
        <div class="issue-time" style="${isOverdue ? 'color:#ff5252;font-weight:900;' : ''}">${dateStr} • ${timeStr}${slaExceeded ? ' ⏰' : ''}</div>
      </div>
      ${issue.description ? `<div class="issue-desc">${esc(issue.description.substring(0, 120))}${issue.description.length > 120 ? "..." : ""}</div>` : ""}
      <div class="issue-chips">
        ${statusChip}
        ${issue.severity && !isPraise ? `<span class="chip ${issue.severity.includes('عالي') ? 'high' : issue.severity.includes('متوسط') ? 'mid' : 'low'}">${esc(issue.severity)}</span>` : ""}
        ${centerDisplay ? `<span class="chip blue">🏥 ${esc(cleanCenter(centerDisplay))}</span>` : ""}
        ${imagesCount > 0 ? `<span class="chip img">📷 ${imagesCount}</span>` : ""}
        ${issue.gps ? `<span class="chip gps">📍 موقع</span>` : ""}
        ${commentsCount > 0 ? `<span class="chip comments">💬 ${commentsCount}</span>` : ""}
        ${slaExceeded ? `<span class="chip critical">⏰ متأخرة</span>` : ""}
      </div>
    </div>
  `;
}

/* 🆕 v23: قراءة issueId من data-* (بدل inline onclick) */
function openIssueDetailFromEl(el) {
  const id = readOnclickData(el, "issueId");
  if (id) openIssueDetail(id);

/* ═══════════════════════════════════════════════════════════
   تفاصيل الإشكالية
   ═══════════════════════════════════════════════════════════ */
function openIssueDetail(issueId) {
  const issue = myIssues.find(i => i.id === issueId) || myCreatedIssues.find(i => i.id === issueId);
  if (!issue) return;
  const status = issue.status || "new";
  const meta = { paramedic: "👨‍🚒", center: "🏥", vehicle: "🚑", medical_stock: "💊", equipment: "🧰" };
  const icon = meta[issue.targetType] || "📌";
  const comments = issue.comments || [];
  const isPraise = issue.isPraise;
  const isMine = issue.supervisor === supervisor.name || issue.supervisorCode === supervisor.code;
  const slaExceeded = isSLAExceeded(issue);
  
  let statusChip = "";
  if (isPraise) statusChip = '<span class="chip praise">⭐ إشادة</span>';
  else if (status === "resolved") statusChip = '<span class="chip resolved">✅ محلولة</span>';
  else if (status === "progress") statusChip = '<span class="chip progress">🟡 قيد المعالجة</span>';
  else if (status === "escalated") statusChip = '<span class="chip escalated">🔴 مُصعّدة</span>';
  else statusChip = '<span class="chip new">🆕 جديدة</span>';
  
  /* 🆕 v23: صور بصيغة جديدة (سلسلة أو كائن {dataUrl}) */
  let imagesHtml = "";
  if (issue.images && issue.images.length) {
    imagesHtml = `<div style="margin-top:14px;">
      <div style="font-size:12px;color:var(--gold-light);font-weight:900;margin-bottom:8px;">📷 الصورة</div>
      <div class="detail-images-grid">
        ${issue.images.map((img, idx) => {
          const src = typeof img === "string" ? img : (img.dataUrl || "");
          if (!src) return "";
          return `<div class="detail-image-item" data-img-src="${esc(src.substring(0, 50))}..." onclick="showImageModal('${esc(src.substring(0, 20))}...')"><img src="${src}"></div>`;
        }).join("")}
      </div>
    </div>`;
  }
  
  let gpsHtml = "";
  if (issue.gps && issue.gps.lat) {
    gpsHtml = `<div style="margin-top:14px;padding:10px 14px;background:rgba(41,182,246,0.12);border:1px solid rgba(41,182,246,0.4);border-radius:12px;">
      <div style="font-size:12px;color:#81d4fa;font-weight:900;margin-bottom:6px;">📍 الموقع</div>
      <div style="font-size:11px;opacity:0.85;direction:ltr;font-family:'Courier New',monospace;">${issue.gps.lat.toFixed(5)}, ${issue.gps.lng.toFixed(5)}</div>
      <a href="https://maps.google.com/?q=${issue.gps.lat},${issue.gps.lng}" target="_blank" style="display:inline-block;margin-top:8px;padding:6px 14px;background:rgba(41,182,246,0.25);border-radius:10px;color:#81d4fa;font-size:11px;font-weight:900;text-decoration:none;">🗺️ فتح في الخرائط</a>
    </div>`;
  }
  
  const commentsHtml = comments.length === 0
    ? '<div class="empty" style="padding:20px;font-size:12px;">لا تعليقات</div>'
    : comments.map(c => {
        const roleIcon = c.role === "officer" ? "🎖️" : c.role === "admin" ? "🏛️" : c.role === "center" ? "🏥" : "👨‍💼";
        const roleLabel = c.role === "officer" ? "ضابط" : c.role === "admin" ? "الإدارة" : c.role === "center" ? "مركز" : "مشرف";
        return `<div class="comment-item ${c.role || ''}">
          <div class="comment-head">
            <div><span class="comment-author">${roleIcon} ${esc(c.author || "—")}</span><span class="comment-role">${roleLabel}</span></div>
            <span style="font-size:9px;opacity:0.7;">${fmtTime(c.timestamp)}</span>
          </div>
          <div class="comment-text">${esc(c.text || "")}</div>
        </div>`;
      }).join("");
  
  let resolutionBox = "";
  if (!isPraise && status !== "resolved" && isMine) {
    resolutionBox = `
